target: strength.view.yml
icon: dumbbell
date_field: date
# History-panel highlight: for each day in the history sheet, the row with
# the largest e1rm (Weight × (1 + Reps/30)) gets the "top set" tint.
# The measure itself is declared on strength.view.yml.
top_metric: max_e1rm
plannable:
  log_field: start_time
  log_format: time_string
post_log:
  model: sonnet
  prompt: |
    You're a sharp, technical strength coach. The user just logged a set,
    and you're judging it against the rest of today's workout AND the
    previous workout for the same exercise.

    Just-logged set:
      {{ row['exercise'] }} — {{ row['weight'] }} × {{ row['reps'] }}{% if row['rpe'] %} @ RPE {{ row['rpe'] }}{% endif %} {% if row['notes'] %}({{ row['notes'] }}){% endif %}

    Today's {{ row['exercise'] }} sets so far (this includes the just-logged set):
    {% for r in today_for('exercise', row['exercise']) %}
    - {{ r['weight'] }} × {{ r['reps'] }}{% if r['rpe'] %} @ RPE {{ r['rpe'] }}{% endif %} {% if r['notes'] %}— {{ r['notes'] }}{% endif %}
    {% else %}
    - (this is the first {{ row['exercise'] }} set today)
    {% endfor %}

    Previous {{ row['exercise'] }} workouts (newest first, up to 3):
    {% for workout in last_workouts_for('exercise', row['exercise'], 3) %}
    {{ workout[0]['date'] }}:
    {% for s in workout %}
      - {{ s['weight'] }} × {{ s['reps'] }}{% if s['rpe'] %} @ RPE {{ s['rpe'] }}{% endif %} {% if s['notes'] %}— {{ s['notes'] }}{% endif %}
    {% endfor %}
    {% else %}
    - (no prior {{ row['exercise'] }} sessions on record)
    {% endfor %}

    Reply with ONE short sentence — 22 words max — that compares this
    set to what you'd expect given today's ramp AND the previous workout.
    Call out one specific thing: a PR, a regression, a planned warmup
    landing as expected, a load/rep change vs. last session, or an RPE
    pattern. Be precise — reference actual numbers from the context, not
    generic platitudes. No emoji. No filler.
list_display:
  title: exercise
  subtitle: ${weight} × ${reps}
fields:
  id:
    editable: false
  date:
    widget: date
    default: today
    required: true
  day_of_week:
    derive:
      from: date
      format: weekday_long
  exercise:
    widget: autocomplete
    required: true
    history: true
    placeholder: e.g. Barbell Squat
    # Opinionated canonical list (2026-09-21): the four mains (+ the
    # legacy press name) first, then the top exercises by live-sheet
    # frequency with a recent-year bias (top ~30 all-time union recent
    # staples; 33k rows analyzed). Autocomplete stays free-form — anything
    # else can be typed and lands in the ad-hoc cache; show_when groups
    # below apply regardless of this list.
    options:
    - Barbell Squat
    - Barbell Deadlift
    - Flat Barbell Bench Press
    - Overhead Press
    - Barbell Standing Military Press
    - Pull Up
    - Muscle Up
    - Cable Face Pull
    - Seated Cable Row
    - Lateral Dumbbell Raise
    - Hanging Leg Raise
    - Parallel Bar Triceps Dip
    - Cable External Rotation
    - Lat Pulldown
    - Strict Wall EZ-Bar Curl
    - Dumbbell Hammer Curl
    - Muscle Up Green Band
    - Inverted Rows Rings
    - Back to Wall Handstand Pushup
    - EZ-Bar Preacher Curl
    - Front Lever Up And Down
    - Lateral Cable Raise (Partials)
    - Chin Up
    - Barbell Row
    - Plank
    - Dumbbell Row
    - Foot Supported L Sit
    - Back to Wall Handstand Pushup On Half Paralettes
    - Elevated Paralette Pushup
    - Barbell Incline Bench Press
    - Diamond Pushup
    - One Handed Pushup
    - Dumbbell Curl
    - Dumbbell Front Raise
    - Dumbbell Bicep Curl
    - Rowing Machine
    - Barbell Front Squat
  weight:
    widget: number
    required: true
    min: 0
    show_when:
      exercise:
        not_in_group: [isometric, timed, mobility]
  reps:
    widget: number
    required: true
    min: 0
    max: 100
    show_when:
      exercise:
        not_in_group: [isometric, timed]
  duration:
    widget: number
    required: true
    min: 0
    placeholder: "seconds"
    show_when:
      exercise:
        in_group: isometric
  start_time:
    widget: text
    placeholder: 3:54:00 PM
    now_button: true
  end_time:
    widget: text
    placeholder: 3:54:00 PM
    now_button: true
  rpe:
    widget: number
    min: 1
    max: 10
    # Subjective per-set — never copied by exercise-history autofill.
    autofill: false
    show_when:
      exercise:
        not_in_group: [isometric, timed, mobility]
  # --- Equipment/technique flags (2026-09-21) ---------------------------
  # Tri-state switches: blank = not recorded (NEVER coerced to false).
  # autofill: false on all four — carrying gear flags over from a past
  # session would fabricate records; blank must mean "not asked/answered".
  # The dims exist on EVERY row (the schema carries the option everywhere);
  # show_when only limits which forms surface them: belted is form-visible
  # on squat/deadlift only (user never belts bench/ohp — an edit or the
  # coach can still set it on any row).
  paused:
    widget: switch
    autofill: false
    show_when:
      exercise:
        in: [Flat Barbell Bench Press, Barbell Squat]
  belted:
    widget: switch
    autofill: false
    show_when:
      exercise:
        in: [Barbell Squat, Barbell Deadlift]
  wrist_wraps:
    widget: switch
    autofill: false
    show_when:
      exercise:
        in: [Flat Barbell Bench Press, Overhead Press, Barbell Standing Military Press]
  knee_sleeves:
    widget: switch
    autofill: false
    show_when:
      exercise:
        in: [Barbell Squat, Barbell Deadlift]
  notes:
    widget: longtext
    autofill: false

# Named, reusable value sets for show_when. Adding more (e.g. cardio
# modalities, machine groups) is just another entry here — no schema
# change required.
groups:
  # Timed-session exercises: just start_time + end_time + notes. No
  # weight/reps/duration/rpe — the start/end stamps are the data.
  timed:
    - Handstand Practice
  # Low-load mobility/prep exercises: just reps. Weight + RPE hidden
  # because bodyweight mobility isn't a progressive-overload target —
  # the rep is the lever. Duration stays hidden (set count, not hold).
  mobility:
    - Open Books
    - Chin Tucks
    - Wall Slides
    - Serratus Wall Slides
  isometric:
    - Thoracic Extension (Foam Roller)
    - Lat Stretch
    - Farmer Carry
    - Tuck Front Lever
    - Quick front lever
    - Hollow Body Hold
    - Plank
    - Side plank
    - Side plank with leg raised
    - Side plank with lateral raise
    - Side Bridge
    - Foot Supported L Sit
    - Straight leg L sit
    - Bended Leg L-sit
    - Chair L-sit
    - L sit handstand swing
    - L sit handstand negative
    - Arch Body Hold
    - Reverse Plank
    - Superman
    - Stomach To Wall Handstand
    - Held Pull Up
    - Bench Press Heavy Hold
    - Dumbbell static bench
    - Dumbbell static floor press
    - Dumbbell hold (reps in seconds)
    - Deep squat dynamic stretch
    - Ankle dorsiflexion stretch
    - Peroneals Stretch
    - Adductor rock
    - Chair Sit
