name: strength_tracker
description: "Strength training analysis over the strength set log — exercises, sets, reps, and RPE for calculating 1RM and training volume. Focuses on main compound lifts: Overhead Press, Barbell Squat, Barbell Deadlift, and Flat Barbell Bench Press. Uses Lombardi formula for 1RM estimation. Reads the same `strength` tab as the strength tracker."
datasource: gsheets
table: strength

entities:
  - name: workout_set
    type: primary
    description: "Individual set of an exercise"
    key: set_id

dimensions:
  - name: set_id
    type: string
    description: "Unique identifier for each set"
    expr: "id"

  - name: date
    type: date
    description: "Date of the workout"
    expr: "CAST(Date AS DATE)"

  - name: year
    type: number
    description: "Year of the workout"
    expr: "EXTRACT(YEAR FROM CAST(Date AS DATE))"

  - name: month
    type: date
    description: "Month start date for aggregation"
    expr: "DATE_TRUNC('month', CAST(Date AS DATE))"
    synonyms: ["year-month", "month"]

  - name: week
    type: date
    description: "Week start date (Monday) for aggregation"
    expr: "DATE_TRUNC('week', CAST(Date AS DATE))"
    synonyms: ["week start", "week"]

  - name: day_of_week
    type: string
    description: "Day of week name"
    expr: "\"Day of Week\""
    samples: ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"]
    synonyms: ["weekday", "day"]

  - name: exercise
    type: string
    description: "Name of the exercise performed. Use exact values when filtering."
    expr: "Exercise"
    samples: ["Barbell Squat", "Barbell Deadlift", "Flat Barbell Bench Press", "Overhead Press"]
    synonyms: ["lift", "movement", "exercise name", "squat", "squatting", "deadlift", "bench press", "bench", "OHP", "overhead press"]

  - name: is_main_lift
    type: boolean
    description: "Whether this is one of the four main compound lifts"
    expr: "Exercise IN ('Overhead Press', 'Barbell Squat', 'Barbell Deadlift', 'Flat Barbell Bench Press')"
    synonyms: ["main compound lift", "primary lift"]

  - name: weight
    type: number
    description: "Weight lifted in pounds"
    expr: "Weight"
    synonyms: ["load", "weight lifted"]

  - name: reps
    type: number
    description: "Number of repetitions performed"
    expr: "Reps"
    synonyms: ["repetitions"]

  - name: duration
    type: number
    description: "Hold/work duration in seconds (used for isometric exercises that don't have a weight/reps notion)"
    expr: "TRY_CAST(Duration AS DOUBLE)"
    synonyms: ["hold time", "work duration"]

  - name: rpe
    type: number
    description: "Rate of Perceived Exertion (1-10 scale)"
    expr: "TRY_CAST(RPE AS DOUBLE)"
    synonyms: ["difficulty", "effort level"]

  - name: start_time
    type: string
    description: "Time of day the set was started (blank = planned)"
    expr: "\"Start Time\""

  - name: paused
    type: boolean
    description: "Paused reps (dead stop at chest/bottom). Tri-state: NULL/blank = not recorded — never assume false. Structured since 2026-09; older rows may only carry the info in Notes."
    expr: "TRY_CAST(Paused AS BOOLEAN)"
    synonyms: ["paused rep", "pause"]

  - name: belted
    type: boolean
    description: "Lifting belt worn (squat/deadlift; belted is their default variant, beltless ~3-4% weaker). Tri-state: NULL/blank = not recorded — never assume false. Backfilled for squat/deadlift from notes + effort inference 2026-09."
    expr: "TRY_CAST(Belted AS BOOLEAN)"
    synonyms: ["belt", "with belt", "beltless"]

  - name: estimated_1rm
    type: number
    description: "Estimated one-rep max using Lombardi formula: weight * reps^0.1"
    expr: "Weight * POWER(Reps, 0.1)"
    synonyms: ["1RM", "one rep max", "max strength"]

  - name: volume
    type: number
    description: "Training volume for the set (weight × reps)"
    expr: "Weight * Reps"
    synonyms: ["work", "total volume"]

  - name: intensity
    type: number
    description: "Relative intensity as percentage of estimated 1RM"
    expr: "(Weight / (Weight * POWER(Reps, 0.1))) * 100"
    synonyms: ["% of 1RM", "intensity percentage"]

  - name: rpe_adjusted_e1rm
    type: number
    description: "Estimated one-rep max adjusted for RPE using Epley formula. Accounts for reps in reserve (RIR = 10 - RPE) to give a more accurate E1RM than Lombardi. Falls back to Lombardi when RPE is not recorded."
    expr: |
      CASE
        WHEN TRY_CAST(RPE AS DOUBLE) IS NOT NULL AND TRY_CAST(RPE AS DOUBLE) > 0
        THEN Weight * (1.0 + (CAST(Reps AS DOUBLE) + (10.0 - TRY_CAST(RPE AS DOUBLE))) / 30.0)
        ELSE Weight * POWER(Reps, 0.1)
      END
    synonyms: ["RPE 1RM", "RPE-adjusted 1RM", "adjusted E1RM", "true 1RM"]

measures:
  - name: total_sets
    type: count
    description: "Total number of sets performed. Includes warmup sets — do not use raw set counts to judge training volume or overtraining. Use total_volume or max_estimated_1rm instead"
    synonyms: ["set count"]

  - name: main_lift_sets
    type: count
    description: "Total sets of main compound lifts only. Includes warmup sets — a typical session may have 5-6 warmup sets before 3-5 working sets. Do not interpret high set counts as overtraining"
    filters:
      - expr: "Exercise IN ('Overhead Press', 'Barbell Squat', 'Barbell Deadlift', 'Flat Barbell Bench Press')"

  - name: total_volume
    type: sum
    description: "Total training volume (sum of weight × reps)"
    expr: "Weight * Reps"
    synonyms: ["total work", "cumulative volume"]

  - name: main_lift_volume
    type: sum
    description: "Total volume for main compound lifts only"
    expr: "Weight * Reps"
    filters:
      - expr: "Exercise IN ('Overhead Press', 'Barbell Squat', 'Barbell Deadlift', 'Flat Barbell Bench Press')"

  - name: training_frequency
    type: count_distinct
    description: "Number of unique training days"
    expr: "Date"
    synonyms: ["workout days", "training days"]

  - name: squat_days
    type: count_distinct
    description: "Number of days with barbell squat. Group by day_of_week to see which days squats are typically done"
    expr: "Date"
    filters:
      - expr: "Exercise = 'Barbell Squat'"
    synonyms: ["squat frequency"]

  - name: deadlift_days
    type: count_distinct
    description: "Number of days with barbell deadlift. Group by day_of_week to see which days deadlifts are typically done"
    expr: "Date"
    filters:
      - expr: "Exercise = 'Barbell Deadlift'"
    synonyms: ["deadlift frequency"]

  - name: bench_days
    type: count_distinct
    description: "Number of days with bench press. Group by day_of_week to see which days bench is typically done"
    expr: "Date"
    filters:
      - expr: "Exercise = 'Flat Barbell Bench Press'"
    synonyms: ["bench frequency"]

  - name: ohp_days
    type: count_distinct
    description: "Number of days with overhead press. Group by day_of_week to see which days OHP is typically done"
    expr: "Date"
    filters:
      - expr: "Exercise = 'Overhead Press'"
    synonyms: ["overhead press frequency", "OHP frequency"]

  # Barbell Squat Metrics
  - name: max_squat_1rm
    type: max
    description: "Maximum estimated 1RM for barbell squat using Lombardi formula"
    expr: "Weight * POWER(Reps, 0.1)"
    filters:
      - expr: "Exercise = 'Barbell Squat'"
    synonyms: ["squat 1RM", "max squat"]

  - name: total_volume_squat
    type: sum
    description: "Total volume for barbell squat"
    expr: "Weight * Reps"
    filters:
      - expr: "Exercise = 'Barbell Squat'"
    synonyms: ["squat volume"]

  - name: squat_sets
    type: count
    description: "Number of barbell squat sets"
    filters:
      - expr: "Exercise = 'Barbell Squat'"

  # Deadlift Metrics
  - name: max_deadlift_1rm
    type: max
    description: "Maximum estimated 1RM for deadlift using Lombardi formula"
    expr: "Weight * POWER(Reps, 0.1)"
    filters:
      - expr: "Exercise = 'Barbell Deadlift'"
    synonyms: ["deadlift 1RM", "max deadlift"]

  - name: total_volume_deadlift
    type: sum
    description: "Total volume for deadlift"
    expr: "Weight * Reps"
    filters:
      - expr: "Exercise = 'Barbell Deadlift'"
    synonyms: ["deadlift volume"]

  - name: deadlift_sets
    type: count
    description: "Number of deadlift sets"
    filters:
      - expr: "Exercise = 'Barbell Deadlift'"

  # Bench Press Metrics
  - name: max_bench_1rm
    type: max
    description: "Maximum estimated 1RM for bench press using Lombardi formula"
    expr: "Weight * POWER(Reps, 0.1)"
    filters:
      - expr: "Exercise = 'Flat Barbell Bench Press'"
    synonyms: ["bench 1RM", "max bench"]

  - name: total_volume_bench
    type: sum
    description: "Total volume for bench press"
    expr: "Weight * Reps"
    filters:
      - expr: "Exercise = 'Flat Barbell Bench Press'"
    synonyms: ["bench volume"]

  - name: bench_sets
    type: count
    description: "Number of bench press sets"
    filters:
      - expr: "Exercise = 'Flat Barbell Bench Press'"

  # Overhead Press Metrics
  - name: max_overhead_press_1rm
    type: max
    description: "Maximum estimated 1RM for overhead press using Lombardi formula"
    expr: "Weight * POWER(Reps, 0.1)"
    filters:
      - expr: "Exercise = 'Overhead Press'"
    synonyms: ["OHP 1RM", "max overhead press"]

  - name: total_volume_overhead_press
    type: sum
    description: "Total volume for overhead press"
    expr: "Weight * Reps"
    filters:
      - expr: "Exercise = 'Overhead Press'"
    synonyms: ["OHP volume", "overhead press volume"]

  - name: overhead_press_sets
    type: count
    description: "Number of overhead press sets"
    filters:
      - expr: "Exercise = 'Overhead Press'"

  # RPE-Adjusted E1RM Measures (Epley formula with RIR)
  - name: max_squat_rpe_e1rm
    type: max
    description: "Maximum RPE-adjusted E1RM for barbell squat using Epley formula with reps in reserve"
    expr: |
      CASE
        WHEN TRY_CAST(RPE AS DOUBLE) IS NOT NULL AND TRY_CAST(RPE AS DOUBLE) > 0
        THEN Weight * (1.0 + (CAST(Reps AS DOUBLE) + (10.0 - TRY_CAST(RPE AS DOUBLE))) / 30.0)
        ELSE Weight * POWER(Reps, 0.1)
      END
    filters:
      - expr: "Exercise = 'Barbell Squat'"
    synonyms: ["squat RPE 1RM", "squat true 1RM"]

  - name: max_deadlift_rpe_e1rm
    type: max
    description: "Maximum RPE-adjusted E1RM for deadlift using Epley formula with reps in reserve"
    expr: |
      CASE
        WHEN TRY_CAST(RPE AS DOUBLE) IS NOT NULL AND TRY_CAST(RPE AS DOUBLE) > 0
        THEN Weight * (1.0 + (CAST(Reps AS DOUBLE) + (10.0 - TRY_CAST(RPE AS DOUBLE))) / 30.0)
        ELSE Weight * POWER(Reps, 0.1)
      END
    filters:
      - expr: "Exercise = 'Barbell Deadlift'"
    synonyms: ["deadlift RPE 1RM", "deadlift true 1RM"]

  - name: max_bench_rpe_e1rm
    type: max
    description: "Maximum RPE-adjusted E1RM for bench press using Epley formula with reps in reserve"
    expr: |
      CASE
        WHEN TRY_CAST(RPE AS DOUBLE) IS NOT NULL AND TRY_CAST(RPE AS DOUBLE) > 0
        THEN Weight * (1.0 + (CAST(Reps AS DOUBLE) + (10.0 - TRY_CAST(RPE AS DOUBLE))) / 30.0)
        ELSE Weight * POWER(Reps, 0.1)
      END
    filters:
      - expr: "Exercise = 'Flat Barbell Bench Press'"
    synonyms: ["bench RPE 1RM", "bench true 1RM"]

  - name: max_overhead_press_rpe_e1rm
    type: max
    description: "Maximum RPE-adjusted E1RM for overhead press using Epley formula with reps in reserve"
    expr: |
      CASE
        WHEN TRY_CAST(RPE AS DOUBLE) IS NOT NULL AND TRY_CAST(RPE AS DOUBLE) > 0
        THEN Weight * (1.0 + (CAST(Reps AS DOUBLE) + (10.0 - TRY_CAST(RPE AS DOUBLE))) / 30.0)
        ELSE Weight * POWER(Reps, 0.1)
      END
    filters:
      - expr: "Exercise = 'Overhead Press'"
    synonyms: ["OHP RPE 1RM", "overhead press true 1RM"]

  - name: max_rpe_adjusted_e1rm
    type: max
    description: "Maximum RPE-adjusted E1RM across all exercises using Epley formula with reps in reserve"
    expr: |
      CASE
        WHEN TRY_CAST(RPE AS DOUBLE) IS NOT NULL AND TRY_CAST(RPE AS DOUBLE) > 0
        THEN Weight * (1.0 + (CAST(Reps AS DOUBLE) + (10.0 - TRY_CAST(RPE AS DOUBLE))) / 30.0)
        ELSE Weight * POWER(Reps, 0.1)
      END
    synonyms: ["RPE 1RM", "true 1RM", "adjusted E1RM"]

  # Declared e1RM source of truth (working-max spec, 2026-09-21): Epley
  # with reps capped at 12. lib/services/program_metrics.dart (epleyE1rm)
  # and the working-max controller must match this expression exactly.
  - name: max_e1rm_capped
    type: max
    description: "Maximum estimated 1RM using Epley formula with reps capped at 12: weight * (1 + min(reps, 12) / 30). The authoritative e1RM definition — program metrics and the working-max controller mirror this expression."
    expr: "Weight * (1 + MIN(Reps, 12) / 30.0)"
    synonyms: ["capped E1RM", "Epley 1RM", "reference e1RM"]

  # RPE-adjusted capped e1RM (progress-tracking source of truth,
  # 2026-09-25): effective reps = capped reps + RIR (10 - RPE), the
  # TOTAL capped at 12 — an RPE-8 double counts as 4 effective reps
  # (you had 2 more in the tank), so submaximal work off a cut doesn't
  # read as strength loss. Rows WITHOUT an RPE fall back to plain
  # capped Epley via COALESCE(10 - RPE, 0) → 0 extra reps — i.e. they
  # are treated as taken to failure, the legacy max_e1rm_capped
  # behavior. Two-arg MIN is the sqlite scalar form (precedent:
  # max_e1rm_capped). The app's progress displays (STRENGTH card
  # recent column, strength-domain recent metric) mirror this in
  # lib/services/program_metrics.dart (rpeAdjustedE1rm); the §2.5
  # effort-grading reference and the working-max controller stay on
  # max_e1rm_capped.
  - name: max_e1rm_rpe
    type: max
    description: "Maximum RPE-adjusted estimated 1RM: Epley over effective reps = min(min(reps, 12) + RIR, 12) where RIR = 10 - RPE. Better current-1RM estimate when training away from failure; rows without RPE degrade to the capped Epley (at-failure) estimate."
    expr: "Weight * (1 + MIN(MIN(Reps, 12) + COALESCE(10 - RPE, 0), 12) / 30.0)"
    synonyms: ["RPE-adjusted e1RM", "capped RPE E1RM", "recent e1RM (RPE-adj)"]

  # General 1RM (across all exercises)
  - name: max_estimated_1rm
    type: max
    description: "Maximum estimated 1RM across all exercises using Lombardi formula"
    expr: "Weight * POWER(Reps, 0.1)"
    synonyms: ["1RM", "estimated 1RM", "one rep max", "max strength"]

  # General metrics
  - name: avg_rpe
    type: average
    description: "Average rate of perceived exertion"
    expr: "TRY_CAST(RPE AS DOUBLE)"
    synonyms: ["mean RPE", "average effort"]

  - name: high_intensity_sets
    type: count
    description: "Number of sets with RPE >= 8"
    filters:
      - expr: "TRY_CAST(RPE AS DOUBLE) >= 8"
