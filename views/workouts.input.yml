target: workouts.view.yml
icon: flame
date_field: done_at
list_display:
  title: kind
  subtitle: ${duration_min} min
fields:
  id:
    editable: false
  done_at:
    widget: datetime
    default: now
    required: true
  kind:
    widget: dropdown
    options: [strength, cardio, mobility, climbing]
    required: true
  duration_min:
    widget: number
    required: true
    min: 0
    max: 1440
  notes:
    widget: longtext
