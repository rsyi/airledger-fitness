name: strength
description: "Strength set log — one row per set. Equipment/technique flags (paused, belted, wrist_wraps, knee_sleeves) are tri-state: blank = not recorded, never assume false."
datasource: gsheets
table: strength
entities:
  - { name: strength_set, type: primary, key: id }
dimensions:
  - { name: id, type: string, expr: id }
  - { name: date, type: date, expr: Date, description: Workout day }
  - { name: day_of_week, type: string, expr: Day of Week }
  - { name: exercise, type: string, expr: Exercise, description: Exercise name (free-form; suggestions from history) }
  - { name: weight, type: number, expr: Weight }
  - { name: reps, type: number, expr: Reps }
  - { name: duration, type: number, expr: Duration, description: "Hold/work duration in seconds (used for isometric exercises that don't have a weight/reps notion)" }
  - { name: start_time, type: string, expr: Start Time, description: Time of day (blank = planned). Tap the clock to stamp now. }
  - { name: end_time, type: string, expr: End Time, description: "Time the set ended (useful for timed practice like handstand). Tap the clock to stamp now." }
  - { name: rpe, type: number, expr: RPE, description: "Rate of Perceived Exertion (1-10). RIR convention: RIR = 10 - RPE — no separate RIR field by design." }
  # Set intent (recomp tracking spec, 2026-09-27). Optional; blank on all
  # legacy rows — the weekly-review counters effort-infer untagged rows.
  # warmup + skill (+ rehab) never count as productive hypertrophy sets.
  - { name: set_type, type: string, expr: Set Type, description: "What the set was for: warmup | heavy | hypertrophy | skill | rehab. Blank = untagged (legacy rows)." }
  # Equipment/technique flags (2026-09-21). Tri-state booleans: blank =
  # not recorded (historical rows predate these columns), TRUE/FALSE only
  # when explicitly set. The working-max controller prefers these over
  # notes-keyword parsing when present.
  - { name: paused, type: boolean, expr: Paused, description: "Paused reps (dead stop at the chest/bottom). Bench default is paused; FALSE means touch-and-go." }
  - { name: belted, type: boolean, expr: Belted, description: "Lifting belt worn. Squat/deadlift default variant is belted; FALSE = beltless (~3-4% weaker)." }
  - { name: wrist_wraps, type: boolean, expr: Wrist Wraps, description: "Wrist wraps worn (pressing movements)." }
  - { name: knee_sleeves, type: boolean, expr: Knee Sleeves, description: "Knee sleeves worn (squat/deadlift)." }
  # Form video. Attach (2026-10-02+) is LOCAL + offline: video_url = the
  # on-device content:// clip (legacy 2026-09-28..10-01 rows: a Google
  # Photos deep link). video_media_id = the app's device cache key
  # (legacy rows: the Photos item id). All app-written, never typed.
  - { name: video_url, type: string, expr: Video URL, description: "Video of this set: on-device clip reference (content://), or a legacy Google Photos link." }
  - { name: video_media_id, type: string, expr: Video Media Id, description: "App-managed clip key for video_url (device thumbnail/clip cache + AI-RPE estimate)." }
  # Durable clip siblings (2026-10-14): survive reinstall / a new phone /
  # deleting the clip. Thumb + recording time + duration are captured
  # offline at attach; video_photos_url is added later by the in-app
  # "Link clips to Google Photos" flow (matched on recording time).
  - { name: video_thumb, type: string, expr: Video Thumb, description: "Small JPEG thumbnail of the clip as a data: URI (app-managed, ~10 KB)." }
  - { name: video_taken_at, type: datetime, expr: Video Taken At, description: "When the clip was recorded (local time, from the phone's media metadata)." }
  - { name: video_duration_ms, type: number, expr: Video Duration Ms, description: "Clip length in milliseconds." }
  - { name: video_photos_url, type: string, expr: Video Photos URL, description: "Durable Google Photos link to the clip's backup (photos.google.com/lr/photo/<id>)." }
  - { name: notes, type: string, expr: Notes }
measures:
  - { name: set_count, type: count }
  - { name: total_weight, type: sum, expr: weight }
  - { name: max_e1rm, type: max, expr: Weight * (1 + Reps / 30.0), description: Best estimated 1RM in the period (Epley) }
