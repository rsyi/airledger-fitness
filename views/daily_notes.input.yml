target: daily_notes.view.yml
icon: notebook-pen
date_field: date
list_display:
  title: note
  subtitle: ${day_of_week}
fields:
  id:
    editable: false
  date:
    widget: date
    default: today
    required: true
  day_of_week:
    derive:
      from: date
      format: weekday_long
  note:
    widget: longtext
    required: true
    placeholder: How training felt, soreness, life context…
  # --- Daily recovery subjectives. sleep_hours / sleep_quality / readiness are HIDDEN from the form since 2026-10-01 — Whoop (recovery view) owns sleep + readiness; the dims stay so history is intact.
  # (recomp tracking spec, 2026-09-27; amends intent-layers spec §2.4) --------------------------------------
  # ALL OPTIONAL — the free-text note stays primary. Numbers feed the
  # weekly review's recovery aggregates; the pain field OUTRANKS every
  # numeric target as a coaching signal. Subjective per-day: never
  # autofilled from history.
  sleep_hours:
    widget: number
    min: 0
    max: 14
    placeholder: '7.5'
    autofill: false
    editable: false
  sleep_quality:
    widget: number
    min: 1
    max: 5
    placeholder: 1-5
    autofill: false
    editable: false
  fatigue:
    widget: number
    min: 1
    max: 5
    placeholder: 1-5
    autofill: false
  soreness:
    widget: number
    min: 1
    max: 5
    placeholder: 1-5
    autofill: false
  pain:
    widget: text
    placeholder: joint/tendon issue + where (blank = none)
    autofill: false
  readiness:
    widget: number
    min: 1
    max: 5
    placeholder: 1-5
    autofill: false
    editable: false
