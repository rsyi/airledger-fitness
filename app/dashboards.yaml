# app/dashboards.yaml — domain dashboards + home-IA presentation config
# + the home hero's per-phase eigenvectors (`phases:`, bottom).
#
# ENGINE-FREE: the app fetches this file straight from GitHub (1 h cache,
# pull-to-refresh bust) and parses it in Dart only — it never passes
# through the Rust engine, so keys here need no dylib rebuild and no
# schema mirrors. Presentation, not row semantics. Missing/malformed file
# → the app falls back to the flat Ledgers list; nothing breaks.
#
# Each domain groups view(s) into one home row + one domain screen.
# Domain screens are RECORDS-FIRST (UX redesign 2026-09-21): the ledger
# fills the screen, topped by a one-line `headline:` strip; the full
# metric dashboard lives behind the strip's Trends toggle.
#   paradigm: entry        → LOG section; domain screen keeps the full
#                            timeline affordances (FAB, forms, planning).
#   paradigm: integration  → CONNECTED section; domain screen renders a
#                            read-friendly record list (date-grouped, one
#                            line per record, newest first); the classic
#                            read-only timeline stays behind the app-bar
#                            calendar icon. Views that still accept
#                            writes (weight) keep a manual escape hatch:
#                            ⋮ → "Add entry manually" opens the normal
#                            form for integration gaps (travel, dead
#                            scale battery).
#   views:    view names — the FIRST backs the domain screen's timeline.
#   icon:     lucide icon name (same vocabulary as the input.yml icons).
#   label:    human display name (Log list + domain screen title);
#             absent → the humanized name (daily_notes → "Daily notes").
#   description: one-line Log-list subtitle shown when today's program
#             has no call for the domain; absent → the view description's
#             first clause. Older apps ignore both keys safely.
#   headline: metric ids for the compact strip above the records — the
#     2-3 numbers worth seeing every open (e.g. strength: wilks +
#     pl_total → "Wilks 306.1 · PL 1222 lb"). Stats show their first
#     chip, series their latest point, grade_pyramid its top grade.
#     Absent → the app defaults to stat/best-kind metrics, capped at 3.
#   list_fields: salient columns for the integration record list, in
#     display order. Bare string (grade) or map ({ field: calories,
#     unit: kcal }) — units are appended to numeric values. Absent →
#     the app falls back to the view's list_display.
#   metrics:  the Trends dashboard's entries.
#     kind: stat (latest/derived value) | best (all-time) | series (chart)
#     id (built-ins): pl_total, e1rm_reference, all_time_best_weight,
#       wilks, wilks_series, bw_series, bf_series, kcal_series,
#       protein_series, grade_pyramid, session_frequency, hr_4x4_series
#     goal: number → target line/reference; explicit null → no goal set.
#     from: series window start date. wilks_series also anchors its
#       dashed reference line to the metric's value AS OF this date
#       (block-0 start → "the Wilks you walked into the cut with").
#     floor_pct: acceptable-drop floor, percent BELOW the from-anchored
#       reference — the chart draws a second (dotted) line at
#       reference × (1 − floor_pct/100); sinking under it is the act
#       signal (wilks_series). Older apps ignore the key safely.
#     goal_note: human context when the goal isn't a bare number.
#     goal_band_per_lb: [low, high] g-per-lb-of-bodyweight band — the app
#       scales it by the current 7-day-avg bodyweight and shades the
#       range on the chart (protein_series).
#     lifts: main-lift filter for per-lift strength metrics.

domains:
  - name: strength
    label: Strength
    description: "Sets, weight × reps, RPE"
    paradigm: entry
    views: [strength]
    icon: dumbbell
    headline: [wilks, pl_total] # "Wilks 306.1 · PL 1222 lb" above the log
    metrics:
      - id: pl_total
        kind: stat
        label: "PL total — sum of best capped e1RMs (S+B+D+P)"
        unit: lb
        goal: null # no declared total goal yet
      # Current-1RM ESTIMATE for progress tracking (2026-09-25): recent
      # 14-day best on the RPE-adjusted capped e1RM — the
      # strength_tracker `max_e1rm_rpe` measure's basis (RIR = 10 - RPE
      # counts as reps, total capped at 12; rows without RPE score
      # as-is, i.e. at-failure). The home STRENGTH card's recent column
      # shows the same numbers.
      - id: recent_e1rm_rpe
        kind: stat
        label: "recent e1RM (RPE-adjusted, 14-day)"
        unit: lb
        lifts: [squat, bench, deadlift, press]
      # §2.5 GRADING reference — plain capped Epley by design (effort
      # grading is backtest-calibrated against it); NOT a current-1RM
      # display. Kept distinct from recent_e1rm_rpe on purpose.
      - id: e1rm_reference
        kind: stat
        label: "e1RM reference (42-day)"
        unit: lb
        lifts: [squat, bench, deadlift, press]
      - id: all_time_best_weight
        kind: best
        label: "all-time best actual weight"
        unit: lb
        lifts: [squat, bench, deadlift, press]
      # Wilks (SBD): WILKS-2020 male, classic squat+bench+deadlift total
      # (press excluded — NOT pl_total). Basis = ACTUAL MAX since
      # 2026-09-22 (user: "done against actually max lift numbers, not
      # e1RM"): per period per lift the heaviest weight actually lifted
      # (any reps >= 1 — a 405×2 counts as 405), carried forward when
      # untrained. The stat is weekly-current; the SERIES is
      # month-to-month (deload weeks make weekly points noisy) with
      # monthly-mean bodyweight carried through months with no
      # weigh-ins, so history runs back through sparse eras. The app
      # also draws the ALL-TIME BENCHMARK line — the series' absolute
      # max ("best ever 364.7 · May '24") — the yardstick the current
      # score is tracked against.
      - id: wilks
        kind: stat
        label: "Wilks (SBD, actual lifts) — weekly"
      - id: wilks_series
        kind: series
        label: "Wilks (SBD, actual lifts) — monthly"
        from: "2026-09-21" # block-0 (cut) start — keep in sync with program.yaml
        # Acceptable drop below the cut-start reference, on the
        # actual-max basis: reference 306.1 → floor 298.5 (2026-09-22;
        # was 327.3 → 319.1 on the retired e1RM basis).
        floor_pct: 2.5
        # Trailing plot window in years (48 monthly points). User-tunable;
        # delete the key (or set null) for the full history. Tooltips
        # carry the year on multi-year windows either way. 2026-09-22.
        window_years: 4
        goal_note: "hold within 2.5% of cut start; 3+ weeks below the floor = act"

  # Weight is INTEGRATION paradigm (2026-09-21): Withings feeds it, so
  # the screen is a read surface — record list + Trends, no FAB. Manual
  # weigh-ins stay possible via ⋮ → "Add entry manually" (the view keeps
  # its input overlay; rows write to the ledger + sync like any entry).
  - name: weight
    label: Weight
    description: "Withings weigh-ins and body fat"
    paradigm: integration
    views: [weight]
    icon: scale
    headline: [bw_series, bf_series] # latest bw + bf above the records
    list_fields:
      - { field: weight_lbs, unit: lb }
      - { field: body_fat_withing, unit: "% bf" }
      - time
    metrics:
      - id: bw_series
        kind: series
        label: "body weight"
        unit: lb
        goal: 154 # cut target (coach/phase.yaml target_weight_lb)
        goal_note: "phase target — keep in sync with phase.yaml"
      - id: bf_series
        kind: series
        label: "body fat"
        unit: "%"

  - name: cardio
    label: Cardio
    description: "4x4 intervals"
    paradigm: entry
    views: [cardio]
    icon: heart-pulse
    headline: [hr_4x4_series] # last session's max HR above the log
    metrics:
      - id: hr_4x4_series
        kind: series
        label: "4x4 max HR"
        unit: bpm

  - name: daily_notes
    label: Daily notes
    description: "Journal · sleep, fatigue, pain"
    paradigm: entry
    views: [daily_notes]
    icon: notebook-pen
    metrics: [] # journal — no numeric dashboard

  - name: climbing
    label: Climbing
    description: "Kaya ascents"
    paradigm: integration
    views: [climbing]
    icon: mountain
    headline: [grade_pyramid, session_frequency] # "top v7 · sess/wk 2"
    list_fields: [grade, color, gym, ascent_type]
    metrics:
      - id: grade_pyramid
        kind: best
        label: "grade pyramid"
      - id: session_frequency
        kind: series
        label: "sessions / wk"
        goal: 2
        goal_note: "program climbing_wk — 2 in lifting blocks, 3 in climbing blocks"

  # Calisthenics skill log (recomp tracking spec 2026-09-27): entry
  # paradigm — skill quality/progression, not hypertrophy volume.
  - name: calisthenics
    label: Calisthenics
    description: "Skill sets and holds"
    paradigm: entry
    views: [calisthenics]
    icon: person-standing
    metrics: [] # bests are per-skill/variation — surfaced by the weekly review + recomp dashboard rows

  - name: meals
    label: Meals
    description: "Macrofactor via Health Connect"
    paradigm: integration
    views: [meals]
    icon: utensils
    headline: [kcal_series, protein_series] # yesterday/today's totals
    list_fields:
      - meal
      - { field: calories, unit: kcal }
      - { field: protein_g, unit: g }
    metrics:
      - id: kcal_series
        kind: series
        label: "calories"
        unit: kcal
      - id: protein_series
        kind: series
        label: "protein"
        unit: g
        goal_band_per_lb: [0.8, 1.0] # shaded band, scaled by current 7d-avg bw
        goal_note: "0.8–1.0 g/lb of bodyweight"

  # Recovery is INTEGRATION paradigm (Whoop API → recovery tab,
  # 2026-09-30): the Whoop developer-API background pull OWNS the
  # objective sleep/recovery fields, so the screen is a read surface
  # (record list + Trends). Manual corrections stay possible via ⋮ →
  # "Add entry manually" (the view keeps its input overlay). This is the
  # OBJECTIVE recovery data — daily_notes still carries the hand-logged
  # subjectives (sleep_quality/fatigue/soreness/pain/readiness).
  - name: recovery
    label: Recovery
    description: "Whoop sleep and recovery"
    paradigm: integration
    views: [recovery]
    icon: moon
    headline: [recovery_score, hrv_ms] # latest recovery score + HRV
    list_fields:
      - recovery_score
      - { field: hrv_ms, unit: ms }
      - { field: sleep_hours, unit: h }
    metrics:
      - id: recovery_score
        kind: series
        label: "recovery score"
      - id: hrv_ms
        kind: series
        label: "HRV"
        unit: ms
      - id: sleep_hours
        kind: series
        label: "sleep"
        unit: h

  # Whoop workouts (strain) is INTEGRATION paradigm (Whoop API →
  # whoop_workouts tab, 2026-09-30): SESSION-level strain scores, one
  # row per Whoop-detected workout, pulled over the same window as
  # sleep/recovery. Read surface (record list + Trends). Kept DISTINCT
  # from `recovery` (that is daily sleep/HRV; this is per-workout
  # cardiovascular load) so the coach can line a workout's strain up
  # against the day's logged training session by date/time overlap. The
  # strain series plots the day's HARDEST workout (max strain).
  - name: whoop_workouts
    label: Whoop workouts
    description: "Whoop strain per workout"
    paradigm: integration
    views: [whoop_workouts]
    icon: activity
    headline: [strain_series] # latest workout's strain above the records
    list_fields:
      - sport
      - strain
      - { field: max_hr, unit: bpm }
      - { field: duration_min, unit: min }
    metrics:
      - id: strain_series
        kind: series
        label: "workout strain"

# last_bulk: — the home STRENGTH card's second column (2026-09-22,
# user: "show my numbers from my last bulk"): per lift the heaviest
# weight ACTUALLY lifted inside [start, end], Wilks-priced at the
# contemporaneous monthly bodyweight; the all-time top moved to the
# card's click-in sheet. `end` is the declared cut (coach/phase.yaml
# v1 effective_from, "Ending the 2025 bulk at 186.5"); `start` was
# DERIVED from the weigh-in series — the trailing-7-day-average trough
# (167.6 lb on 2025-02-05) before the sustained climb to the bulk end
# (tool/derive_bulk_window.dart in the app repo reproduces it) — and
# is USER-EDITABLE: move the dates if the derivation misread your
# history. Absent section → the card simply omits the column (older
# apps ignore the key entirely).
last_bulk:
  start: "2025-02-05" # derived weigh-in trough — edit freely
  end: "2025-10-06" # cut declared; keep in sync with phase.yaml
  label: "2025 bulk"

# phases: — the home hero's eigenvectors, keyed by coach/phase.yaml's
# current `value`. The hero renders one row per eigenvector: verdict
# chip (green agree / amber drifting / red act) + the one number that
# matters + a mini sparkline. Parsed by the app only (services/
# phase_eigenvectors.dart); ABSENT section → the pre-hero four-card
# home dashboard renders unchanged (back-compat by construction).
#
# VARIANT SELECTION (2026-09-26, program.yaml v8): when the current
# program version carries `variant: recomposition`, a declared `bulk`
# phase selects the `recomp:` set below instead (services/
# phase_eigenvectors.dart effectivePhaseKey) — the recomp year replaces
# the bulk's gain-rate eigenvector with weight-hold. The `bulk:` set is
# KEPT but unselected while the variant is active (flip the program
# variant off and it comes straight back). A phase declared `recomp`
# directly also selects it.
#
# weekly_drivers: — the home THIS WEEK strip's driver checklist
# (2026-09-22, output>>input principle): NOT activity tallies but the
# few causal inputs that produce the phase's outcome, each tied to the
# outcome it drives (`outcome` names it; `why` is the detail sheet's
# one-line causal story). Parsed by services/week_drivers.dart; a phase
# WITHOUT weekly_drivers (or an older app) keeps the old quota strip.
# Driver ids:
#   top_single_per_lift  each `lifts` entry gets its top-set READING
#                        this week (the working-max controller's own
#                        extraction — heavy_top / saturday_single /
#                        capped / test tick; light_week doesn't; ANY
#                        reps) — per-lift ticks. Squat/deadlift ticks
#                        wear this week's alternation side (heavy/light
#                        week tags,
#                        from program.yaml planned_alternation), and
#                        heavy_single_max_days adds the every-two-weeks
#                        heavy-single recency line (≤2 reps at RPE ≥
#                        7.5; amber past the config, red a week later)
#   bench_frequency      distinct bench days ≥ target
#   lift_frequency       per-lift distinct days vs per_lift_targets
#   near_max_exposure    near-max sets this week ≥ target
#   protein_floor        daily-avg protein ≥ floor_g_per_lb × current bw
#   climbing_cap         session days vs cap — over is the bad state;
#                        stale kaya snapshot renders "as of <date>"
#   bike_4x4             4x4 session days ≥ target
#
# Eigenvector vocabulary:
#   weight_loss | gain_rate | weight_hold
#     rate_band: [lo, hi] lb/wk the observed 3-week rate should land in
#       (absent → derived from the program slice's gain_rate_lb_wk).
#     act_above / act_below: red thresholds — outside the band but
#       inside these is only amber.
#   wilks_stability | strength_gain
#     from: reference anchor date — weekly Wilks AS OF this day is the
#       yardstick (absent → the running block's start date).
#     floor_pct: acceptable drop below the reference, percent.
#     act_weeks_below: consecutive weeks under the floor → act (def. 3).
#     strength_gain additionally wants current >= reference (a bulk
#     should trend UP; holding above the floor is only amber).
#   inputs_delivered
#     near_max_sets + working_sets from the nightly program_status row
#     vs the program's targets-in-force (§5.4), pro-rated mid-week.
phases:
  cut:
    eigenvectors:
      # Losing weight: -1.6..-0.5 lb/wk (phase target -0.75; trajectory
      # 163 → 154 by Dec 13). Fast edge: cap ≈ 1% of bodyweight/week —
      # the evidence-based muscle-preservation ceiling for trained
      # lifters (Garthe 2011: 0.7%/wk preserved LBM vs 1.4%/wk; Helms
      # guidance 0.5–1%/wk); at ~161 lb → 1.6 lb/wk. User-approved
      # 2026-09-25.
      - id: weight_loss
        label: weight
        rate_band: [-1.6, -0.5]
        act_above: 0.2 # gaining on a cut — PHASE_MISMATCH territory
        act_below: -1.8 # clearly past the 1%/wk cap — muscle risk, eat
      # ...without losing strength: weekly Wilks (actual-max basis,
      # 2026-09-22) vs the cut-start reference (306.1 on 2026-09-21)
      # with the 2.5% floor (~298.5).
      - id: wilks_stability
        label: strength
        from: "2026-09-21" # block-0 start — sync with wilks_series above
        floor_pct: 2.5
        act_weeks_below: 3
    # Cut drivers — REVISED 2026-09-28 for the approved cut-training
    # revision (program.yaml v11 targets_block_0: near_max 4 = one wave
    # top per lift, bench_days 3, squat/press 2, hypertrophy band
    # [8, 12] ACTIVE for the cut; base protein_g_per_lb [0.8, 1.0]
    # UNCHANGED — the absolute 160-175 floor starts Dec 14).
    # heavy_single_max_days is RETIRED here: the wave's weekly tops are
    # 5/4/3-rep sets, so the ≤2-rep recency line would never refresh;
    # the alternation (H)/(L) tags disappear with planned_alternation.
    weekly_drivers:
      - id: top_single_per_lift
        label: tops
        lifts: [squat, bench, deadlift, press]
        outcome: "Wilks preserved"
        why: "Every main lift tops weekly on the cut wave (5@81% / 4@84% / 3@86% / deload 5@~70% TM at RPE 7-8) — the heavy stimulus that keeps neural drive and the working max honest through the deficit."
      # v11: the recomp spec's dual-exposure rule runs through the cut
      # too — hypertrophy is first-class in the deficit program.
      - id: dual_exposure
        label: lifts
        lifts: [squat, bench, deadlift, press]
        hyp_sets_min: 2
        hyp_reps: [4, 12]
        outcome: "muscle retained + built in the deficit"
        why: "Each main lift gets BOTH exposures weekly — the wave top plus its %TM volume slots (bench 4x8@68 + 3x6@72 + 3x8@65; squat 3x8@65; OHP 3x8@62; deadlift 2x4-6@75 — hence the 2-set minimum). Two half-ticks per lift; a 4-5 rep wave top double-counts into the volume half by design."
      - id: hypertrophy_volume
        label: muscle sets
        band: [8, 12]
        muscle_groups: [quads, hamstrings_glutes, chest, lats, upper_back, side_delts, rear_delts, biceps, triceps]
        outcome: "muscle retained (hypertrophy-maximizing deficit)"
        why: "8-12 productive sets per muscle group per week, overlap-counted from compounds + climbing + calisthenics via the program's exercise_muscle_map. OVER the band goes red — pulling volume stacks fast (climbing, MU, pull-ups on lats; rows, face pulls on upper back). Tracked-only groups (lower back, front delts, forearms, core) are not banded."
      - id: bench_frequency
        label: bench days
        target: 3
        outcome: "bench / Wilks held"
        why: "Bench detrains fastest of the four — the v11 schedule spreads three weekly exposures (Mon 68% volume, Wed heavy, Fri 65% volume)."
      # Protein floor stays the CUT-ERA relative 0.8-1.0 g/lb until
      # Dec 14 (the revision changed training only; the recomp phase's
      # absolute 160-175 g floor takes over with the phase flip).
      - id: protein_floor
        label: protein
        floor_g_per_lb: 0.8
        outcome: "muscle retention"
        why: "Under 0.8 g/lb in a deficit the weight coming off stops being mostly fat."
      - id: climbing_cap
        label: climb
        cap: 2
        outcome: "weight rate + Wilks"
        why: "Recovery budget: a third session in a deficit taxes the same recovery the lifts and the loss rate depend on. Under the cap is fine."
      - id: bike_4x4
        label: 4x4
        target: 1
        outcome: "VO2 maintained"
        why: "One weekly 4x4 keeps the aerobic top end without eating recovery."
    # GOALS tab (bottom-nav split 2026-09-29): the input eigenvectors the
    # user controls day to day, as plain-language rows with a met /
    # partial / unmet state. Parsed by services/goals_service.dart; a
    # phase WITHOUT `goals:` (or an older app) shows the screen's "no
    # goals declared" placeholder. Goal ids: macros / calorie_band /
    # hard_sets / muscle_stimulus / climbing / cardio_4x4 / zone2_run.
    # Cut set:
    goals:
      - id: macros
        label: Macros
        description: "Protein high enough to hold muscle in the deficit; carbs to fuel the hard sessions."
        protein_g_per_lb: [0.8, 1.0]   # cut-era relative floor (targets_block_0)
        carbs_floor_g_day: 150         # soft "enough" — cut has no hard carb target
      - id: calorie_band
        label: Calories
        description: "Stay in a modest deficit — intake below your estimated maintenance."
        calorie_mode: deficit
      - id: hard_sets
        label: Program sets per lift
        description: "Working sets logged per main lift vs what this week's program prescribes (top sets, back-offs and volume slots; moves and skips applied) — Monday to Sunday, the same count as the Today card."
        lifts: [squat, bench, deadlift, press]
        # Targets are DERIVED from the effective program week (app
        # 2026-10-02+). hard_set_target is only the legacy fallback when
        # no program week is available (and what older apps show);
        # `hard_set_targets: {lift: n}` would OVERRIDE the derived target
        # for a lift — none needed now (deadlift's 3 is what the program
        # prescribes).
        hard_set_target: 10
        hard_rpe_min: 7   # the secondary "RPE 7 or higher" count
        # Associated accessories per lift, from the routine (editable):
        # a per-lift check that the supporting work got hit this week.
        accessories:
          squat: [Bulgarian Split Squat]
          bench: [Triceps Extension]
          deadlift: [Romanian Deadlift]
          press: [Seated Cable Row]
      - id: muscle_stimulus
        label: Sets per muscle group
        description: "Working sets per muscle group this week (Monday to Sunday) from the program's exercise-to-muscle credits, climbing sessions included. Aim for 8-12 per group. Over 12 is excess overlapping volume (flagged per group); under mid-week just means not done yet — the detail shows who trails an even pace."
        band: [8, 12]
        # muscle_groups / tracked_groups: omitted → the program's
        # hypertrophy_targets groups (v16: 9 banded + tracked-only
        # lower_back/front_delts/forearms/core, shown without a band).
      - id: climbing
        label: Climbing
        description: "Two climbing sessions a week."
        target: 2
      - id: cardio_4x4
        label: Cardio
        description: "One 4x4 interval session a week."
        target: 1
      - id: zone2_run
        label: Zone-2 run
        description: "Nice to have: one easy run a week (the Sunday run) — detected from Whoop, no logging needed."
        optional: true
        target: 1
        min_minutes: 20
        max_avg_hr_pct: 0.75
  bulk:
    eigenvectors:
      # Not gaining too fast: §5.4 gain_rate_lb_wk blocks_2_5 band;
      # switch to [0.1, 0.3] when blocks 6-7 begin (2027-08-16).
      - id: gain_rate
        label: weight
        rate_band: [0.2, 0.5]
        act_above: 0.6 # the program's alarm rate
        act_below: -0.2 # losing on a bulk
      # Gaining strength: Wilks trending up over the block (reference
      # defaults to the running block's start).
      - id: strength_gain
        label: strength
        floor_pct: 1.5
        act_weeks_below: 3
      # Delivering the inputs: near-max + working sets vs the §5.4
      # targets-in-force (28 working / 6 near-max in bulk blocks).
      - id: inputs_delivered
        label: inputs
    # Bulk drivers — §5.4 base targets: squat/bench/press 2 days,
    # deadlift 1, near_max_sets_wk 6, protein_g_per_lb [0.8, 1.0].
    # Gain rate stays an OUTCOME in the hero, not a driver here.
    weekly_drivers:
      - id: lift_frequency
        label: lifts
        per_lift_targets: { squat: 2, bench: 2, press: 2, deadlift: 1 }
        outcome: "steady e1RM growth"
        why: "Each lift ~2x/week (deadlift 1x) is the muscle-group frequency eigenvector specialized to the program — coverage, not volume, drives steady progress."
      - id: near_max_exposure
        label: near-max
        target: 6
        outcome: "e1RM growth"
        why: "Backtest-validated: ~6 near-max sets a week is the productive stretch that actually moves e1RM."
      - id: protein_floor
        label: protein
        floor_g_per_lb: 0.8
        outcome: "lean gain"
        why: "The surplus builds muscle only when the protein floor is met."
  # Recomposition year (program.yaml v9 / coach/post-cut-recomp-spec.md,
  # active from Dec 14 2026): maintenance food, muscle out of the fat
  # store, hypertrophy FIRST-CLASS. Selected via the program `variant`
  # (see the section comment above); the bulk set stays
  # defined-but-unselected. The scale HOLDING FLAT is a SUCCESS state
  # (spec: flat scale + strength/lean mass rising = the plan working;
  # the v8 down-0.5-adds-100 step is reversed).
  # Weight-rule JUDGMENT (spec, encoded 2026-09-27): the true rules are
  # conditioned on waist + performance — allow weight to RISE when
  # waist/BF are stable and performance improves; cut modestly only
  # when weight AND waist rise without performance. Waist is NOT
  # TRACKED YET (no view/data source; open item), so the weight-only
  # verdict below is deliberately SOFT: a generous rate band with far
  # red edges — amber is "look at waist/DEXA/performance", never an
  # automatic kcal change.
  recomp:
    eigenvectors:
      # Hold-to-modest-rise: flat is success; drift up is allowed while
      # performance improves (soft band, spec §Body-Fat/Calorie
      # Control). act_above 0.5 = sustained clearly-not-maintenance
      # intake; act_below -0.5 = a real deficit (slows the building).
      - id: weight_hold
        label: weight
        rate_band: [-0.1, 0.25]
        act_above: 0.5
        act_below: -0.5
      # Gain strength at maintenance: Wilks trending up over the block.
      # The block's RESULT is still the test-week singles (every 8
      # weeks); the weekly Wilks series is the between-tests proxy.
      - id: strength_gain
        label: strength
        floor_pct: 1.5
        act_weeks_below: 3
      # Deliver the inputs — v9 template targets (18 working / 4 heavy
      # exposures) come through the program slice's targets-in-force.
      - id: inputs_delivered
        label: inputs
    # Recomp drivers (v9): DUAL EXPOSURE per lift (heavy top set AND
    # hypertrophy sets — the spec's both-every-week rule), the 8-12
    # per-muscle hypertrophy band (overlap-counted via the program's
    # exercise_muscle_map), the ABSOLUTE protein floor, and the weekly
    # 4x4 (never dropped).
    weekly_drivers:
      - id: dual_exposure
        label: lifts
        lifts: [squat, bench, deadlift, press]
        hyp_sets_min: 3
        hyp_reps: [3, 8]
        outcome: "strength + muscle gain"
        why: "Every main lift gets BOTH exposures each week — a heavy top set (1-3 @ RPE 7-8) keeps the working max moving, and 3+ sets of 3-8 @ RPE 7-9 supply the hypertrophy dose behind it. Two half-ticks per lift."
      - id: hypertrophy_volume
        label: muscle sets
        band: [8, 12]
        muscle_groups: [quads, hamstrings_glutes, chest, lats, upper_back, side_delts, rear_delts, biceps, triceps]
        outcome: "muscle gain"
        why: "8-12 productive sets per muscle group per week (~10 default), overlap-counted from compounds + climbing + calisthenics via the program's exercise_muscle_map. OVER the band goes red — the excess-pulling caution (climbing, MU, pull-ups stack on lats; rows, face pulls on upper back). Tracked-only groups (lower back, front delts, forearms, core) are not banded."
      - id: protein_floor
        label: protein
        floor_g: 160
        band_g: [160, 175]
        outcome: "recomp lean gain"
        why: "Absolute 160-175 g/day, every day (spec) — at maintenance the muscle signal is protein + hard sets; under the floor the recomp stalls."
      - id: bike_4x4
        label: 4x4
        target: 1
        outcome: "VO2 maintained"
        why: "One weekly 4x4, every block, never dropped — the longevity lever."
    # GOALS tab — recomp set (post-cut, from Dec 14). Protein goes
    # ABSOLUTE (160-175 g/day, spec); calories sit at maintenance-to-
    # slightly-over (recomp is muscle at maintenance, not a deficit);
    # hard sets + climbing + cardio + zone2_run unchanged. Accessories
    # from the postcut routine week (editable).
    goals:
      - id: macros
        label: Macros
        description: "Protein 160-175 g every day; carbs biased to training days."
        protein_g_day: [160, 175]      # absolute floor (spec)
        carbs_floor_g_day: 225
      - id: calorie_band
        label: Calories
        description: "Eat at maintenance to a slight surplus — build at the fat store's edge, not a bulk."
        calorie_mode: surplus
        band_kcal: 200
      - id: hard_sets
        label: Program sets per lift
        description: "Working sets logged per main lift vs what this week's program prescribes (top sets, back-offs and volume slots; moves and skips applied) — Monday to Sunday, the same count as the Today card."
        lifts: [squat, bench, deadlift, press]
        hard_set_target: 10   # legacy fallback only — targets derive from the program
        hard_rpe_min: 7
        accessories:
          squat: [Romanian Deadlift]
          bench: [Seated Cable Row]
          deadlift: [Leg Curl]
          press: [Lateral Dumbbell Raise]
      - id: muscle_stimulus
        label: Sets per muscle group
        description: "Working sets per muscle group this week (Monday to Sunday) from the program's exercise-to-muscle credits, climbing sessions included. Aim for 8-12 per group. Over 12 is excess overlapping volume (flagged per group); under mid-week just means not done yet — the detail shows who trails an even pace."
        band: [8, 12]
        # muscle_groups / tracked_groups: omitted → the program's
        # hypertrophy_targets groups (v16: 9 banded + tracked-only
        # lower_back/front_delts/forearms/core, shown without a band).
      - id: climbing
        label: Climbing
        description: "Two climbing sessions a week (three in climbing-emphasis blocks)."
        target: 2
      - id: cardio_4x4
        label: Cardio
        description: "One 4x4 interval session a week."
        target: 1
      - id: zone2_run
        label: Zone-2 run
        description: "Nice to have: one easy run a week (the Sunday run) — detected from Whoop, no logging needed."
        optional: true
        target: 1
        min_minutes: 20
        max_avg_hr_pct: 0.75
  maintain:
    eigenvectors:
      - id: weight_hold
        label: weight
        rate_band: [-0.25, 0.25]
        act_above: 0.75
        act_below: -0.75
      - id: wilks_stability
        label: strength
        floor_pct: 2.5
        act_weeks_below: 3
    # Maintenance: the minimal set that holds both outcomes.
    weekly_drivers:
      - id: top_single_per_lift
        label: singles
        lifts: [squat, bench, deadlift, press]
        outcome: "strength held"
        why: "One weekly heavy exposure per lift is the maintenance dose."
      - id: protein_floor
        label: protein
        floor_g_per_lb: 0.8
        outcome: "lean mass held"
        why: "The floor still applies at maintenance — muscle is kept, not assumed."
      - id: bike_4x4
        label: 4x4
        target: 1
        outcome: "VO2 maintained"
        why: "One weekly 4x4 keeps the aerobic top end."
  reverse:
    eigenvectors:
      # Kcal ramp: hold-to-slight-gain while finding maintenance.
      - id: weight_hold
        label: weight
        rate_band: [-0.25, 0.5]
        act_above: 1.0
        act_below: -0.5
      - id: wilks_stability
        label: strength
        floor_pct: 2.5
        act_weeks_below: 3
    # Reverse: RPE-7 singles seed the next bulk's working maxes; keep
    # the exposure cadence while kcal ramps.
    weekly_drivers:
      - id: top_single_per_lift
        label: singles
        lifts: [squat, bench, deadlift, press]
        outcome: "reverse seeds the bulk"
        why: "The weekly RPE-7 singles are the numbers the bulk's working maxes are seeded from — keep the cadence."
      - id: protein_floor
        label: protein
        floor_g_per_lb: 0.8
        outcome: "lean regain"
        why: "The kcal ramp should refill glycogen and muscle, not just fat — the floor decides which."
      - id: bike_4x4
        label: 4x4
        target: 1
        outcome: "VO2 maintained"
        why: "One weekly 4x4 keeps the aerobic top end."
