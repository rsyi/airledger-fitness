# app/dashboards.yaml — domain dashboards + home-IA presentation config
# + the home hero's per-phase eigenvectors (`phases:`, bottom).
#
# ENGINE-FREE: the app fetches this file straight from GitHub (1 h cache,
# pull-to-refresh bust) and parses it in Dart only — it never passes
# through the Rust engine, so keys here need no dylib rebuild and no
# schema mirrors. Presentation, not row semantics. Missing/malformed file
# → the app falls back to the flat Ledgers list; nothing breaks.
#
# Each domain groups view(s) into one home row + one domain screen.
# Domain screens are RECORDS-FIRST (UX redesign 2026-09-21): the ledger
# fills the screen, topped by a one-line `headline:` strip; the full
# metric dashboard lives behind the strip's Trends toggle.
#   paradigm: entry        → LOG section; domain screen keeps the full
#                            timeline affordances (FAB, forms, planning).
#   paradigm: integration  → CONNECTED section; domain screen renders a
#                            read-friendly record list (date-grouped, one
#                            line per record, newest first); the classic
#                            read-only timeline stays behind the app-bar
#                            calendar icon. Views that still accept
#                            writes (weight) keep a manual escape hatch:
#                            ⋮ → "Add entry manually" opens the normal
#                            form for integration gaps (travel, dead
#                            scale battery).
#   views:    view names — the FIRST backs the domain screen's timeline.
#   icon:     lucide icon name (same vocabulary as the input.yml icons).
#   headline: metric ids for the compact strip above the records — the
#     2-3 numbers worth seeing every open (e.g. strength: wilks +
#     pl_total → "Wilks 306.1 · PL 1222 lb"). Stats show their first
#     chip, series their latest point, grade_pyramid its top grade.
#     Absent → the app defaults to stat/best-kind metrics, capped at 3.
#   list_fields: salient columns for the integration record list, in
#     display order. Bare string (grade) or map ({ field: calories,
#     unit: kcal }) — units are appended to numeric values. Absent →
#     the app falls back to the view's list_display.
#   metrics:  the Trends dashboard's entries.
#     kind: stat (latest/derived value) | best (all-time) | series (chart)
#     id (built-ins): pl_total, e1rm_reference, all_time_best_weight,
#       wilks, wilks_series, bw_series, bf_series, kcal_series,
#       protein_series, grade_pyramid, session_frequency, hr_4x4_series
#     goal: number → target line/reference; explicit null → no goal set.
#     from: series window start date. wilks_series also anchors its
#       dashed reference line to the metric's value AS OF this date
#       (block-0 start → "the Wilks you walked into the cut with").
#     floor_pct: acceptable-drop floor, percent BELOW the from-anchored
#       reference — the chart draws a second (dotted) line at
#       reference × (1 − floor_pct/100); sinking under it is the act
#       signal (wilks_series). Older apps ignore the key safely.
#     goal_note: human context when the goal isn't a bare number.
#     goal_band_per_lb: [low, high] g-per-lb-of-bodyweight band — the app
#       scales it by the current 7-day-avg bodyweight and shades the
#       range on the chart (protein_series).
#     lifts: main-lift filter for per-lift strength metrics.

domains:
  - name: strength
    paradigm: entry
    views: [strength]
    icon: dumbbell
    headline: [wilks, pl_total] # "Wilks 306.1 · PL 1222 lb" above the log
    metrics:
      - id: pl_total
        kind: stat
        label: "PL total — sum of best capped e1RMs (S+B+D+P)"
        unit: lb
        goal: null # no declared total goal yet
      - id: e1rm_reference
        kind: stat
        label: "e1RM reference (42-day)"
        unit: lb
        lifts: [squat, bench, deadlift, press]
      - id: all_time_best_weight
        kind: best
        label: "all-time best actual weight"
        unit: lb
        lifts: [squat, bench, deadlift, press]
      # Wilks (SBD): WILKS-2020 male, classic squat+bench+deadlift total
      # (press excluded — NOT pl_total). Basis = ACTUAL MAX since
      # 2026-09-22 (user: "done against actually max lift numbers, not
      # e1RM"): per period per lift the heaviest weight actually lifted
      # (any reps >= 1 — a 405×2 counts as 405), carried forward when
      # untrained. The stat is weekly-current; the SERIES is
      # month-to-month (deload weeks make weekly points noisy) with
      # monthly-mean bodyweight carried through months with no
      # weigh-ins, so history runs back through sparse eras. The app
      # also draws the ALL-TIME BENCHMARK line — the series' absolute
      # max ("best ever 364.7 · May '24") — the yardstick the current
      # score is tracked against.
      - id: wilks
        kind: stat
        label: "Wilks (SBD, actual lifts) — weekly"
      - id: wilks_series
        kind: series
        label: "Wilks (SBD, actual lifts) — monthly"
        from: "2026-09-21" # block-0 (cut) start — keep in sync with program.yaml
        # Acceptable drop below the cut-start reference, on the
        # actual-max basis: reference 306.1 → floor 298.5 (2026-09-22;
        # was 327.3 → 319.1 on the retired e1RM basis).
        floor_pct: 2.5
        # Trailing plot window in years (48 monthly points). User-tunable;
        # delete the key (or set null) for the full history. Tooltips
        # carry the year on multi-year windows either way. 2026-09-22.
        window_years: 4
        goal_note: "hold within 2.5% of cut start; 3+ weeks below the floor = act"

  # Weight is INTEGRATION paradigm (2026-09-21): Withings feeds it, so
  # the screen is a read surface — record list + Trends, no FAB. Manual
  # weigh-ins stay possible via ⋮ → "Add entry manually" (the view keeps
  # its input overlay; rows write to the ledger + sync like any entry).
  - name: weight
    paradigm: integration
    views: [weight]
    icon: scale
    headline: [bw_series, bf_series] # latest bw + bf above the records
    list_fields:
      - { field: weight_lbs, unit: lb }
      - { field: body_fat_withing, unit: "% bf" }
      - time
    metrics:
      - id: bw_series
        kind: series
        label: "body weight"
        unit: lb
        goal: 154 # cut target (coach/phase.yaml target_weight_lb)
        goal_note: "phase target — keep in sync with phase.yaml"
      - id: bf_series
        kind: series
        label: "body fat"
        unit: "%"

  - name: cardio
    paradigm: entry
    views: [cardio]
    icon: heart-pulse
    headline: [hr_4x4_series] # last session's max HR above the log
    metrics:
      - id: hr_4x4_series
        kind: series
        label: "4x4 max HR"
        unit: bpm

  - name: daily_notes
    paradigm: entry
    views: [daily_notes]
    icon: notebook-pen
    metrics: [] # journal — no numeric dashboard

  - name: climbing
    paradigm: integration
    views: [climbing]
    icon: mountain
    headline: [grade_pyramid, session_frequency] # "top v7 · sess/wk 2"
    list_fields: [grade, color, gym, ascent_type]
    metrics:
      - id: grade_pyramid
        kind: best
        label: "grade pyramid"
      - id: session_frequency
        kind: series
        label: "sessions / wk"
        goal: 2
        goal_note: "program climbing_wk — 2 in lifting blocks, 3 in climbing blocks"

  - name: meals
    paradigm: integration
    views: [meals]
    icon: utensils
    headline: [kcal_series, protein_series] # yesterday/today's totals
    list_fields:
      - meal
      - { field: calories, unit: kcal }
      - { field: protein_g, unit: g }
    metrics:
      - id: kcal_series
        kind: series
        label: "calories"
        unit: kcal
      - id: protein_series
        kind: series
        label: "protein"
        unit: g
        goal_band_per_lb: [0.8, 1.0] # shaded band, scaled by current 7d-avg bw
        goal_note: "0.8–1.0 g/lb of bodyweight"

# last_bulk: — the home STRENGTH card's second column (2026-09-22,
# user: "show my numbers from my last bulk"): per lift the heaviest
# weight ACTUALLY lifted inside [start, end], Wilks-priced at the
# contemporaneous monthly bodyweight; the all-time top moved to the
# card's click-in sheet. `end` is the declared cut (coach/phase.yaml
# v1 effective_from, "Ending the 2025 bulk at 186.5"); `start` was
# DERIVED from the weigh-in series — the trailing-7-day-average trough
# (167.6 lb on 2025-02-05) before the sustained climb to the bulk end
# (tool/derive_bulk_window.dart in the app repo reproduces it) — and
# is USER-EDITABLE: move the dates if the derivation misread your
# history. Absent section → the card simply omits the column (older
# apps ignore the key entirely).
last_bulk:
  start: "2025-02-05" # derived weigh-in trough — edit freely
  end: "2025-10-06" # cut declared; keep in sync with phase.yaml
  label: "2025 bulk"

# phases: — the home hero's eigenvectors, keyed by coach/phase.yaml's
# current `value`. The hero renders one row per eigenvector: verdict
# chip (green agree / amber drifting / red act) + the one number that
# matters + a mini sparkline. Parsed by the app only (services/
# phase_eigenvectors.dart); ABSENT section → the pre-hero four-card
# home dashboard renders unchanged (back-compat by construction).
#
# Eigenvector vocabulary:
#   weight_loss | gain_rate | weight_hold
#     rate_band: [lo, hi] lb/wk the observed 3-week rate should land in
#       (absent → derived from the program slice's gain_rate_lb_wk).
#     act_above / act_below: red thresholds — outside the band but
#       inside these is only amber.
#   wilks_stability | strength_gain
#     from: reference anchor date — weekly Wilks AS OF this day is the
#       yardstick (absent → the running block's start date).
#     floor_pct: acceptable drop below the reference, percent.
#     act_weeks_below: consecutive weeks under the floor → act (def. 3).
#     strength_gain additionally wants current >= reference (a bulk
#     should trend UP; holding above the floor is only amber).
#   inputs_delivered
#     near_max_sets + working_sets from the nightly program_status row
#     vs the program's targets-in-force (§5.4), pro-rated mid-week.
phases:
  cut:
    eigenvectors:
      # Losing weight: -1.0..-0.5 lb/wk (program cut band around the
      # phase's -0.75 target; trajectory 163 → 154 by Dec 13).
      - id: weight_loss
        label: weight
        rate_band: [-1.0, -0.5]
        act_above: 0.2 # gaining on a cut — PHASE_MISMATCH territory
        act_below: -1.5 # 2x the fast edge — muscle risk, eat
      # ...without losing strength: weekly Wilks (actual-max basis,
      # 2026-09-22) vs the cut-start reference (306.1 on 2026-09-21)
      # with the 2.5% floor (~298.5).
      - id: wilks_stability
        label: strength
        from: "2026-09-21" # block-0 start — sync with wilks_series above
        floor_pct: 2.5
        act_weeks_below: 3
  bulk:
    eigenvectors:
      # Not gaining too fast: §5.4 gain_rate_lb_wk blocks_2_5 band;
      # switch to [0.1, 0.3] when blocks 6-7 begin (2027-08-16).
      - id: gain_rate
        label: weight
        rate_band: [0.2, 0.5]
        act_above: 0.6 # the program's alarm rate
        act_below: -0.2 # losing on a bulk
      # Gaining strength: Wilks trending up over the block (reference
      # defaults to the running block's start).
      - id: strength_gain
        label: strength
        floor_pct: 1.5
        act_weeks_below: 3
      # Delivering the inputs: near-max + working sets vs the §5.4
      # targets-in-force (28 working / 6 near-max in bulk blocks).
      - id: inputs_delivered
        label: inputs
  maintain:
    eigenvectors:
      - id: weight_hold
        label: weight
        rate_band: [-0.25, 0.25]
        act_above: 0.75
        act_below: -0.75
      - id: wilks_stability
        label: strength
        floor_pct: 2.5
        act_weeks_below: 3
  reverse:
    eigenvectors:
      # Kcal ramp: hold-to-slight-gain while finding maintenance.
      - id: weight_hold
        label: weight
        rate_band: [-0.25, 0.5]
        act_above: 1.0
        act_below: -0.5
      - id: wilks_stability
        label: strength
        floor_pct: 2.5
        act_weeks_below: 3
