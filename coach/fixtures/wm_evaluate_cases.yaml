# Shared fixtures for the working-max controller evaluate() twins:
#   Dart: ledger/lib/services/working_max.dart  (test/wm_fixture_test.dart)
#   TS:   ledger-mcp/src/working_max.ts         (test/working_max.test.ts)
# Both suites load THIS file against coach/program.yaml v13
# (load_policies + tm_rule) and must produce identical outputs. Drift =
# a failing test on either side. Expectations were generated FROM the
# Dart controller (the reference implementation).
#
# v13 (2026-09-28): TWO-LOOP TM — the SLOW LOOP is a deterministic
# median estimator (`tm_rule: median_implied_max`):
#   TM = round5(median(implied maxes of the qualifying top sets over
#   the last 21 days anchored at the newest set, or the last 5 sets —
#   whichever holds more data)), applied IN FULL (the v12 ±5/session
#   raise cap is superseded BY DESIGN of the median). With no history
#   the window is the single reading — its implied max applies in
#   full. The FAST LOOP keeps every v12 safety: sub-top readings
#   (< 0.78×TM) hold; grinders/misses always drop at least −5 (in full
#   to the implied max when lower — even through a manual pin);
#   light/deload readings are ignored; pain caps freeze (clean =
#   rpe < 9, no grind/miss); drops cap the next top set; two drops in
#   a row = no top sets next week. A manual value PINS the TM until
#   manual_outvote_sets (3) qualifying sets land after it; then the
#   estimator runs on post-manual sets only.
#
# Case shape:
#   policy   load_policy name from program.yaml v12 (cut_early,
#            cut_late, reverse, lifting_block, climbing_block,
#            light_week, test_week)
#   lift     bench | squat | deadlift | press
#   wm       working max going in
#   date     evaluation date (YYYY-MM-DD)
#   reading  { weight, reps, rpe, kind, notes?, missed? } — omit for the
#            no-reading cases. The harness runs the §1.4 variant parser
#            on `notes` (converted weight = weight / factor) and the
#            §1.2 grinder rule (rpe >= 9.5 or notes ~ /grind|slow|stall|
#            miss/); `missed` is passed through as given (default false).
#   history  optional list of PRIOR day-top sets (same shape + a
#            `date`), the slow loop's sample history: the harness
#            builds readings from them exactly like `reading`, appends
#            the reading itself, and computes slowTmEstimate(currentTm
#            = wm, notBefore = manual_pin.since). Omitted = no history
#            (the window is the reading alone).
#   manual_pin  { since, new_sets, needed } — manual-pin state passed
#            straight to evaluate (median mode only).
#   weeks_without_reading   for no-reading cases (NO_READING at >= 2)
#   prior    { action, pain_cap_clean } — the previous decision's state
#            (consecutive-drop rule, pain-cap clean-session counting).
#   pain_cap / two_signals  boolean overrides (checked first)
#   expect:
#     decision      raise | hold | drop | freeze
#     new_wm        wm after the decision (always present)
#     source        rule | pain_cap (omit = rule)
#     cap           capNextTopSetRpe (omit = none)
#     flags         EXACT flag list (omit = none)
#     no_top_sets_next_week   (omit = false)
#     converted_weight        reading weight in default-variant terms (±0.05)
#     implied_max             converted weight / chart[rpe][reps] (±0.05)
cases:
  # ── the one rule: implied max, guarded ───────────────────────────────
  - name: hold_at_prescription_rpe
    # Wave top exactly as prescribed: 81%×5@8 implies the TM itself.
    policy: cut_early
    lift: bench
    wm: 240
    date: "2026-10-05"
    reading: { weight: 195, reps: 5, rpe: 8, kind: heavy_top }
    expect: { decision: hold, new_wm: 240, implied_max: 240.4 }

  - name: easy_top_raises_in_full_no_session_cap
    # 195×5@7 → implied 248.1 → 250. v12 capped this at +5 (245); the
    # median mode applies its estimate in full — with no other history
    # the window is this one set.
    policy: cut_early
    lift: bench
    wm: 240
    date: "2026-10-05"
    reading: { weight: 195, reps: 5, rpe: 7, kind: heavy_top }
    expect: { decision: raise, new_wm: 250, implied_max: 248.1 }

  - name: single_raise_to_rounded_implied
    # 230×1@8 → implied 249.5 → 250.
    policy: cut_early
    lift: bench
    wm: 245
    date: "2026-10-05"
    reading: { weight: 230, reps: 1, rpe: 8, kind: heavy_top }
    expect: { decision: raise, new_wm: 250 }

  - name: lone_hard_top_drops_in_full
    # 195×5@9 → implied 233.0 → 235: with NO history the window is the
    # single set — the drop applies (see median_outvotes_* below for
    # the damped case).
    policy: cut_early
    lift: bench
    wm: 240
    date: "2026-10-05"
    reading: { weight: 195, reps: 5, rpe: 9, kind: heavy_top }
    expect: { decision: drop, new_wm: 235, cap: 8.5 }

  - name: big_drop_applies_in_full
    # Squat 260×5@9 → implied 310.6 → 310: a 10 lb drop in one session.
    policy: cut_early
    lift: squat
    wm: 320
    date: "2026-10-05"
    reading: { weight: 260, reps: 5, rpe: 9, kind: heavy_top }
    expect: { decision: drop, new_wm: 310, cap: 8.5 }

  # ── grinders / misses: always a drop ─────────────────────────────────
  - name: grinder_at_tm_still_drops_min_5
    # 235×1@9.5 implies ~240 (== TM) but a grinder never holds/raises.
    policy: cut_early
    lift: bench
    wm: 240
    date: "2026-10-05"
    reading: { weight: 235, reps: 1, rpe: 9.5, kind: heavy_top }
    expect: { decision: drop, new_wm: 235, cap: 8.5 }

  - name: grinder_low_implied_drops_in_full
    # 185×5@9.5 → implied 217.6 → 220 — well past the −5 floor.
    policy: cut_early
    lift: bench
    wm: 240
    date: "2026-10-05"
    reading: { weight: 185, reps: 5, rpe: 9.5, kind: heavy_top }
    expect: { decision: drop, new_wm: 220, cap: 8.5 }

  - name: missed_reps_drop_even_with_high_implied
    # 315×2@8 (missed) implies 353 — the miss still forces −5.
    policy: cut_early
    lift: deadlift
    wm: 330
    date: "2026-10-09"
    reading: { weight: 315, reps: 2, rpe: 8, kind: heavy_top, missed: true }
    expect: { decision: drop, new_wm: 325, cap: 8.5 }

  - name: grinder_note_drops
    policy: cut_early
    lift: squat
    wm: 320
    date: "2026-10-05"
    reading: { weight: 290, reps: 1, rpe: 8, kind: heavy_top, notes: "slow out of the hole" }
    expect: { decision: drop, new_wm: 315, cap: 8.5 }

  # ── sub-top guard: %TM volume slots never move the TM ────────────────
  - name: subtop_volume_reading_holds
    # Wed squat-day bench volume shape: 160×8@7 < 78% of 240 → recorded,
    # not evaluated (implied 226 would otherwise crater the TM).
    policy: cut_early
    lift: bench
    wm: 240
    date: "2026-10-07"
    reading: { weight: 160, reps: 8, rpe: 7, kind: heavy_top }
    expect: { decision: hold, new_wm: 240 }

  - name: subtop_easy_set_cannot_raise_either
    # 175×8@6 implies 257 (> TM) — still sub-top, still a hold.
    policy: cut_early
    lift: bench
    wm: 240
    date: "2026-10-07"
    reading: { weight: 175, reps: 8, rpe: 6, kind: heavy_top }
    expect: { decision: hold, new_wm: 240 }

  # ── cut_late / reverse are UNFROZEN under tm_rule (caps stay) ────────
  - name: cut_late_tracks_implied_max
    # v11 froze cut_late; since v12 it is unfrozen: 220×1@7 → implied
    # 246.6 → median (n=1) → 245.
    policy: cut_late
    lift: bench
    wm: 240
    date: "2026-11-20"
    reading: { weight: 220, reps: 1, rpe: 7, kind: heavy_top }
    expect: { decision: raise, new_wm: 245, implied_max: 246.6 }

  # ── light / deload: recorded + ignored ───────────────────────────────
  - name: light_week_grinder_ignored
    policy: light_week
    lift: squat
    wm: 320
    date: "2027-03-24"
    reading: { weight: 315, reps: 1, rpe: 9.9, kind: light_week }
    expect: { decision: hold, new_wm: 320 }

  - name: cut_deload_top_ignored
    # Wave week 4 top 5@~70%: implied ~216 must never drop the TM.
    policy: cut_early
    lift: bench
    wm: 240
    date: "2026-10-19"
    reading: { weight: 170, reps: 5, rpe: 7, kind: deload }
    expect: { decision: hold, new_wm: 240 }

  # ── test single is just a reading (one rule + caps) ──────────────────
  - name: test_single_raises_in_full
    # The old /0.922 reset falls out of the one rule: implied 260.3 →
    # 260, applied in full (v12 capped it to 255).
    policy: test_week
    lift: bench
    wm: 250
    date: "2027-04-20"
    reading: { weight: 240, reps: 1, rpe: 8, kind: test }
    expect: { decision: raise, new_wm: 260, implied_max: 260.3 }

  - name: test_single_below_tm_drops_in_full
    # 220×1@8 → implied 238.6 → 240 < 250: the block result cuts the TM.
    policy: test_week
    lift: bench
    wm: 250
    date: "2027-04-20"
    reading: { weight: 220, reps: 1, rpe: 8, kind: test }
    expect: { decision: drop, new_wm: 240, cap: 8 }

  # ── §1.4 variant conversion (unchanged) ──────────────────────────────
  - name: touch_and_go_bench_divided_by_1_03
    policy: cut_early
    lift: bench
    wm: 240
    date: "2026-10-05"
    reading: { weight: 247.2, reps: 1, rpe: 8, kind: heavy_top, notes: "touch and go" }
    expect:
      decision: raise
      new_wm: 260   # rounded implied, in full (no session cap)
      converted_weight: 240.0
      implied_max: 260.3

  - name: variant_mismatch_paused_deadlift_holds
    policy: cut_early
    lift: deadlift
    wm: 330
    date: "2026-10-09"
    reading: { weight: 300, reps: 1, rpe: 9, kind: heavy_top, notes: "paused at the floor" }
    expect:
      decision: hold
      new_wm: 330
      flags: [VARIANT_MISMATCH]

  # ── consecutive drops ────────────────────────────────────────────────
  - name: second_consecutive_drop_no_top_sets
    policy: cut_early
    lift: bench
    wm: 235
    date: "2026-10-12"
    reading: { weight: 190, reps: 5, rpe: 9, kind: heavy_top }
    prior: { action: drop }
    expect:
      decision: drop
      new_wm: 225   # implied 227.0 → 225, in full
      cap: 8.5
      no_top_sets_next_week: true

  # ── pain cap: freeze + cap 7; clean = rpe < 9, no grind/miss ─────────
  - name: pain_cap_dirty_session_not_clean
    # rpe 9 >= clean_rpe_lt (9) → not clean.
    policy: cut_early
    lift: squat
    wm: 320
    date: "2026-10-05"
    pain_cap: true
    reading: { weight: 300, reps: 1, rpe: 9, kind: heavy_top }
    expect:
      decision: freeze
      new_wm: 320
      source: pain_cap
      cap: 7
      flags: [PAIN_CAP]

  - name: pain_cap_first_clean_session
    policy: cut_early
    lift: squat
    wm: 320
    date: "2026-10-05"
    pain_cap: true
    reading: { weight: 275, reps: 1, rpe: 7, kind: capped }
    expect:
      decision: freeze
      new_wm: 320
      source: pain_cap
      cap: 7
      flags: [PAIN_CAP, PAIN_CAP_CLEAN]

  - name: pain_cap_second_clean_session_lifts
    policy: cut_early
    lift: squat
    wm: 320
    date: "2026-10-12"
    pain_cap: true
    reading: { weight: 285, reps: 1, rpe: 7, kind: capped }
    prior: { action: freeze, pain_cap_clean: true }
    expect:
      decision: freeze
      new_wm: 320
      source: pain_cap
      cap: 7
      flags: [PAIN_CAP, PAIN_CAP_CLEAN, PAIN_CAP_LIFTED]

  # ── NO_READING ───────────────────────────────────────────────────────
  - name: one_readingless_week_holds_silently
    policy: cut_early
    lift: press
    wm: 140
    date: "2026-09-28"
    weeks_without_reading: 1
    expect: { decision: hold, new_wm: 140 }

  - name: two_readingless_weeks_flag_no_reading
    policy: cut_early
    lift: press
    wm: 140
    date: "2026-10-05"
    weeks_without_reading: 2
    expect: { decision: hold, new_wm: 140, flags: [NO_READING] }

  # ── TWO_SIGNALS freezes the week ─────────────────────────────────────
  - name: two_signals_freezes_all_lifts
    policy: cut_early
    lift: bench
    wm: 240
    date: "2026-10-05"
    two_signals: true
    reading: { weight: 195, reps: 5, rpe: 7, kind: heavy_top }
    expect:
      decision: freeze
      new_wm: 240
      flags: [TWO_SIGNALS]

  # ── post-cut blocks run the same one rule ────────────────────────────
  - name: lifting_block_raise_in_full
    # 300×1@7 → implied 336.3 → 335, applied in full.
    policy: lifting_block
    lift: squat
    wm: 320
    date: "2027-03-08"
    reading: { weight: 300, reps: 1, rpe: 7, kind: heavy_top }
    expect: { decision: raise, new_wm: 335, implied_max: 336.3 }

  - name: climbing_block_hold_at_implied
    # 295×1@8 → implied 320.0 → 320 == TM → hold.
    policy: climbing_block
    lift: squat
    wm: 320
    date: "2027-01-12"
    reading: { weight: 295, reps: 1, rpe: 8, kind: heavy_top }
    expect: { decision: hold, new_wm: 320, implied_max: 320.0 }

  # ── slow-loop median: the window outvotes single days ────────────────
  - name: median_outvotes_single_strong_day
    # Four sets implying 240.4 + one implying 255.9 (+15.4): the median
    # stays 240.4 → TM unchanged. THE outlier-damping pin: one +15 lb
    # day moves the TM 0 ≤ 5 lb (v12 would have raised +5).
    policy: cut_early
    lift: bench
    wm: 240
    date: "2026-10-15"
    history:
      - { date: "2026-10-01", weight: 195, reps: 5, rpe: 8, kind: heavy_top }
      - { date: "2026-10-04", weight: 195, reps: 5, rpe: 8, kind: heavy_top }
      - { date: "2026-10-08", weight: 195, reps: 5, rpe: 8, kind: heavy_top }
      - { date: "2026-10-11", weight: 195, reps: 5, rpe: 8, kind: heavy_top }
    reading: { weight: 207.5, reps: 5, rpe: 8, kind: heavy_top }
    expect: { decision: hold, new_wm: 240, implied_max: 255.9 }

  - name: median_outvotes_single_hard_day
    # The mirror image: one hard (non-grinder) day implying 230.6 among
    # four 240.4s — the median holds; only a grinder or a sustained
    # decline drops.
    policy: cut_early
    lift: bench
    wm: 240
    date: "2026-10-15"
    history:
      - { date: "2026-10-01", weight: 195, reps: 5, rpe: 8, kind: heavy_top }
      - { date: "2026-10-04", weight: 195, reps: 5, rpe: 8, kind: heavy_top }
      - { date: "2026-10-08", weight: 195, reps: 5, rpe: 8, kind: heavy_top }
      - { date: "2026-10-11", weight: 195, reps: 5, rpe: 8, kind: heavy_top }
    reading: { weight: 190, reps: 5, rpe: 8.5, kind: heavy_top }
    expect: { decision: hold, new_wm: 240 }

  - name: median_sustained_trend_raises_in_full
    # The whole window says 255.9 → 255: a real trend moves the TM in
    # one step (no ±5/session crawl).
    policy: cut_early
    lift: bench
    wm: 240
    date: "2026-10-15"
    history:
      - { date: "2026-10-01", weight: 207.5, reps: 5, rpe: 8, kind: heavy_top }
      - { date: "2026-10-04", weight: 207.5, reps: 5, rpe: 8, kind: heavy_top }
      - { date: "2026-10-08", weight: 207.5, reps: 5, rpe: 8, kind: heavy_top }
      - { date: "2026-10-11", weight: 207.5, reps: 5, rpe: 8, kind: heavy_top }
    reading: { weight: 207.5, reps: 5, rpe: 8, kind: heavy_top }
    expect: { decision: raise, new_wm: 255 }

  - name: median_window_ignores_light_and_subtop_history
    # Light-week and sub-top history rows never enter the sample; the
    # window is the two qualifying sets (240.4, 249.5) → median 245.0
    # → 245.
    policy: cut_early
    lift: bench
    wm: 240
    date: "2026-10-15"
    history:
      - { date: "2026-10-04", weight: 195, reps: 5, rpe: 8, kind: heavy_top }
      - { date: "2026-10-06", weight: 160, reps: 8, rpe: 7, kind: heavy_top }
      - { date: "2026-10-08", weight: 170, reps: 5, rpe: 6, kind: light_week }
    reading: { weight: 230, reps: 1, rpe: 8, kind: heavy_top }
    expect: { decision: raise, new_wm: 245 }

  # ── manual pin: holds until outvoted; grinders drop through ──────────
  - name: manual_pin_holds_before_quorum
    policy: cut_early
    lift: bench
    wm: 260
    date: "2026-10-15"
    manual_pin: { since: "2026-10-03", new_sets: 2, needed: 3 }
    history:
      - { date: "2026-10-10", weight: 210, reps: 5, rpe: 8, kind: heavy_top }
    reading: { weight: 210, reps: 5, rpe: 8, kind: heavy_top }
    expect: { decision: hold, new_wm: 260 }

  - name: manual_pin_outvoted_runs_on_post_manual_sets_only
    # Pre-manual sets implied 271.3 (220×5@8); post-manual three sets
    # implied 252.8 (205×5@8) → median 252.8 → 255. With the full
    # 6-set history the median would be 262.0 → hold at 260 — the drop
    # to 255 proves overridden history never resurrects.
    policy: cut_early
    lift: bench
    wm: 260
    date: "2026-10-15"
    manual_pin: { since: "2026-10-03", new_sets: 3, needed: 3 }
    history:
      - { date: "2026-10-01", weight: 220, reps: 5, rpe: 8, kind: heavy_top }
      - { date: "2026-10-02", weight: 220, reps: 5, rpe: 8, kind: heavy_top }
      - { date: "2026-10-03", weight: 220, reps: 5, rpe: 8, kind: heavy_top }
      - { date: "2026-10-10", weight: 205, reps: 5, rpe: 8, kind: heavy_top }
      - { date: "2026-10-12", weight: 205, reps: 5, rpe: 8, kind: heavy_top }
    reading: { weight: 205, reps: 5, rpe: 8, kind: heavy_top }
    expect: { decision: drop, new_wm: 255, cap: 8.5 }

  - name: grinder_drops_through_manual_pin
    # Safety beats the pin: 225×1@9.5 → implied 230.1 → 230 < 260−5.
    policy: cut_early
    lift: bench
    wm: 260
    date: "2026-10-15"
    manual_pin: { since: "2026-10-03", new_sets: 0, needed: 3 }
    reading: { weight: 225, reps: 1, rpe: 9.5, kind: heavy_top }
    expect: { decision: drop, new_wm: 230, cap: 8.5 }
