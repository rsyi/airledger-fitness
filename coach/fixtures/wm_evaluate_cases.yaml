# Shared fixtures for the working-max controller evaluate() twins:
#   Dart: ledger/lib/services/working_max.dart  (test/wm_fixture_test.dart)
#   TS:   ledger-mcp/src/working_max.ts         (test/working_max.test.ts)
# Both suites load THIS file against coach/program.yaml v12
# (load_policies + tm_rule) and must produce identical outputs. Drift =
# a failing test on either side. Expectations were generated FROM the
# Dart controller (the reference implementation).
#
# v12 (2026-09-28): TM movement is the GUARDED IMPLIED-MAX rule
# (`tm_rule`), replacing the per-policy raise/hold/drop bands:
#   TM_next = round5(weight / chart[rpe][reps]) — raises capped at
#   +5/session, drops in full; sub-top readings (< 0.78×TM) hold;
#   grinders/misses always drop at least −5; light/deload readings are
#   ignored; the test single is just a reading (implied /0.922, raise
#   cap applies); pain caps freeze (clean = rpe < 9, no grind/miss).
#
# Case shape:
#   policy   load_policy name from program.yaml v12 (cut_early,
#            cut_late, reverse, lifting_block, climbing_block,
#            light_week, test_week)
#   lift     bench | squat | deadlift | press
#   wm       working max going in
#   date     evaluation date (YYYY-MM-DD)
#   reading  { weight, reps, rpe, kind, notes?, missed? } — omit for the
#            no-reading cases. The harness runs the §1.4 variant parser
#            on `notes` (converted weight = weight / factor) and the
#            §1.2 grinder rule (rpe >= 9.5 or notes ~ /grind|slow|stall|
#            miss/); `missed` is passed through as given (default false).
#   weeks_without_reading   for no-reading cases (NO_READING at >= 2)
#   prior    { action, pain_cap_clean } — the previous decision's state
#            (consecutive-drop rule, pain-cap clean-session counting).
#   pain_cap / two_signals  boolean overrides (checked first)
#   expect:
#     decision      raise | hold | drop | freeze
#     new_wm        wm after the decision (always present)
#     source        rule | pain_cap (omit = rule)
#     cap           capNextTopSetRpe (omit = none)
#     flags         EXACT flag list (omit = none)
#     no_top_sets_next_week   (omit = false)
#     converted_weight        reading weight in default-variant terms (±0.05)
#     implied_max             converted weight / chart[rpe][reps] (±0.05)
cases:
  # ── the one rule: implied max, guarded ───────────────────────────────
  - name: guarded_hold_at_prescription_rpe
    # Wave top exactly as prescribed: 81%×5@8 implies the TM itself.
    policy: cut_early
    lift: bench
    wm: 240
    date: "2026-10-05"
    reading: { weight: 195, reps: 5, rpe: 8, kind: heavy_top }
    expect: { decision: hold, new_wm: 240, implied_max: 240.4 }

  - name: guarded_easy_top_raises_capped_plus_5
    # 195×5@7 → implied 248.1 → 250, but raises cap at +5/session.
    policy: cut_early
    lift: bench
    wm: 240
    date: "2026-10-05"
    reading: { weight: 195, reps: 5, rpe: 7, kind: heavy_top }
    expect: { decision: raise, new_wm: 245, implied_max: 248.1 }

  - name: guarded_exact_plus_5_raise_uncapped
    # 230×1@8 → implied 249.5 → 250 = wm+5: lands uncapped.
    policy: cut_early
    lift: bench
    wm: 245
    date: "2026-10-05"
    reading: { weight: 230, reps: 1, rpe: 8, kind: heavy_top }
    expect: { decision: raise, new_wm: 250 }

  - name: guarded_hard_top_drops_in_full
    # 195×5@9 → implied 233.0 → 235: the drop is not capped.
    policy: cut_early
    lift: bench
    wm: 240
    date: "2026-10-05"
    reading: { weight: 195, reps: 5, rpe: 9, kind: heavy_top }
    expect: { decision: drop, new_wm: 235, cap: 8.5 }

  - name: guarded_big_drop_applies_in_full
    # Squat 260×5@9 → implied 310.6 → 310: a 10 lb drop in one session.
    policy: cut_early
    lift: squat
    wm: 320
    date: "2026-10-05"
    reading: { weight: 260, reps: 5, rpe: 9, kind: heavy_top }
    expect: { decision: drop, new_wm: 310, cap: 8.5 }

  # ── grinders / misses: always a drop ─────────────────────────────────
  - name: grinder_at_tm_still_drops_min_5
    # 235×1@9.5 implies ~240 (== TM) but a grinder never holds/raises.
    policy: cut_early
    lift: bench
    wm: 240
    date: "2026-10-05"
    reading: { weight: 235, reps: 1, rpe: 9.5, kind: heavy_top }
    expect: { decision: drop, new_wm: 235, cap: 8.5 }

  - name: grinder_low_implied_drops_in_full
    # 185×5@9.5 → implied 217.6 → 220 — well past the −5 floor.
    policy: cut_early
    lift: bench
    wm: 240
    date: "2026-10-05"
    reading: { weight: 185, reps: 5, rpe: 9.5, kind: heavy_top }
    expect: { decision: drop, new_wm: 220, cap: 8.5 }

  - name: missed_reps_drop_even_with_high_implied
    # 315×2@8 (missed) implies 353 — the miss still forces −5.
    policy: cut_early
    lift: deadlift
    wm: 330
    date: "2026-10-09"
    reading: { weight: 315, reps: 2, rpe: 8, kind: heavy_top, missed: true }
    expect: { decision: drop, new_wm: 325, cap: 8.5 }

  - name: grinder_note_drops
    policy: cut_early
    lift: squat
    wm: 320
    date: "2026-10-05"
    reading: { weight: 290, reps: 1, rpe: 8, kind: heavy_top, notes: "slow out of the hole" }
    expect: { decision: drop, new_wm: 315, cap: 8.5 }

  # ── sub-top guard: %TM volume slots never move the TM ────────────────
  - name: subtop_volume_reading_holds
    # Wed squat-day bench volume shape: 160×8@7 < 78% of 240 → recorded,
    # not evaluated (implied 226 would otherwise crater the TM).
    policy: cut_early
    lift: bench
    wm: 240
    date: "2026-10-07"
    reading: { weight: 160, reps: 8, rpe: 7, kind: heavy_top }
    expect: { decision: hold, new_wm: 240 }

  - name: subtop_easy_set_cannot_raise_either
    # 175×8@6 implies 257 (> TM) — still sub-top, still a hold.
    policy: cut_early
    lift: bench
    wm: 240
    date: "2026-10-07"
    reading: { weight: 175, reps: 8, rpe: 6, kind: heavy_top }
    expect: { decision: hold, new_wm: 240 }

  # ── cut_late / reverse are UNFROZEN under tm_rule (caps stay) ────────
  - name: cut_late_tracks_implied_max_guarded
    # v11 froze cut_late; v12: 220×1@7 → implied 246.6 → 245 → raise +5.
    policy: cut_late
    lift: bench
    wm: 240
    date: "2026-11-20"
    reading: { weight: 220, reps: 1, rpe: 7, kind: heavy_top }
    expect: { decision: raise, new_wm: 245, implied_max: 246.6 }

  # ── light / deload: recorded + ignored ───────────────────────────────
  - name: light_week_grinder_ignored
    policy: light_week
    lift: squat
    wm: 320
    date: "2027-03-24"
    reading: { weight: 315, reps: 1, rpe: 9.9, kind: light_week }
    expect: { decision: hold, new_wm: 320 }

  - name: cut_deload_top_ignored
    # Wave week 4 top 5@~70%: implied ~216 must never drop the TM.
    policy: cut_early
    lift: bench
    wm: 240
    date: "2026-10-19"
    reading: { weight: 170, reps: 5, rpe: 7, kind: deload }
    expect: { decision: hold, new_wm: 240 }

  # ── test single is just a reading (one rule + caps) ──────────────────
  - name: test_single_raise_capped
    # Old rule: reset to 240/0.922 → 260. v12: implied 260.3 → 260,
    # raise capped at +5 → 255 (the TM converges over later sessions).
    policy: test_week
    lift: bench
    wm: 250
    date: "2027-04-20"
    reading: { weight: 240, reps: 1, rpe: 8, kind: test }
    expect: { decision: raise, new_wm: 255, implied_max: 260.3 }

  - name: test_single_below_tm_drops_in_full
    # 220×1@8 → implied 238.6 → 240 < 250: the block result cuts the TM.
    policy: test_week
    lift: bench
    wm: 250
    date: "2027-04-20"
    reading: { weight: 220, reps: 1, rpe: 8, kind: test }
    expect: { decision: drop, new_wm: 240, cap: 8 }

  # ── §1.4 variant conversion (unchanged) ──────────────────────────────
  - name: touch_and_go_bench_divided_by_1_03
    policy: cut_early
    lift: bench
    wm: 240
    date: "2026-10-05"
    reading: { weight: 247.2, reps: 1, rpe: 8, kind: heavy_top, notes: "touch and go" }
    expect:
      decision: raise
      new_wm: 245
      converted_weight: 240.0
      implied_max: 260.3

  - name: variant_mismatch_paused_deadlift_holds
    policy: cut_early
    lift: deadlift
    wm: 330
    date: "2026-10-09"
    reading: { weight: 300, reps: 1, rpe: 9, kind: heavy_top, notes: "paused at the floor" }
    expect:
      decision: hold
      new_wm: 330
      flags: [VARIANT_MISMATCH]

  # ── consecutive drops ────────────────────────────────────────────────
  - name: second_consecutive_drop_no_top_sets
    policy: cut_early
    lift: bench
    wm: 235
    date: "2026-10-12"
    reading: { weight: 190, reps: 5, rpe: 9, kind: heavy_top }
    prior: { action: drop }
    expect:
      decision: drop
      new_wm: 225   # implied 227.0 → 225, in full
      cap: 8.5
      no_top_sets_next_week: true

  # ── pain cap: freeze + cap 7; clean = rpe < 9, no grind/miss ─────────
  - name: pain_cap_dirty_session_not_clean
    # rpe 9 >= clean_rpe_lt (9) → not clean.
    policy: cut_early
    lift: squat
    wm: 320
    date: "2026-10-05"
    pain_cap: true
    reading: { weight: 300, reps: 1, rpe: 9, kind: heavy_top }
    expect:
      decision: freeze
      new_wm: 320
      source: pain_cap
      cap: 7
      flags: [PAIN_CAP]

  - name: pain_cap_first_clean_session
    policy: cut_early
    lift: squat
    wm: 320
    date: "2026-10-05"
    pain_cap: true
    reading: { weight: 275, reps: 1, rpe: 7, kind: capped }
    expect:
      decision: freeze
      new_wm: 320
      source: pain_cap
      cap: 7
      flags: [PAIN_CAP, PAIN_CAP_CLEAN]

  - name: pain_cap_second_clean_session_lifts
    policy: cut_early
    lift: squat
    wm: 320
    date: "2026-10-12"
    pain_cap: true
    reading: { weight: 285, reps: 1, rpe: 7, kind: capped }
    prior: { action: freeze, pain_cap_clean: true }
    expect:
      decision: freeze
      new_wm: 320
      source: pain_cap
      cap: 7
      flags: [PAIN_CAP, PAIN_CAP_CLEAN, PAIN_CAP_LIFTED]

  # ── NO_READING ───────────────────────────────────────────────────────
  - name: one_readingless_week_holds_silently
    policy: cut_early
    lift: press
    wm: 140
    date: "2026-09-28"
    weeks_without_reading: 1
    expect: { decision: hold, new_wm: 140 }

  - name: two_readingless_weeks_flag_no_reading
    policy: cut_early
    lift: press
    wm: 140
    date: "2026-10-05"
    weeks_without_reading: 2
    expect: { decision: hold, new_wm: 140, flags: [NO_READING] }

  # ── TWO_SIGNALS freezes the week ─────────────────────────────────────
  - name: two_signals_freezes_all_lifts
    policy: cut_early
    lift: bench
    wm: 240
    date: "2026-10-05"
    two_signals: true
    reading: { weight: 195, reps: 5, rpe: 7, kind: heavy_top }
    expect:
      decision: freeze
      new_wm: 240
      flags: [TWO_SIGNALS]

  # ── post-cut blocks run the same one rule ────────────────────────────
  - name: lifting_block_guarded_raise
    # 300×1@7 → implied 336.3 → 335, capped → 325.
    policy: lifting_block
    lift: squat
    wm: 320
    date: "2027-03-08"
    reading: { weight: 300, reps: 1, rpe: 7, kind: heavy_top }
    expect: { decision: raise, new_wm: 325, implied_max: 336.3 }

  - name: climbing_block_guarded_hold
    # 295×1@8 → implied 320.0 → 320 == TM → hold.
    policy: climbing_block
    lift: squat
    wm: 320
    date: "2027-01-12"
    reading: { weight: 295, reps: 1, rpe: 8, kind: heavy_top }
    expect: { decision: hold, new_wm: 320, implied_max: 320.0 }
