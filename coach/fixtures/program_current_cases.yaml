        working_sets: null        # no volume floor on a cut (explicit null)
        working_sets_min_normal: null
        bench_days: 2
        press_days: [1, 2]
        squat_days: [1, 2]
        deadlift_days: 1
        climbing_sessions: 2      # scalar override (cut block)
