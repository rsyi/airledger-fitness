        gain_rate_lb_wk: 0.2

  - name: pre_program_date_resolves_null
    date: "2026-09-20"
    expect: null

  # Version resolution: v7 is the last non-pending entry for 2026-09-21+.
  # v1..v6 share effective_from 2026-09-21; last list entry wins (v7 = v6 +
  # week_start: saturday, the 2026-09-22 accounting-week amendment; slice
  # semantics — targets, templates, week types — are unchanged from v6).
  - name: version_resolution_v6_wins_for_block0
    date: "2026-09-21"
    expect:
      version: 7
      block: 0
      emphasis: cut
      week_in_block: 1
      week_type: normal
      weekday: mon
      today_template:
        morning: "Squat: one hard single at RPE 8 + one back-off at RPE 7 x 3-5. Squat/deadlift alternate weekly: squat heavy + deadlift light, then swap. Face pulls + external rotations."
        afternoon: null
      targets:
        near_max_sets: 4          # v6 targets_block_0: one top single per lift
        working_sets: null        # v6: no volume floor on a cut (explicit null)
        working_sets_min_normal: null
        bench_days: 2
        press_days: [1, 2]
        squat_days: [1, 2]
        deadlift_days: 1
        climbing_sessions: 2      # v6 scalar override (cut block)
        bike_4x4: 1
        gain_rate_lb_wk: [-1.0, -0.5]
