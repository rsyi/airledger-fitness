# Shared fixtures for the program.current resolvers:
#   Dart: ledger/lib/services/program_current.dart (test/program_current_test.dart)
#   TS:   ledger-mcp/src/program.ts             (test/program.test.ts)
# Both suites load THIS file against coach/program.yaml + coach/phase.yaml
# and must produce identical outputs. Drift = a failing test on either side.
#
# Conventions under test (program.yaml v11, approved cut-training
# revision 2026-09-28 on top of v10/post-cut-final-spec.md — the
# BLOCK-0 template/targets are rewritten (cut wave, %TM volume slots,
# hypertrophy band active for the cut); the post-cut tail keeps the
# v10 FINAL-SPEC schedule with Tue = technique/volume, Fri = limit.
# Block-0 climbing is the OPPOSITE: Tue = HARD, Fri = LIGHT):
# - week_in_block: 1-based count of Mondays; the week containing the
#   block's start date is week 1 (all seed blocks start on Mondays).
# - week_type: blocks 2-7 (week_types.applies_to_blocks) run weeks 1-3
#   normal, 4 light, 5-7 normal, 8 test; blocks 0-1 are ALL normal.
# - climbing_sessions: 3 in climbing-emphasis blocks, else 2 (§5.4
#   climbing_wk {lifting_block: 2, climbing_block: 3}).
# - gain_rate_lb_wk: `variant: recomposition` — rated blocks (2-7)
#   resolve to the v9 SOFT band [-0.1, 0.25] (flat is success; weight
#   may drift up with performance) instead of the superseded bulk
#   `rate`; block 0 (cut) uses [-1.0, -0.5]; block 1 (reverse) has no
#   target rate -> null.
# - gain_rate_alarm_lb_wk: v9 advisory 0.5 (blocks >= 1); block 0 keeps
#   the cut-era 0.6 via targets_block_0.
# - bodyweight_band_lb: v9 post-cut SOFT ADVISORY band [154, 165]
#   (bodyweight_band_advisory: true rides along); block 0 keeps the
#   hard cut band [154, 172] (advisory null). hard_cap_lb: post-cut 165
#   is an advisory tripwire; block 0 keeps 172.
# - nutrition: post-cut goes ABSOLUTE — protein_g_day [160, 175],
#   fat_g_day_min [55, 65], carbs_g_day [225, 300]; protein_g_per_lb is
#   explicitly null post-cut. Block 0 keeps protein_g_per_lb [0.8, 1.0]
#   and nulls for the absolute keys.
# - hypertrophy_sets_per_muscle: [8, 12] for blocks >= 1 AND (since
#   v11) for block 0 — the cut runs the same dose band.
# - structural targets (v9 template): near_max_sets 4 (one heavy top
#   set per lift @ RPE 7-8), working_sets 18, press/squat 1 day,
#   bench 2. Block-0 targets come from `targets_block_0` (key present
#   -> overrides base; explicit null -> no target in force; absent ->
#   base value) — v11 REVISED them for the cut schedule: bench 3 days,
#   squat 2, press 2 (scalars, no longer ranges), hypertrophy band
#   [8, 12] ACTIVE for the cut; protein stays relative 0.8-1.0 g/lb.
# - variant: 'recomposition' rides along in targets_in_force.
# - Blocks 0-7 are contiguous (each starts the day after the previous
#   ends), so NO between-blocks gap date exists to test.
# - expect: null means date is outside every block (pre-program).
cases:
  - name: block0_week1_monday_program_start
    date: "2026-09-21"
    expect:
      block: 0
      emphasis: cut
      week_in_block: 1
      week_type: normal
      weekday: mon
      today_template:
        morning: "Squat heavy: wave top per strength_wave_cut (wk1 5@81% / wk2 4@84% / wk3 3@86% / wk4 deload 5@~70% TM, RPE 7-8). Then Bulgarian split squat 3x8-12/leg; bench volume 4x8 @ 68% TM; lateral raise 3x12-20; triceps extension 2-3x10-15. Accessories: double progression, start bottom of range @ 1-2 RIR."
        afternoon: null
      targets:
        near_max_sets: 4          # one wave top per lift per week (v11)
        working_sets: null        # no volume floor on a cut (explicit null)
        working_sets_min_normal: null
        bench_days: 3             # v11 schedule: Mon vol / Wed heavy / Fri vol
        press_days: 2             # Wed vol / Sat heavy
        squat_days: 2             # Mon heavy / Wed vol
        deadlift_days: 1
        climbing_sessions: 2      # scalar override (cut block)
        bike_4x4: 1
        gain_rate_lb_wk: [-1.0, -0.5]
        gain_rate_alarm_lb_wk: 0.6   # cut keeps the v7 alarm (targets_block_0)
        bodyweight_band_lb: [154, 172] # cut keeps the v7 band (targets_block_0)
        bodyweight_band_advisory: null # the cut band is NOT advisory
        hard_cap_lb: 172             # cut keeps the v7 cap (targets_block_0)
        protein_g_per_lb: [0.8, 1.0] # cut keeps the v7 floor (UNCHANGED in v11)
        protein_g_day: null          # absolute targets are post-cut only
        fat_g_day_min: null
        carbs_g_day: null
        hypertrophy_sets_per_muscle: [8, 12] # v11: the band is ACTIVE for the cut
        variant: recomposition

