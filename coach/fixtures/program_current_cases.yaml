# Shared fixtures for the program.current resolvers:
#   Dart: ledger/lib/services/program_current.dart (test/program_current_test.dart)
#   TS:   ledger-mcp/src/program.ts             (test/program.test.ts)
# Both suites load THIS file against coach/program.yaml + coach/phase.yaml
# and must produce identical outputs. Drift = a failing test on either side.
#
# Conventions under test:
# - week_in_block: 1-based count of Mondays; the week containing the
#   block's start date is week 1 (all seed blocks start on Mondays).
# - week_type: blocks 2-7 (week_types.applies_to_blocks) run weeks 1-3
#   normal, 4 light, 5-7 normal, 8 test; blocks 0-1 are ALL normal.
# - climbing_sessions: 3 in climbing-emphasis blocks, else 2 (§5.4
#   climbing_wk {lifting_block: 2, climbing_block: 3}).
# - gain_rate_lb_wk: the block's `rate` when present; block 0 (cut) uses
#   [-1.0, -0.5]; block 1 (reverse) has no target rate -> null.
# - block-0 targets come from v6 `targets_block_0` (key present ->
#   overrides base `targets`; explicit null -> no target in force;
#   absent -> base value). Other blocks use base `targets` untouched.
# - Blocks 0-7 are contiguous (each starts the day after the previous
#   ends), so NO between-blocks gap date exists to test.
# - expect: null means date is outside every block (pre-program).
cases:
  - name: block0_week1_monday_program_start
    date: "2026-09-21"
    expect:
      block: 0
      emphasis: cut
      week_in_block: 1
      week_type: normal
      weekday: mon
      today_template:
        morning: "Squat: one hard single at RPE 8 + one back-off at RPE 7 x 3-5. Squat/deadlift alternate weekly: squat heavy + deadlift light, then swap. Face pulls + external rotations."
        afternoon: null
      targets:
        near_max_sets: 4          # v6 targets_block_0: one top single per lift
        working_sets: null        # v6: no volume floor on a cut (explicit null)
        working_sets_min_normal: null
        bench_days: 2
        press_days: [1, 2]
        squat_days: [1, 2]
        deadlift_days: 1
        climbing_sessions: 2      # v6 scalar override (cut block)
        bike_4x4: 1
        gain_rate_lb_wk: [-1.0, -0.5]

  - name: block0_week3_midweek_wednesday
    date: "2026-10-07"
    expect:
      block: 0
      emphasis: cut
      week_in_block: 3
      week_type: normal
      weekday: wed
      today_template:
        morning: "Calisthenics."
        afternoon: "Flex slot for Climb 2 (default is Friday)."
      targets:
        near_max_sets: 4          # v6 targets_block_0: one top single per lift
        working_sets: null        # v6: no volume floor on a cut (explicit null)
        working_sets_min_normal: null
        bench_days: 2
        press_days: [1, 2]
        squat_days: [1, 2]
        deadlift_days: 1
        climbing_sessions: 2      # v6 scalar override (cut block)
        bike_4x4: 1
        gain_rate_lb_wk: [-1.0, -0.5]

  - name: block0_last_day_sunday_week12_still_normal
    date: "2026-12-13"
    expect:
      block: 0
      emphasis: cut
      week_in_block: 12
      week_type: normal
      weekday: sun
      today_template:
        morning: null
        afternoon: null
      targets:
        near_max_sets: 4          # v6 targets_block_0: one top single per lift
        working_sets: null        # v6: no volume floor on a cut (explicit null)
        working_sets_min_normal: null
        bench_days: 2
        press_days: [1, 2]
        squat_days: [1, 2]
        deadlift_days: 1
        climbing_sessions: 2      # v6 scalar override (cut block)
        bike_4x4: 1
        gain_rate_lb_wk: [-1.0, -0.5]

  - name: block1_week1_reverse_starts
    date: "2026-12-14"
    expect:
      block: 1
      emphasis: reverse
      week_in_block: 1
      week_type: normal
      weekday: mon
