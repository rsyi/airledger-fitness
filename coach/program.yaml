    # dropped unless their rounded weight is strictly above it. The whole
    # ramp is skipped when the working weight is unknown (no reference —
    # the planner never guesses). Per-lift keys override `default`.
    warmup_protocol:
      rounding_lb: 5
      default:
        - { weight_lb: 45, reps: 10 }   # empty bar
