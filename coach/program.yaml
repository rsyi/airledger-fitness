      squat_days_wk: 2
      deadlift_days_wk: 1
      climbing_wk: { lifting_block: 2, climbing_block: 3 }
      bike_4x4_wk: 1
      muscle_up_sessions_wk: 1
      block_length_wk: 8
      protein_g_per_lb: [0.8, 1.0]

    # 2.6 flag rule ids in force
    rules:
      - WEIGHT_FAST
      - WEIGHT_FLAT
      - WEIGHT_CAP
      - WEIGHT_DRIFT
      - PHASE_MISMATCH
      - NEAR_MAX_LOW
