      climbing_session: { back: 3.0, forearms: 3.0, biceps: 1.5, core: 1.0 }

    # 5.4 Targets — UNCHANGED from v11.
    targets:
      gain_rate_lb_wk: { blocks_2_7: [-0.1, 0.25], alarm: 0.5, alarm_weeks: 2 }
      bodyweight_lb: { soft_band: [154, 165], advisory: true }
      near_max_sets_wk: 4        # one heavy top set (wave 5/3/1 @ RPE 7-8) per lift
      working_sets_wk: 18        # planned main-lift working sets in the template
      working_sets_wk_min_normal: 14
      bench_days_wk: 2           # Tue heavy + Sat hypertrophy exposure
      press_days_wk: 1           # Sat (heavy + hypertrophy same day)
      squat_days_wk: 1           # Mon (heavy + hypertrophy same day)
      deadlift_days_wk: 1        # Fri
      climbing_wk: { lifting_block: 2, climbing_block: 3 }
      bike_4x4_wk: 1
