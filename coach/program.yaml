        hold_band: [6.5, 7.5]
        drop_if_rpe_gte: 8.5
        step_lb: { bench: 5, press: 5, squat: 5, deadlift: 5 }
        frozen: true
        cap_rpe: 7
        cap_after_drop_rpe: 7
        consecutive_drops_action: no_top_sets_next_week
        readings_that_raise: []
        readings_that_lower: [heavy_top, saturday_single, capped]
        reset_on: test
        saturday_single: false
      - name: reverse
        applies: { block: 1 }
        seed: "last cut_late RPE-7 single / 0.892"
        target_rpe: [7, 7]
        raise_if_rpe_lte: null            # no raises
        raise_requires_consecutive: 2
        hold_band: [6.5, 7.5]
        drop_if_rpe_gte: 8.5
        step_lb: { bench: 5, press: 5, squat: 5, deadlift: 5 }
        frozen: true
        cap_rpe: 7
        cap_after_drop_rpe: 7
        consecutive_drops_action: no_top_sets_next_week
        readings_that_raise: []
        readings_that_lower: [heavy_top, saturday_single, capped]
        reset_on: test
        saturday_single: false
      - name: lifting_block
        applies: { blocks: [3, 5, 7] }
        target_rpe: [8.5, 9]
        raise_if_rpe_lte: 8
        raise_requires_consecutive: 1
        hold_band: [8.5, 9]
        drop_if_rpe_gte: 9.5
        step_lb: { bench: 5, press: 5, squat: 5, deadlift: 5 }
        frozen: false
        cap_rpe: 9
        cap_after_drop_rpe: 9
        consecutive_drops_action: no_top_sets_next_week
        readings_that_raise: [heavy_top]
        readings_that_lower: [heavy_top, saturday_single, capped]
        reset_on: test
        saturday_single: true
      - name: climbing_block
        applies: { blocks: [2, 4, 6] }
        target_rpe: [7.5, 8]              # target <= 8
        raise_if_rpe_lte: null            # no raises
        raise_requires_consecutive: 2
        hold_band: [7.5, 8]
        drop_if_rpe_gte: 9
        step_lb: { bench: 5, press: 5, squat: 5, deadlift: 5 }
        frozen: true
        cap_rpe: 8
        cap_after_drop_rpe: 8
        consecutive_drops_action: no_top_sets_next_week
        readings_that_raise: []
        readings_that_lower: [heavy_top, saturday_single, capped]
        reset_on: test
        saturday_single: false
      - name: light_week
        applies: { week_type: light }
        target_rpe: [6, 6]
        raise_if_rpe_lte: null
        raise_requires_consecutive: 2
        hold_band: null
        drop_if_rpe_gte: null             # readings recorded + IGNORED
        step_lb: { bench: 5, press: 5, squat: 5, deadlift: 5 }
        frozen: true
        cap_rpe: 6
        cap_after_drop_rpe: 6
        consecutive_drops_action: no_top_sets_next_week
        readings_that_raise: []
        readings_that_lower: []
        readings_ignored: true
        reset_on: test
        saturday_single: false
        resume: "week 5 resumes at week 3's number (light-week holds never move wm)"
      - name: test_week
        applies: { week_type: test }
        target_rpe: [8, 8]
        raise_if_rpe_lte: null
        raise_requires_consecutive: 2
        hold_band: null
        drop_if_rpe_gte: null
        step_lb: { bench: 5, press: 5, squat: 5, deadlift: 5 }
        frozen: true
        cap_rpe: 8
        cap_after_drop_rpe: 8
        consecutive_drops_action: no_top_sets_next_week
        readings_that_raise: []
        readings_that_lower: []
        reset_on: test
        saturday_single: false
        note: "the RPE-8 single resets wm: weight / 0.922, round DOWN to 5"

    # 5.3 Loads
    loads:
      top_set:
        reps: [1, 3]
        rpe: [8.5, 9]
        pct_max_by_reps: { 1: 0.96, 2: 0.90, 3: 0.88 }
        rotate_weekly: true
      back_offs:
        reps: 3
        sets: { squat: 4, bench: 4, press: 4, deadlift: 3 }
        pct_max: [0.81, 0.83]
        rpe: [6.5, 7.5]
      volume_day:
        sets_reps: "3x8"
        pct_max: 0.70
        progression: "add one rep per set weekly to 3x10, then +5 lb and back to 3x8"
      saturday_single: { lifts: [bench, squat], rpe: 8.5 }
      progression: "+5 lb to working max when top set RPE 8.5 or easier two sessions running"
      regression: "two consecutive top sets at RPE 9.5 -> next week RPE 8, no top-set attempts on that lift"
      never: "no grinders"
      light_week:
        top_set_rpe: 6
        back_offs: 0
        volume: "2x8"
        climbing: "one fewer"
        hangboard: "off"
      test_week: "one single at RPE 8 on squat, bench, deadlift, press; those four numbers are the block's result"
      climbing_block:
        top_set_rpe_cap: 8
        back_offs: "held"
        climbing: 3
        max_hangs: "5x7s on 20mm before the two hard sessions"
      lifting_block:
        climbing: 2
        climbing_intensity: "both below limit"
        hangboard: "once a week or off"

    # 5.4 Targets
    targets:
      gain_rate_lb_wk: { blocks_2_5: [0.2, 0.5], blocks_6_7: [0.1, 0.3], alarm: 0.6 }
      bodyweight_lb: { band: [154, 172], hold: [168, 170] }
      near_max_sets_wk: 6
      working_sets_wk: 28
      working_sets_wk_min_normal: 20
      bench_days_wk: 2
      press_days_wk: 2
      squat_days_wk: 2
      deadlift_days_wk: 1
      climbing_wk: { lifting_block: 2, climbing_block: 3 }
      bike_4x4_wk: 1
      muscle_up_sessions_wk: 1
      block_length_wk: 8
      protein_g_per_lb: [0.8, 1.0]

    # 5.4b Block-0 (cut) target overrides. Encoding: block-keyed
    # `targets_block_0`, mirroring weekly_template_block_0 (this file's
    # existing block-0 override convention) rather than a per-emphasis
    # map — block 0 is the only cut block in this program and the
    # resolvers already branch on the block number for the template.
    # Semantics (program_current.dart / program.ts): a key PRESENT here
    # overrides the base `targets` value for block-0 dates; a key
    # present WITH null means "no target in force" (the matching flag
    # rule is off); a key ABSENT falls through to base `targets`.
    targets_block_0:
      # One top single per lift (squat, bench, deadlift, press) at
      # RPE <= 8 — four near-max sets is the whole heavy quota on a cut.
      near_max_sets_wk: 4
      # No volume floor on a cut: maintenance stimulus, not bulk
      # volume. Explicit nulls (not omissions) so WORKING_LOW is
      # provably off rather than silently inheriting 28/20.
      working_sets_wk: null
      working_sets_wk_min_normal: null
      bench_days_wk: 2
      # Per the block-0 template: press lands Tue or Sat (sometimes
      # both); squat is one heavy or one light day depending on the
      # week's alternation, occasionally both.
      press_days_wk: [1, 2]
      squat_days_wk: [1, 2]
      deadlift_days_wk: 1
      # Scalar override — block 0 is neither a lifting_block nor a
      # climbing_block, so the emphasis-keyed climbing_wk map does not
      # apply.
      climbing_wk: 2
      bike_4x4_wk: 1

    # 2.6 flag rule ids in force
    rules:
      - WEIGHT_FAST
      - WEIGHT_FLAT
      - WEIGHT_CAP
      - WEIGHT_DRIFT
      - PHASE_MISMATCH
      - NEAR_MAX_LOW
      - WORKING_LOW
      - LONG_SETS
      - BENCH_ONCE
      - TUESDAY_LOWER
      - CLIMB_OVER
      - BIKE_DROP
      - TOP_SET_HEAVY
      - PAIN_NOTE
      - TWO_SIGNALS
      - BLOCK_END

    # 5.5 Nutrition
    nutrition:
      surplus_kcal: { rate_0_4: 200, rate_0_2: 100 }
      adjust: "every third Sunday, 7-day average vs block target line: >1 lb over -> -100; >1 lb under -> +100; never a bigger step"
      maintenance_week: "week 4 of every block at maintenance"
      carbs: "extra on the four lifting days and the limit-climbing day"
      maintenance_definition: "the intake at which the 7-day average holds for two weeks; recorded at end of block 1"

  - version: 7
    effective_from: "2026-09-21"
    reason: "Accounting weeks start Saturday (user amendment 2026-09-22: weekend sessions read as getting ahead, not catching up)"
    id: bulk-2026-27

    # Accounting-week start (amendment 2026-09-22). Scope: weekly
    # ROLLUP keying only — metrics/flags weeks, the live this-week
    # strip, the planner generation window, the weekly Wilks stat.
    # Program STRUCTURE (block boundaries, week_in_block, week_type)
    # stays Monday-anchored; accounting weeks resolve onto it via the
    # first Monday on/after the week start (anchorMondayOf). The §6
    # backtest stays pinned to monday (historical validation intact).
    week_start: saturday

    block_0_loads: "Maintenance: one top single at RPE 8 + one back-off at RPE 7 x 3-5 per lift; top singles at RPE 7 from Nov 16."

    # 5.1 Blocks (contiguous: each starts the day after the previous ends)
    blocks:
      - { n: 0, dates: ["2026-09-21", "2026-12-13"], emphasis: cut,      weight: [163, 154], notes: "Maintenance week + DEXA Nov 2-8. Top singles at RPE 7 from Nov 16." }
      - { n: 1, dates: ["2026-12-14", "2027-01-03"], emphasis: reverse,  weight: [154, 155], notes: "Add ~150 kcal/day per week until the 7-day average holds two weeks; that is maintenance. Full training week at RPE 7." }
      - { n: 2, dates: ["2027-01-04", "2027-02-28"], emphasis: climbing, weight: [154, 157], rate: 0.4 }
      - { n: 3, dates: ["2027-03-01", "2027-04-25"], emphasis: lifting,  weight: [157, 160], rate: 0.4 }
      - { n: 4, dates: ["2027-04-26", "2027-06-20"], emphasis: climbing, weight: [160, 163], rate: 0.4, notes: "End with an outdoor trip or a comp." }
      - { n: 5, dates: ["2027-06-21", "2027-08-15"], emphasis: lifting,  weight: [163, 166], rate: 0.4 }
      - { n: 6, dates: ["2027-08-16", "2027-10-10"], emphasis: climbing, weight: [166, 168], rate: 0.2 }
      - { n: 7, dates: ["2027-10-11", "2027-12-05"], emphasis: lifting,  weight: [168, 170], rate: 0.2, notes: "Then hold 168-170." }
    hard_cap_lb: 172
    band_lb: [154, 172]

    # Blocks 2-7 are 8 weeks: weeks 1-3 normal, week 4 light, weeks 5-7
    # normal, week 8 test. Blocks 0-1 have no light/test cadence — every
    # week is normal (applies_to_blocks makes that explicit).
    week_types:
      normal: {}
      light: { week_in_block: 4 }
      test: { week_in_block: 8 }
      applies_to_blocks: [2, 3, 4, 5, 6, 7]

    # 5.2 Weekly template (blocks 1-7), per weekday.
    weekly_template:
      mon:
        morning: "Squat heavy: top set of 1-3 at RPE 8.5-9, then 4x3 at 82%; hanging leg raise; muscle-ups (3-4 sets of 1-2, 2x3-5 banded strict, front lever up-downs 2x5, ~10 min)."
        afternoon: null
      tue:
        morning: "Bench heavy: top set of 1-3, then 4x3 at 82%; press light 3x8 at 70%."
        afternoon: "Climb 1, limit/projecting (partner day, through June 2027). No squat or deadlift on this day."
      wed:
        morning: "Bike 4x4; 10 min hip and thoracic mobility. Easy day."
        afternoon: null
      thu:
        morning: "Deadlift heavy: top set of 1-3, then 3x3 at 82%; press heavy: top set, then 4x3."
        afternoon: null
      fri:
        morning: null
        afternoon: "Climb 2, board/steep-wall power. Max hangs first in climbing blocks."
      sat:
        morning: "Bench: one single at RPE 8.5, then 3x8 at 70%; weighted pull-ups 5x3, rows, face pulls; squat: one single at RPE 8.5, then 3x8 at 70%; optional deadlift 3x5 at 65% only after four clean weeks. Longest session."
        afternoon: null
      sun:
        morning: null
        afternoon: "Climb 3, volume/technique, climbing blocks only."

    # 5.2c Planned-lift alternation (weekly auto-planning, block 0).
    # a/b parity = whole ISO weeks since anchor_monday: even = a, odd = b.
    planned_alternation:
      anchor_monday: "2026-09-21"
      note: "A week = squat heavy + deadlift light; B week = deadlift heavy + squat light"

    # 5.2b Block-0 weekly template (cut phase).
    # Replaces weekly_template for block 0 only.
    #
    # `planned` = structured lifts the app auto-plans into the strength
    # timeline each week (one row per set). Main lifts ONLY — accessories
    # stay prose. Exercise strings must match the logged names EXACTLY
    # (metrics depend on them). Rep ranges resolve to the LOW end.
    # NEVER carries rpe/notes/weight — those are logged, not planned.
    weekly_template_block_0:
      mon:
        morning: "Squat: one hard single at RPE 8 + one back-off at RPE 7 x 3-5. Squat/deadlift alternate weekly: squat heavy + deadlift light, then swap. Face pulls + external rotations."
        afternoon: null
        planned:
          a: # squat heavy: hard single + back-off triple
            - { exercise: "Barbell Squat", sets: 1, reps: 1 }
            - { exercise: "Barbell Squat", sets: 1, reps: 3 }
          b: # squat light: one triple at lower weight
            - { exercise: "Barbell Squat", sets: 1, reps: 3 }
      tue:
        morning: "Bench: one hard set at RPE 8 + back-off RPE 7 x 3-5; OHP here if not covered Saturday. No squat or deadlift today."
        afternoon: "Climb 1 — Tuesday partner session."
        planned: # OHP may land Saturday instead; planned here, user adjusts
          - { exercise: "Flat Barbell Bench Press", sets: 1, reps: 1 }
          - { exercise: "Flat Barbell Bench Press", sets: 1, reps: 3 }
          - { exercise: "Overhead Press", sets: 1, reps: 1 }
          - { exercise: "Overhead Press", sets: 1, reps: 3 }
      wed:
        morning: "Calisthenics."
        afternoon: "Flex slot for Climb 2 (default is Friday)."
      thu:
        morning: "4x4 run (usually treadmill). Deadlift sometimes lands here instead of Friday."
        afternoon: null
      fri:
        morning: "Deadlift (if not Thursday): one hard single RPE 8 + back-off RPE 7 x 3-5, alternating heavy/light with squat."
        afternoon: "Climb 2 (default)."
        planned:
          a: # deadlift light opposite the heavy squat week
            - { exercise: "Barbell Deadlift", sets: 1, reps: 3 }
          b: # deadlift heavy: hard single + back-off triple
            - { exercise: "Barbell Deadlift", sets: 1, reps: 1 }
            - { exercise: "Barbell Deadlift", sets: 1, reps: 3 }
      sat:
        morning: "OHP if not Tuesday. Weekly row (inverted ring rows / seated cable row). EZ bar curls, lateral dumbbell raises."
        afternoon: null
      sun:
        morning: null
        afternoon: null

    # 5.2d Warm-up ramp (weekly auto-planning, user-approved 2026-09-21).
    # The planner prepends these rows before each planned lift's working
    # sets. `pct_top` steps are percentages of the day's TOP working
    # weight, rounded to rounding_lb; steps with `min_above_lb` are
    # dropped unless their rounded weight is strictly above it. The whole
    # ramp is skipped when the working weight is unknown (no reference —
    # the planner never guesses). Per-lift keys override `default`.
    warmup_protocol:
      rounding_lb: 5
      default:
        - { weight_lb: 45, reps: 10 }   # empty bar
        - { pct_top: 0.40, reps: 5 }
        - { pct_top: 0.60, reps: 3 }
        - { pct_top: 0.80, reps: 1 }
      deadlift:                          # plates start at 135; no bar work
        - { weight_lb: 135, reps: 5 }
        - { pct_top: 0.60, reps: 3, min_above_lb: 135 }
        - { pct_top: 0.80, reps: 1, min_above_lb: 135 }

    # 5.2e Working-weight fill (weekly auto-planning, user-approved
    # 2026-09-21). Planned working sets get
    #   weight = reference e1rm x pct_by_reps[planned reps], round 5
    # where the reference is the lift's 42-day reference e1rm (spec §2.5
    # semantics: max Epley e1rm over qualifying reps<=8 sets in the 42
    # days ending today, carried forward when the window is empty).
    # Weight is ABSENT when no reference exists or the planned reps have
    # no pct entry. rpe and notes are NEVER auto-filled (standing
    # constraint) — they describe what happened, not what's planned.
    weight_fill:
      method: reference_e1rm
      reference_days: 42
      pct_by_reps: { 1: 0.96, 3: 0.88 }
      rounding_lb: 5
      never_fill: [rpe, notes]

    # ------------------------------------------------------------------
    # Working-max controller (2026-09-21-working-max-controller-spec.md,
    # airledger repo). Resolvers: ledger lib/services/working_max.dart
    # (+ TS port in ledger-mcp, cross-checked by shared fixture traces).
    # ------------------------------------------------------------------

    # §1.3 RPE chart — % of working max by RPE x reps. Keys are strings
    # so both YAML parsers (Dart / TS) agree; values are percents.
    # Outside the table fall back to inverted Epley:
    #   pct = 1 / (1 + (reps + (10 - rpe)) / 30)
    rpe_chart:
      fallback: "inverted Epley: pct = 1 / (1 + (reps + (10 - rpe)) / 30)"
      pct_by_rpe_reps:
        "10":  { "1": 100,  "2": 95.5, "3": 92.2, "4": 89.2, "5": 86.3, "6": 83.7, "8": 78.6 }
        "9.5": { "1": 97.8, "2": 93.9, "3": 90.7, "4": 87.8, "5": 85.0, "6": 82.4, "8": 77.4 }
        "9":   { "1": 95.5, "2": 92.2, "3": 89.2, "4": 86.3, "5": 83.7, "6": 81.1, "8": 76.2 }
        "8.5": { "1": 93.9, "2": 90.7, "3": 87.8, "4": 85.0, "5": 82.4, "6": 79.9, "8": 75.1 }
        "8":   { "1": 92.2, "2": 89.2, "3": 86.3, "4": 83.7, "5": 81.1, "6": 78.6, "8": 73.9 }
        "7.5": { "1": 90.7, "2": 87.8, "3": 85.0, "4": 82.4, "5": 79.9, "6": 77.4, "8": 72.3 }
        "7":   { "1": 89.2, "2": 86.3, "3": 83.7, "4": 81.1, "5": 78.6, "6": 76.2, "8": 70.7 }
        "6.5": { "1": 87.8, "2": 85.0, "3": 82.4, "4": 79.9, "5": 77.4, "6": 75.1, "8": 69.4 }
        "6":   { "1": 86.3, "2": 83.7, "3": 81.1, "4": 78.6, "5": 76.2, "6": 73.9, "8": 68.0 }

    # §1.4 Variants — parsed from strength-row notes by keyword; unknown
    # text -> the lift's default (shown in app for correction). pct is the
    # variant's strength delta vs the default: convert an observed weight
    # to default-variant terms by dividing by (1 + pct/100) BEFORE any
    # comparison (touch-and-go bench: divide by 1.03). `parse` lists the
    # keywords that are variant-bearing FOR THAT LIFT; keywords outside it
    # are gear/context notes and ignored ("straps, paused" on bench =
    # wrist straps; belts never matter on bench/press). A parsed in-scope
    # keyword with no conversion entry (paused deadlift, pin squat) ->
    # VARIANT_MISMATCH: hold + deviation prompt, never a guessed
    # conversion.
    variants:
      keywords: [paused, pins, touch and go, belted, unbelted, straps, double overhand]
      bench:
        default: paused
        parse: [paused, pins, touch_and_go]
        conversions:
          paused: 0
          pins: 0            # pins = paused
          touch_and_go: 3    # +3% -> divide by 1.03
      squat:
        default: belted
        parse: [paused, pins, belted, unbelted]
        conversions:
          belted: 0
          unbelted: -3
          paused: -3
          belted_paused: -3  # "belted, paused" = -3% once, never stacked
      deadlift:
        default: belted
        parse: [belted, unbelted, straps, double_overhand, paused, pins, touch_and_go]
        conversions:
          belted: 0
          unbelted: -4
          straps: 0          # straps / double-overhand: no change
          double_overhand: 0
      press:
        default: standard
        parse: []            # press is always standard; keywords = gear
        conversions:
          standard: 0

    # §1.5/§3 load policies — the one abstraction the controller runs on.
    # Selection: week_type light -> light_week, test -> test_week; else by
    # block (+ date split inside block 0). reset_on test: wm = single
    # weight / 0.922 rounded DOWN to 5. cap_after_drop_rpe caps the NEXT
    # top set after a drop. consecutive_drops_action fires on two drops
    # in a row. raise_requires_consecutive 2 = cut_early's twice-in-a-row
    # rule (one good day never pushes the number up in a deficit).
    # Cut expectation: bodyweight falls ~0.75/wk; squat/deadlift drift
    # 1-2%/month; a drop or two is not failure. From Nov 16 nothing
    # rises; the last RPE-7 singles seed the reverse.
    load_policies:
      - name: cut_early
        applies: { block: 0, dates: ["2026-09-21", "2026-11-15"] }
        target_rpe: [7.5, 8]
        raise_if_rpe_lte: 7
        raise_requires_consecutive: 2
        hold_band: [7.5, 8.5]
        drop_if_rpe_gte: 9
        step_lb: { bench: 5, press: 5, squat: 5, deadlift: 5 }
        frozen: false
        cap_rpe: 8.5
        cap_after_drop_rpe: 8.5
        consecutive_drops_action: no_top_sets_next_week
        readings_that_raise: [heavy_top]
        readings_that_lower: [heavy_top, saturday_single, capped]
        reset_on: test
        saturday_single: true
      - name: cut_late
        applies: { block: 0, dates: ["2026-11-16", "2026-12-13"] }
        target_rpe: [7, 7]
        raise_if_rpe_lte: null            # no raises
        raise_requires_consecutive: 2
        hold_band: [6.5, 7.5]
        drop_if_rpe_gte: 8.5
        step_lb: { bench: 5, press: 5, squat: 5, deadlift: 5 }
        frozen: true
        cap_rpe: 7
        cap_after_drop_rpe: 7
        consecutive_drops_action: no_top_sets_next_week
        readings_that_raise: []
        readings_that_lower: [heavy_top, saturday_single, capped]
        reset_on: test
        saturday_single: false
      - name: reverse
        applies: { block: 1 }
        seed: "last cut_late RPE-7 single / 0.892"
        target_rpe: [7, 7]
        raise_if_rpe_lte: null            # no raises
        raise_requires_consecutive: 2
        hold_band: [6.5, 7.5]
        drop_if_rpe_gte: 8.5
        step_lb: { bench: 5, press: 5, squat: 5, deadlift: 5 }
        frozen: true
        cap_rpe: 7
        cap_after_drop_rpe: 7
        consecutive_drops_action: no_top_sets_next_week
        readings_that_raise: []
        readings_that_lower: [heavy_top, saturday_single, capped]
        reset_on: test
        saturday_single: false
      - name: lifting_block
        applies: { blocks: [3, 5, 7] }
        target_rpe: [8.5, 9]
        raise_if_rpe_lte: 8
        raise_requires_consecutive: 1
        hold_band: [8.5, 9]
        drop_if_rpe_gte: 9.5
        step_lb: { bench: 5, press: 5, squat: 5, deadlift: 5 }
        frozen: false
        cap_rpe: 9
        cap_after_drop_rpe: 9
        consecutive_drops_action: no_top_sets_next_week
        readings_that_raise: [heavy_top]
        readings_that_lower: [heavy_top, saturday_single, capped]
        reset_on: test
        saturday_single: true
      - name: climbing_block
        applies: { blocks: [2, 4, 6] }
        target_rpe: [7.5, 8]              # target <= 8
        raise_if_rpe_lte: null            # no raises
        raise_requires_consecutive: 2
        hold_band: [7.5, 8]
        drop_if_rpe_gte: 9
        step_lb: { bench: 5, press: 5, squat: 5, deadlift: 5 }
        frozen: true
        cap_rpe: 8
        cap_after_drop_rpe: 8
        consecutive_drops_action: no_top_sets_next_week
        readings_that_raise: []
        readings_that_lower: [heavy_top, saturday_single, capped]
        reset_on: test
        saturday_single: false
      - name: light_week
        applies: { week_type: light }
        target_rpe: [6, 6]
        raise_if_rpe_lte: null
        raise_requires_consecutive: 2
        hold_band: null
        drop_if_rpe_gte: null             # readings recorded + IGNORED
        step_lb: { bench: 5, press: 5, squat: 5, deadlift: 5 }
        frozen: true
        cap_rpe: 6
        cap_after_drop_rpe: 6
        consecutive_drops_action: no_top_sets_next_week
        readings_that_raise: []
        readings_that_lower: []
        readings_ignored: true
        reset_on: test
        saturday_single: false
        resume: "week 5 resumes at week 3's number (light-week holds never move wm)"
      - name: test_week
        applies: { week_type: test }
        target_rpe: [8, 8]
        raise_if_rpe_lte: null
        raise_requires_consecutive: 2
        hold_band: null
        drop_if_rpe_gte: null
        step_lb: { bench: 5, press: 5, squat: 5, deadlift: 5 }
        frozen: true
        cap_rpe: 8
        cap_after_drop_rpe: 8
        consecutive_drops_action: no_top_sets_next_week
        readings_that_raise: []
        readings_that_lower: []
        reset_on: test
        saturday_single: false
        note: "the RPE-8 single resets wm: weight / 0.922, round DOWN to 5"

    # 5.3 Loads
    loads:
      top_set:
        reps: [1, 3]
        rpe: [8.5, 9]
        pct_max_by_reps: { 1: 0.96, 2: 0.90, 3: 0.88 }
        rotate_weekly: true
      back_offs:
        reps: 3
        sets: { squat: 4, bench: 4, press: 4, deadlift: 3 }
        pct_max: [0.81, 0.83]
        rpe: [6.5, 7.5]
      volume_day:
        sets_reps: "3x8"
        pct_max: 0.70
        progression: "add one rep per set weekly to 3x10, then +5 lb and back to 3x8"
      saturday_single: { lifts: [bench, squat], rpe: 8.5 }
      progression: "+5 lb to working max when top set RPE 8.5 or easier two sessions running"
      regression: "two consecutive top sets at RPE 9.5 -> next week RPE 8, no top-set attempts on that lift"
      never: "no grinders"
      light_week:
        top_set_rpe: 6
        back_offs: 0
        volume: "2x8"
        climbing: "one fewer"
        hangboard: "off"
      test_week: "one single at RPE 8 on squat, bench, deadlift, press; those four numbers are the block's result"
      climbing_block:
        top_set_rpe_cap: 8
        back_offs: "held"
        climbing: 3
        max_hangs: "5x7s on 20mm before the two hard sessions"
      lifting_block:
        climbing: 2
        climbing_intensity: "both below limit"
        hangboard: "once a week or off"

    # 5.4 Targets
    targets:
      gain_rate_lb_wk: { blocks_2_5: [0.2, 0.5], blocks_6_7: [0.1, 0.3], alarm: 0.6 }
      bodyweight_lb: { band: [154, 172], hold: [168, 170] }
      near_max_sets_wk: 6
      working_sets_wk: 28
      working_sets_wk_min_normal: 20
      bench_days_wk: 2
      press_days_wk: 2
      squat_days_wk: 2
      deadlift_days_wk: 1
      climbing_wk: { lifting_block: 2, climbing_block: 3 }
      bike_4x4_wk: 1
      muscle_up_sessions_wk: 1
      block_length_wk: 8
      protein_g_per_lb: [0.8, 1.0]

    # 5.4b Block-0 (cut) target overrides. Encoding: block-keyed
    # `targets_block_0`, mirroring weekly_template_block_0 (this file's
    # existing block-0 override convention) rather than a per-emphasis
    # map — block 0 is the only cut block in this program and the
    # resolvers already branch on the block number for the template.
    # Semantics (program_current.dart / program.ts): a key PRESENT here
    # overrides the base `targets` value for block-0 dates; a key
    # present WITH null means "no target in force" (the matching flag
    # rule is off); a key ABSENT falls through to base `targets`.
    targets_block_0:
      # One top single per lift (squat, bench, deadlift, press) at
      # RPE <= 8 — four near-max sets is the whole heavy quota on a cut.
      near_max_sets_wk: 4
      # No volume floor on a cut: maintenance stimulus, not bulk
      # volume. Explicit nulls (not omissions) so WORKING_LOW is
      # provably off rather than silently inheriting 28/20.
      working_sets_wk: null
      working_sets_wk_min_normal: null
      bench_days_wk: 2
      # Per the block-0 template: press lands Tue or Sat (sometimes
      # both); squat is one heavy or one light day depending on the
      # week's alternation, occasionally both.
      press_days_wk: [1, 2]
      squat_days_wk: [1, 2]
      deadlift_days_wk: 1
      # Scalar override — block 0 is neither a lifting_block nor a
      # climbing_block, so the emphasis-keyed climbing_wk map does not
      # apply.
      climbing_wk: 2
      bike_4x4_wk: 1

    # 2.6 flag rule ids in force
    rules:
      - WEIGHT_FAST
      - WEIGHT_FLAT
      - WEIGHT_CAP
      - WEIGHT_DRIFT
      - PHASE_MISMATCH
      - NEAR_MAX_LOW
      - WORKING_LOW
      - LONG_SETS
      - BENCH_ONCE
      - TUESDAY_LOWER
      - CLIMB_OVER
      - BIKE_DROP
      - TOP_SET_HEAVY
      - PAIN_NOTE
      - TWO_SIGNALS
      - BLOCK_END

    # 5.5 Nutrition
    nutrition:
      surplus_kcal: { rate_0_4: 200, rate_0_2: 100 }
      adjust: "every third Sunday, 7-day average vs block target line: >1 lb over -> -100; >1 lb under -> +100; never a bigger step"
      maintenance_week: "week 4 of every block at maintenance"
      carbs: "extra on the four lifting days and the limit-climbing day"
      maintenance_definition: "the intake at which the 7-day average holds for two weeks; recorded at end of block 1"

  # ====================================================================
  # v8 — RECOMPOSITION VARIANT (source: coach/program-2026-27-source.md
  # §"Recomposition variant, active from Dec 14"). The year runs on this
  # variant instead of the bulk: SAME blocks, SAME training week, SAME
  # heavy-day rule / loads / load_policies — food stays at maintenance
  # and the muscle-building energy comes out of the fat store. Expect
  # ~0.3-0.6 lb muscle/month, a scale that barely moves, body fat at or
  # under 13% all year, and roughly 25 lb less on the total by December
  # 2027 than the bulk would give (most of that leverage, not muscle).
  # Only targets + nutrition for blocks >= 1 change; the reverse diet,
  # the first climbing block's training and the WHOLE cut (block 0,
  # targets_block_0) are unchanged. The superseded bulk numbers are
  # preserved under `inactive_bulk_variant:` below.
  # ====================================================================
  - version: 8
    effective_from: "2026-09-26"
    reason: "Recomposition variant activated (source doc Sep 18) — supersedes bulk nutrition/weight targets from Dec 14"
    id: bulk-2026-27
    variant: recomposition

    # Accounting-week start (amendment 2026-09-22). Scope: weekly
    # ROLLUP keying only — metrics/flags weeks, the live this-week
    # strip, the planner generation window, the weekly Wilks stat.
    # Program STRUCTURE (block boundaries, week_in_block, week_type)
    # stays Monday-anchored; accounting weeks resolve onto it via the
    # first Monday on/after the week start (anchorMondayOf). The §6
    # backtest stays pinned to monday (historical validation intact).
    week_start: saturday

    block_0_loads: "Maintenance: one top single at RPE 8 + one back-off at RPE 7 x 3-5 per lift; top singles at RPE 7 from Nov 16."

    # 5.1 Blocks — UNCHANGED from v7 (recomp keeps the block calendar,
    # emphases and dates; the per-block `weight`/`rate` values are the
    # BULK trajectory, kept verbatim for structure/history — under
    # variant: recomposition the resolvers replace the gain-rate target
    # for rated blocks with targets.gain_rate_lb_wk.blocks_2_7 and the
    # weight band with targets.bodyweight_lb).
    blocks:
      - { n: 0, dates: ["2026-09-21", "2026-12-13"], emphasis: cut,      weight: [163, 154], notes: "Maintenance week + DEXA Nov 2-8. Top singles at RPE 7 from Nov 16." }
      - { n: 1, dates: ["2026-12-14", "2027-01-03"], emphasis: reverse,  weight: [154, 155], notes: "Add ~150 kcal/day per week until the 7-day average holds two weeks; that is maintenance. Full training week at RPE 7." }
      - { n: 2, dates: ["2027-01-04", "2027-02-28"], emphasis: climbing, weight: [154, 157], rate: 0.4 }
      - { n: 3, dates: ["2027-03-01", "2027-04-25"], emphasis: lifting,  weight: [157, 160], rate: 0.4 }
      - { n: 4, dates: ["2027-04-26", "2027-06-20"], emphasis: climbing, weight: [160, 163], rate: 0.4, notes: "End with an outdoor trip or a comp." }
      - { n: 5, dates: ["2027-06-21", "2027-08-15"], emphasis: lifting,  weight: [163, 166], rate: 0.4 }
      - { n: 6, dates: ["2027-08-16", "2027-10-10"], emphasis: climbing, weight: [166, 168], rate: 0.2 }
      - { n: 7, dates: ["2027-10-11", "2027-12-05"], emphasis: lifting,  weight: [168, 170], rate: 0.2, notes: "Then hold 168-170." }
    # Recomp weight band (from Dec 14): live 152-162, hold 158-161,
    # HARD CAP 165. Block 0 (cut, starts at 163) keeps the old cap via
    # targets_block_0.hard_cap_lb — the cut slice is unchanged.
    hard_cap_lb: 165
    band_lb: [152, 162]
    hold_lb: [158, 161]

    # Blocks 2-7 are 8 weeks: weeks 1-3 normal, week 4 light, weeks 5-7
    # normal, week 8 test. Blocks 0-1 have no light/test cadence — every
    # week is normal (applies_to_blocks makes that explicit).
    week_types:
      normal: {}
      light: { week_in_block: 4 }
      test: { week_in_block: 8 }
      applies_to_blocks: [2, 3, 4, 5, 6, 7]

    # 5.2 Weekly template (blocks 1-7), per weekday — UNCHANGED.
    weekly_template:
      mon:
        morning: "Squat heavy: top set of 1-3 at RPE 8.5-9, then 4x3 at 82%; hanging leg raise; muscle-ups (3-4 sets of 1-2, 2x3-5 banded strict, front lever up-downs 2x5, ~10 min)."
        afternoon: null
      tue:
        morning: "Bench heavy: top set of 1-3, then 4x3 at 82%; press light 3x8 at 70%."
        afternoon: "Climb 1, limit/projecting (partner day, through June 2027). No squat or deadlift on this day."
      wed:
        morning: "Bike 4x4; 10 min hip and thoracic mobility. Easy day."
        afternoon: null
      thu:
        morning: "Deadlift heavy: top set of 1-3, then 3x3 at 82%; press heavy: top set, then 4x3."
        afternoon: null
      fri:
        morning: null
        afternoon: "Climb 2, board/steep-wall power. Max hangs first in climbing blocks."
      sat:
        morning: "Bench: one single at RPE 8.5, then 3x8 at 70%; weighted pull-ups 5x3, rows, face pulls; squat: one single at RPE 8.5, then 3x8 at 70%; optional deadlift 3x5 at 65% only after four clean weeks. Longest session."
        afternoon: null
      sun:
        morning: null
        afternoon: "Climb 3, volume/technique, climbing blocks only."

    # 5.2c Planned-lift alternation (weekly auto-planning, block 0).
    # a/b parity = whole ISO weeks since anchor_monday: even = a, odd = b.
    planned_alternation:
      anchor_monday: "2026-09-21"
      note: "A week = squat heavy + deadlift light; B week = deadlift heavy + squat light"

    # 5.2b Block-0 weekly template (cut phase) — UNCHANGED.
    # Replaces weekly_template for block 0 only.
    #
    # `planned` = structured lifts the app auto-plans into the strength
    # timeline each week (one row per set). Main lifts ONLY — accessories
    # stay prose. Exercise strings must match the logged names EXACTLY
    # (metrics depend on them). Rep ranges resolve to the LOW end.
    # NEVER carries rpe/notes/weight — those are logged, not planned.
    weekly_template_block_0:
      mon:
        morning: "Squat: one hard single at RPE 8 + one back-off at RPE 7 x 3-5. Squat/deadlift alternate weekly: squat heavy + deadlift light, then swap. Face pulls + external rotations."
        afternoon: null
        planned:
          a: # squat heavy: hard single + back-off triple
            - { exercise: "Barbell Squat", sets: 1, reps: 1 }
            - { exercise: "Barbell Squat", sets: 1, reps: 3 }
          b: # squat light: one triple at lower weight
            - { exercise: "Barbell Squat", sets: 1, reps: 3 }
      tue:
        morning: "Bench: one hard set at RPE 8 + back-off RPE 7 x 3-5; OHP here if not covered Saturday. No squat or deadlift today."
        afternoon: "Climb 1 — Tuesday partner session."
        planned: # OHP may land Saturday instead; planned here, user adjusts
          - { exercise: "Flat Barbell Bench Press", sets: 1, reps: 1 }
          - { exercise: "Flat Barbell Bench Press", sets: 1, reps: 3 }
          - { exercise: "Overhead Press", sets: 1, reps: 1 }
          - { exercise: "Overhead Press", sets: 1, reps: 3 }
      wed:
        morning: "Calisthenics."
        afternoon: "Flex slot for Climb 2 (default is Friday)."
      thu:
        morning: "4x4 run (usually treadmill). Deadlift sometimes lands here instead of Friday."
        afternoon: null
      fri:
        morning: "Deadlift (if not Thursday): one hard single RPE 8 + back-off RPE 7 x 3-5, alternating heavy/light with squat."
        afternoon: "Climb 2 (default)."
        planned:
          a: # deadlift light opposite the heavy squat week
            - { exercise: "Barbell Deadlift", sets: 1, reps: 3 }
          b: # deadlift heavy: hard single + back-off triple
            - { exercise: "Barbell Deadlift", sets: 1, reps: 1 }
            - { exercise: "Barbell Deadlift", sets: 1, reps: 3 }
      sat:
        morning: "OHP if not Tuesday. Weekly row (inverted ring rows / seated cable row). EZ bar curls, lateral dumbbell raises."
        afternoon: null
      sun:
        morning: null
        afternoon: null

    # 5.2d Warm-up ramp (weekly auto-planning) — UNCHANGED.
    warmup_protocol:
      rounding_lb: 5
      default:
        - { weight_lb: 45, reps: 10 }   # empty bar
        - { pct_top: 0.40, reps: 5 }
        - { pct_top: 0.60, reps: 3 }
        - { pct_top: 0.80, reps: 1 }
      deadlift:                          # plates start at 135; no bar work
        - { weight_lb: 135, reps: 5 }
        - { pct_top: 0.60, reps: 3, min_above_lb: 135 }
        - { pct_top: 0.80, reps: 1, min_above_lb: 135 }

    # 5.2e Working-weight fill (weekly auto-planning) — UNCHANGED.
    weight_fill:
      method: reference_e1rm
      reference_days: 42
      pct_by_reps: { 1: 0.96, 3: 0.88 }
      rounding_lb: 5
      never_fill: [rpe, notes]

    # ------------------------------------------------------------------
    # Working-max controller — UNCHANGED (recomp keeps the loads and the
    # heavy-day rule verbatim; spec 2026-09-21-working-max-controller).
    # ------------------------------------------------------------------

    # §1.3 RPE chart — % of working max by RPE x reps. Keys are strings
    # so both YAML parsers (Dart / TS) agree; values are percents.
    # Outside the table fall back to inverted Epley:
    #   pct = 1 / (1 + (reps + (10 - rpe)) / 30)
    rpe_chart:
      fallback: "inverted Epley: pct = 1 / (1 + (reps + (10 - rpe)) / 30)"
      pct_by_rpe_reps:
        "10":  { "1": 100,  "2": 95.5, "3": 92.2, "4": 89.2, "5": 86.3, "6": 83.7, "8": 78.6 }
        "9.5": { "1": 97.8, "2": 93.9, "3": 90.7, "4": 87.8, "5": 85.0, "6": 82.4, "8": 77.4 }
        "9":   { "1": 95.5, "2": 92.2, "3": 89.2, "4": 86.3, "5": 83.7, "6": 81.1, "8": 76.2 }
        "8.5": { "1": 93.9, "2": 90.7, "3": 87.8, "4": 85.0, "5": 82.4, "6": 79.9, "8": 75.1 }
        "8":   { "1": 92.2, "2": 89.2, "3": 86.3, "4": 83.7, "5": 81.1, "6": 78.6, "8": 73.9 }
        "7.5": { "1": 90.7, "2": 87.8, "3": 85.0, "4": 82.4, "5": 79.9, "6": 77.4, "8": 72.3 }
        "7":   { "1": 89.2, "2": 86.3, "3": 83.7, "4": 81.1, "5": 78.6, "6": 76.2, "8": 70.7 }
        "6.5": { "1": 87.8, "2": 85.0, "3": 82.4, "4": 79.9, "5": 77.4, "6": 75.1, "8": 69.4 }
        "6":   { "1": 86.3, "2": 83.7, "3": 81.1, "4": 78.6, "5": 76.2, "6": 73.9, "8": 68.0 }

    # §1.4 Variants — UNCHANGED (lift-technique variants, unrelated to
    # the program-level `variant: recomposition` key).
    variants:
      keywords: [paused, pins, touch and go, belted, unbelted, straps, double overhand]
      bench:
        default: paused
        parse: [paused, pins, touch_and_go]
        conversions:
          paused: 0
          pins: 0            # pins = paused
          touch_and_go: 3    # +3% -> divide by 1.03
      squat:
        default: belted
        parse: [paused, pins, belted, unbelted]
        conversions:
          belted: 0
          unbelted: -3
          paused: -3
          belted_paused: -3  # "belted, paused" = -3% once, never stacked
      deadlift:
        default: belted
        parse: [belted, unbelted, straps, double_overhand, paused, pins, touch_and_go]
        conversions:
          belted: 0
          unbelted: -4
          straps: 0          # straps / double-overhand: no change
          double_overhand: 0
      press:
        default: standard
        parse: []            # press is always standard; keywords = gear
        conversions:
          standard: 0

    # §1.5/§3 load policies — UNCHANGED (recomp: same training week,
    # same heavy-day rule; only food and the weight line change).
    load_policies:
      - name: cut_early
        applies: { block: 0, dates: ["2026-09-21", "2026-11-15"] }
        target_rpe: [7.5, 8]
        raise_if_rpe_lte: 7
        raise_requires_consecutive: 2
        hold_band: [7.5, 8.5]
        drop_if_rpe_gte: 9
        step_lb: { bench: 5, press: 5, squat: 5, deadlift: 5 }
        frozen: false
        cap_rpe: 8.5
        cap_after_drop_rpe: 8.5
        consecutive_drops_action: no_top_sets_next_week
        readings_that_raise: [heavy_top]
        readings_that_lower: [heavy_top, saturday_single, capped]
        reset_on: test
        saturday_single: true
      - name: cut_late
        applies: { block: 0, dates: ["2026-11-16", "2026-12-13"] }
        target_rpe: [7, 7]
        raise_if_rpe_lte: null            # no raises
        raise_requires_consecutive: 2
        hold_band: [6.5, 7.5]
        drop_if_rpe_gte: 8.5
        step_lb: { bench: 5, press: 5, squat: 5, deadlift: 5 }
        frozen: true
        cap_rpe: 7
        cap_after_drop_rpe: 7
        consecutive_drops_action: no_top_sets_next_week
        readings_that_raise: []
        readings_that_lower: [heavy_top, saturday_single, capped]
        reset_on: test
        saturday_single: false
      - name: reverse
        applies: { block: 1 }
        seed: "last cut_late RPE-7 single / 0.892"
        target_rpe: [7, 7]
        raise_if_rpe_lte: null            # no raises
        raise_requires_consecutive: 2
        hold_band: [6.5, 7.5]
        drop_if_rpe_gte: 8.5
        step_lb: { bench: 5, press: 5, squat: 5, deadlift: 5 }
        frozen: true
        cap_rpe: 7
        cap_after_drop_rpe: 7
        consecutive_drops_action: no_top_sets_next_week
        readings_that_raise: []
        readings_that_lower: [heavy_top, saturday_single, capped]
        reset_on: test
        saturday_single: false
      - name: lifting_block
        applies: { blocks: [3, 5, 7] }
        target_rpe: [8.5, 9]
        raise_if_rpe_lte: 8
        raise_requires_consecutive: 1
        hold_band: [8.5, 9]
        drop_if_rpe_gte: 9.5
        step_lb: { bench: 5, press: 5, squat: 5, deadlift: 5 }
        frozen: false
        cap_rpe: 9
        cap_after_drop_rpe: 9
        consecutive_drops_action: no_top_sets_next_week
        readings_that_raise: [heavy_top]
        readings_that_lower: [heavy_top, saturday_single, capped]
        reset_on: test
        saturday_single: true
      - name: climbing_block
        applies: { blocks: [2, 4, 6] }
        target_rpe: [7.5, 8]              # target <= 8
        raise_if_rpe_lte: null            # no raises
        raise_requires_consecutive: 2
        hold_band: [7.5, 8]
        drop_if_rpe_gte: 9
        step_lb: { bench: 5, press: 5, squat: 5, deadlift: 5 }
        frozen: true
        cap_rpe: 8
        cap_after_drop_rpe: 8
        consecutive_drops_action: no_top_sets_next_week
        readings_that_raise: []
        readings_that_lower: [heavy_top, saturday_single, capped]
        reset_on: test
        saturday_single: false
      - name: light_week
        applies: { week_type: light }
        target_rpe: [6, 6]
        raise_if_rpe_lte: null
        raise_requires_consecutive: 2
        hold_band: null
        drop_if_rpe_gte: null             # readings recorded + IGNORED
        step_lb: { bench: 5, press: 5, squat: 5, deadlift: 5 }
        frozen: true
        cap_rpe: 6
        cap_after_drop_rpe: 6
        consecutive_drops_action: no_top_sets_next_week
        readings_that_raise: []
        readings_that_lower: []
        readings_ignored: true
        reset_on: test
        saturday_single: false
        resume: "week 5 resumes at week 3's number (light-week holds never move wm)"
      - name: test_week
        applies: { week_type: test }
        target_rpe: [8, 8]
        raise_if_rpe_lte: null
        raise_requires_consecutive: 2
        hold_band: null
        drop_if_rpe_gte: null
        step_lb: { bench: 5, press: 5, squat: 5, deadlift: 5 }
        frozen: true
        cap_rpe: 8
        cap_after_drop_rpe: 8
        consecutive_drops_action: no_top_sets_next_week
        readings_that_raise: []
        readings_that_lower: []
        reset_on: test
        saturday_single: false
        note: "the RPE-8 single resets wm: weight / 0.922, round DOWN to 5"

    # 5.3 Loads — UNCHANGED.
    loads:
      top_set:
        reps: [1, 3]
        rpe: [8.5, 9]
        pct_max_by_reps: { 1: 0.96, 2: 0.90, 3: 0.88 }
        rotate_weekly: true
      back_offs:
        reps: 3
        sets: { squat: 4, bench: 4, press: 4, deadlift: 3 }
        pct_max: [0.81, 0.83]
        rpe: [6.5, 7.5]
      volume_day:
        sets_reps: "3x8"
        pct_max: 0.70
        progression: "add one rep per set weekly to 3x10, then +5 lb and back to 3x8"
      saturday_single: { lifts: [bench, squat], rpe: 8.5 }
      progression: "+5 lb to working max when top set RPE 8.5 or easier two sessions running"
      regression: "two consecutive top sets at RPE 9.5 -> next week RPE 8, no top-set attempts on that lift"
      never: "no grinders"
      light_week:
        top_set_rpe: 6
        back_offs: 0
        volume: "2x8"
        climbing: "one fewer"
        hangboard: "off"
      test_week: "one single at RPE 8 on squat, bench, deadlift, press; those four numbers are the block's result"
      climbing_block:
        top_set_rpe_cap: 8
        back_offs: "held"
        climbing: 3
        max_hangs: "5x7s on 20mm before the two hard sessions"
      lifting_block:
        climbing: 2
        climbing_intensity: "both below limit"
        hangboard: "once a week or off"

    # 5.4 Targets — RECOMP for blocks >= 1 (weight + protein; the
    # training-input targets are unchanged: the variant keeps the whole
    # training week). Weight rate 0 to +0.15 lb/wk; 0.3 lb/wk sustained
    # two weeks is the alarm (the WEIGHT_FAST rule's recomp threshold).
    targets:
      gain_rate_lb_wk: { blocks_2_7: [0.0, 0.15], alarm: 0.3, alarm_weeks: 2 }
      bodyweight_lb: { band: [152, 162], hold: [158, 161] }
      near_max_sets_wk: 6
      working_sets_wk: 28
      working_sets_wk_min_normal: 20
      bench_days_wk: 2
      press_days_wk: 2
      squat_days_wk: 2
      deadlift_days_wk: 1
      climbing_wk: { lifting_block: 2, climbing_block: 3 }
      bike_4x4_wk: 1
      muscle_up_sessions_wk: 1
      block_length_wk: 8
      # Protein 1.0-1.1 g/lb, four feedings, every day (recomp: protein
      # + heavy sets are the muscle signal — the food surplus no longer
      # is).
      protein_g_per_lb: [1.0, 1.1]
      protein_feedings_per_day: 4

    # 5.4b Block-0 (cut) target overrides — UNCHANGED semantics, plus
    # the recomp-superseded keys pinned to their cut-era (v7) values so
    # the BLOCK-0 SLICE IS IDENTICAL to v7's — the whole cut is outside
    # the variant: band/cap stay [154,172]/172, protein stays 0.8-1.0,
    # the WEIGHT_FAST alarm stays 0.6.
    targets_block_0:
      # One top single per lift (squat, bench, deadlift, press) at
      # RPE <= 8 — four near-max sets is the whole heavy quota on a cut.
      near_max_sets_wk: 4
      # No volume floor on a cut: maintenance stimulus, not bulk
      # volume. Explicit nulls (not omissions) so WORKING_LOW is
      # provably off rather than silently inheriting 28/20.
      working_sets_wk: null
      working_sets_wk_min_normal: null
      bench_days_wk: 2
      # Per the block-0 template: press lands Tue or Sat (sometimes
      # both); squat is one heavy or one light day depending on the
      # week's alternation, occasionally both.
      press_days_wk: [1, 2]
      squat_days_wk: [1, 2]
      deadlift_days_wk: 1
      # Scalar override — block 0 is neither a lifting_block nor a
      # climbing_block, so the emphasis-keyed climbing_wk map does not
      # apply.
      climbing_wk: 2
      bike_4x4_wk: 1
      # Recomp starts Dec 14 — the cut keeps its own weight/protein
      # parameters (v7 values verbatim).
      bodyweight_lb: { band: [154, 172] }
      hard_cap_lb: 172
      gain_rate_alarm_lb_wk: 0.6
      protein_g_per_lb: [0.8, 1.0]

    # 2.6 flag rule ids in force. WEIGHT_FLAT is RETIRED under recomp
    # (2026-09-26): a flat scale is the PLAN — "a scale that barely
    # moves"; the bulk's flat-three-weeks-add-100 rule would fight the
    # variant. The stall response lives in `stall_rule:` below (DEXA
    # lean-mass basis, not the scale). Flag evaluators additionally
    # treat WEIGHT_FLAT as off whenever variant == recomposition.
    rules:
      - WEIGHT_FAST
      - WEIGHT_CAP
      - WEIGHT_DRIFT
      - PHASE_MISMATCH
      - NEAR_MAX_LOW
      - WORKING_LOW
      - LONG_SETS
      - BENCH_ONCE
      - TUESDAY_LOWER
      - CLIMB_OVER
      - BIKE_DROP
      - TOP_SET_HEAVY
      - PAIN_NOTE
      - TWO_SIGNALS
      - BLOCK_END

    # 5.5 Nutrition — RECOMP (source doc): food at maintenance; the
    # muscle-building energy comes out of the fat store.
    nutrition:
      intake: "maintenance, 0 to +50 kcal/day"
      maintenance_definition: "found in the reverse diet: 3 weeks flat within +/-0.5 lb; re-found whenever the scale moves 1.5 lb in 3 weeks"
      adjust: "every third Sunday: up more than 1 lb in 3 weeks -> -100; down more than 0.5 lb -> +100 (a deficit slows the building); never a bigger step"
      protein: "1.0-1.1 g/lb, four feedings, every day"
      carbs: "onto the lifting days and the limit-climbing day; easy days lower; the week nets to maintenance"
      maintenance_week: "week 4 of every block at maintenance (identical to the rest of the week under recomp)"

    # Gauges (recomp): fat and muscle are read directly, not off the
    # scale.
    gauges:
      fat: "waist at the navel, weekly 7-day average; DEXA every 16 weeks (Nov 2026, late Apr 2027, mid Aug 2027, early Dec 2027)"
      muscle: "DEXA lean mass every 16 weeks; test-week singles every 8"
      # waist gauge: NOT TRACKED YET — no view/data source exists for a
      # waist measurement (open item; surfaced as a placeholder until a
      # source lands).
      waist_status: "not tracked yet"
    stall_rule: "two DEXA scans with lean mass flat and every input delivered -> +100 kcal for one block, then re-check; NOT a return to 0.4 lb/wk"

    # The superseded bulk numbers, kept for reference (and for the
    # simulator's 'Bulk plan (inactive)' preset). NOT read by the
    # resolvers.
    inactive_bulk_variant:
      hard_cap_lb: 172
      band_lb: [154, 172]
      hold_lb: [168, 170]
      targets:
        gain_rate_lb_wk: { blocks_2_5: [0.2, 0.5], blocks_6_7: [0.1, 0.3], alarm: 0.6 }
        bodyweight_lb: { band: [154, 172], hold: [168, 170] }
        protein_g_per_lb: [0.8, 1.0]
      rules_retired_or_changed:
        WEIGHT_FLAT: "add 100 kcal after 3 flat weeks — retired under recomp (flat is the plan)"
        WEIGHT_FAST: "alarm was 0.6 lb/wk two weeks — recomp alarm is 0.3"
        WEIGHT_CAP: "cap was 172 — recomp cap is 165"
      nutrition:
        surplus_kcal: { rate_0_4: 200, rate_0_2: 100 }
        adjust: "every third Sunday, 7-day average vs block target line: >1 lb over -> -100; >1 lb under -> +100; never a bigger step"
        maintenance_week: "week 4 of every block at maintenance"
        carbs: "extra on the four lifting days and the limit-climbing day"
        maintenance_definition: "the intake at which the 7-day average holds for two weeks; recorded at end of block 1"

  # ====================================================================
  # v9 — POST-CUT RECOMP REFINEMENT (source: coach/post-cut-recomp-spec.md,
  # user-authored 2026-09-27). Refines v8's recomposition variant; where
  # the two conflict THE SPEC WINS. What changed:
  #   • 154 is NOT the long-term weight target — glycogen-replete
  #     maintenance sits several lb higher; maintenance = the intake
  #     where the 7-day avg is ~stable for 2-3 weeks (maintenance:).
  #   • Nutrition goes ABSOLUTE: protein 160-175 g/day, fat floor
  #     55-65 g/day, carbs 225-300 g/day biased to training days
  #     (targets.protein_g_day / fat_g_day_min / carbs_g_day).
  #   • Hypertrophy is FIRST-CLASS: 8-12 productive sets per major
  #     muscle group per week (~10 default), overlap-counted from
  #     compounds + climbing + calisthenics (hypertrophy_targets: +
  #     exercise_muscle_map:).
  #   • Each main lift gets BOTH a heavy exposure (1-3 reps @ RPE 7-8)
  #     and a hypertrophy exposure (3-8 reps @ RPE 7-9) every week —
  #     post-cut load_policies retarget heavy to RPE 7-8.
  #   • NEW post-cut weekly_template (Mon squat / Tue bench+climb /
  #     Wed calisthenics / Thu 4x4 / Fri deadlift+climb / Sat press+
  #     bench2 / Sun rest), with `planned` volume work. Block-0 cut
  #     template UNCHANGED.
  #   • Weight rules RELAX: a flat scale is SUCCESS when strength/lean
  #     mass rise (never triggers +100 — reverses v8's down-0.5-adds-100
  #     step); weight may rise if waist/BF stable and performance up;
  #     the hard band is DE-EMPHASIZED to a soft advisory band + the
  #     conditioned weight_rules: below. hard_cap_lb 165 is KEPT as an
  #     advisory tripwire only (judgment call: it makes WEIGHT_CAP a
  #     review prompt, not an automatic hold — see weight_rules).
  #   • Gauges: weekly navel waist (still NOT tracked), DEXA every 3-4
  #     months; climbing 2x differentiated (technique/volume vs limit,
  #     track new V5+ sends/onsights); calisthenics = skill list.
  # Block 0 (the cut, through Dec 13) is entirely OUTSIDE this
  # refinement: targets_block_0 + weekly_template_block_0 pin the v7/v8
  # cut slice verbatim.
  # ====================================================================
  - version: 9
    effective_from: "2026-09-27"
    reason: "Post-cut recomp spec integrated (coach/post-cut-recomp-spec.md, 2026-09-27) — new post-cut week, absolute nutrition, first-class hypertrophy, soft weight band"
    id: bulk-2026-27
    variant: recomposition

    # Accounting-week start (amendment 2026-09-22) — unchanged.
    week_start: saturday

    block_0_loads: "Maintenance: one top single at RPE 8 + one back-off at RPE 7 x 3-5 per lift; top singles at RPE 7 from Nov 16."

    # 5.1 Blocks — UNCHANGED (calendar/emphasis structure kept; the
    # per-block weight/rate values remain the superseded BULK trajectory,
    # for structure/history only — resolvers replace them under the
    # variant exactly as in v8).
    blocks:
      - { n: 0, dates: ["2026-09-21", "2026-12-13"], emphasis: cut,      weight: [163, 154], notes: "Maintenance week + DEXA Nov 2-8. Top singles at RPE 7 from Nov 16." }
      - { n: 1, dates: ["2026-12-14", "2027-01-03"], emphasis: reverse,  weight: [154, 155], notes: "Establish maintenance: expect weight to RISE from glycogen/water/food mass — do NOT treat 154 as the target. Find the intake where the 7-day avg is ~stable 2-3 weeks. New training week at RPE 7." }
      - { n: 2, dates: ["2027-01-04", "2027-02-28"], emphasis: climbing, weight: [154, 157], rate: 0.4 }
      - { n: 3, dates: ["2027-03-01", "2027-04-25"], emphasis: lifting,  weight: [157, 160], rate: 0.4 }
      - { n: 4, dates: ["2027-04-26", "2027-06-20"], emphasis: climbing, weight: [160, 163], rate: 0.4, notes: "End with an outdoor trip or a comp." }
      - { n: 5, dates: ["2027-06-21", "2027-08-15"], emphasis: lifting,  weight: [163, 166], rate: 0.4 }
      - { n: 6, dates: ["2027-08-16", "2027-10-10"], emphasis: climbing, weight: [166, 168], rate: 0.2 }
      - { n: 7, dates: ["2027-10-11", "2027-12-05"], emphasis: lifting,  weight: [168, 170], rate: 0.2, notes: "Then hold 168-170." }
    # ADVISORY tripwire only (spec: hard band de-emphasized; scale
    # weight is secondary). 165 kept so WEIGHT_CAP still exists as a
    # review prompt; the response is the conditioned weight_rules:
    # below, never an automatic cut. Block 0 keeps 172 via
    # targets_block_0.
    hard_cap_lb: 165

    # Blocks 2-7 are 8 weeks: weeks 1-3 normal, week 4 light, weeks 5-7
    # normal, week 8 test — UNCHANGED.
    week_types:
      normal: {}
      light: { week_in_block: 4 }
      test: { week_in_block: 8 }
      applies_to_blocks: [2, 3, 4, 5, 6, 7]

    # 5.2 POST-CUT weekly template (blocks 1-7) — REWRITTEN per the
    # spec's Approximate Weekly Structure. Every main lift gets a heavy
    # exposure (top set 1-3 @ RPE 7-8) AND a hypertrophy exposure
    # (3-8 reps @ RPE 7-9) each week; substantially more productive
    # volume than the cut's heavy-set+backoff. NO heavy lower on
    # Tuesday (climbing conflict). Climb-day assignment (Tue = limit,
    # Fri = technique/volume) is a default — the spec only requires the
    # two sessions be differentiated; swap freely.
    #
    # `planned` = structured lifts the app auto-plans (one row per
    # set). Main lifts ONLY — accessories stay prose. Exercise strings
    # must match the logged names EXACTLY. NEVER carries rpe/notes/
    # weight — those are logged, not planned.
    weekly_template:
      mon:
        morning: "Squat heavy: top set of 1-3 at RPE 7-8, then squat hypertrophy 3x5 at RPE 7-9; lower-body hypertrophy accessories (RDL or leg press, 2-3 sets); hanging leg raise; muscle-up skill (~10 min, low fatigue, long rests)."
        afternoon: null
        planned:
          - { exercise: "Barbell Squat", sets: 1, reps: 1 }
          - { exercise: "Barbell Squat", sets: 3, reps: 5 }
      tue:
        morning: "Bench heavy: top set of 1-3 at RPE 7-8, then bench hypertrophy 3x5 at RPE 7-9; upper hypertrophy as appropriate (keep extra pulling minimal — climbing covers it). No squat or deadlift today, ever."
        afternoon: "Climb 1 — limit session (hard V5-V7+ projects, long rests, low junk volume; partner day). Track limit-project progress."
        planned:
          - { exercise: "Flat Barbell Bench Press", sets: 1, reps: 1 }
          - { exercise: "Flat Barbell Bench Press", sets: 3, reps: 5 }
      wed:
        morning: "Calisthenics skill: handstand/HSPU, front lever, pistol squat, hanging leg raise/core — low-fatigue high-quality practice, long rests, stop when quality deteriorates. Recovery/easy day."
        afternoon: null
      thu:
        morning: "Norwegian 4x4 VO2 (bike or treadmill). No additional high-fatigue training today."
        afternoon: null
      fri:
        morning: "Deadlift heavy: top set of 1-3 at RPE 7-8, then lower-body volume (deadlift 2x5 at RPE 7-8; optional RDL/front-squat accessories)."
        afternoon: "Climb 2 — technique/volume session (easier/moderate, movement variety, onsights, deliberate technique). Track new V5+ sends/onsights."
        planned:
          - { exercise: "Barbell Deadlift", sets: 1, reps: 1 }
          - { exercise: "Barbell Deadlift", sets: 2, reps: 5 }
      sat:
        morning: "OHP heavy: top set of 1-3 at RPE 7-8, then press hypertrophy 3x5 at RPE 7-9; second bench exposure 3x5 at RPE 7-8; upper hypertrophy accessories (weighted pull-ups 3x5, curls, lateral raises — mind total weekly pulling volume vs the 8-12 band)."
        afternoon: null
        planned:
          - { exercise: "Overhead Press", sets: 1, reps: 1 }
          - { exercise: "Overhead Press", sets: 3, reps: 5 }
          - { exercise: "Flat Barbell Bench Press", sets: 3, reps: 5 }
      sun:
        morning: null
        afternoon: null

    # 5.2c Planned-lift alternation — block-0 only, UNCHANGED (the
    # post-cut template does not alternate; every day's planned list is
    # flat).
    planned_alternation:
      anchor_monday: "2026-09-21"
      note: "A week = squat heavy + deadlift light; B week = deadlift heavy + squat light"

    # 5.2b Block-0 weekly template (cut phase) — UNCHANGED.
    weekly_template_block_0:
      mon:
        morning: "Squat: one hard single at RPE 8 + one back-off at RPE 7 x 3-5. Squat/deadlift alternate weekly: squat heavy + deadlift light, then swap. Face pulls + external rotations."
        afternoon: null
        planned:
          a: # squat heavy: hard single + back-off triple
            - { exercise: "Barbell Squat", sets: 1, reps: 1 }
            - { exercise: "Barbell Squat", sets: 1, reps: 3 }
          b: # squat light: one triple at lower weight
            - { exercise: "Barbell Squat", sets: 1, reps: 3 }
      tue:
        morning: "Bench: one hard set at RPE 8 + back-off RPE 7 x 3-5; OHP here if not covered Saturday. No squat or deadlift today."
        afternoon: "Climb 1 — Tuesday partner session."
        planned: # OHP may land Saturday instead; planned here, user adjusts
          - { exercise: "Flat Barbell Bench Press", sets: 1, reps: 1 }
          - { exercise: "Flat Barbell Bench Press", sets: 1, reps: 3 }
          - { exercise: "Overhead Press", sets: 1, reps: 1 }
          - { exercise: "Overhead Press", sets: 1, reps: 3 }
      wed:
        morning: "Calisthenics."
        afternoon: "Flex slot for Climb 2 (default is Friday)."
      thu:
        morning: "4x4 run (usually treadmill). Deadlift sometimes lands here instead of Friday."
        afternoon: null
      fri:
        morning: "Deadlift (if not Thursday): one hard single RPE 8 + back-off RPE 7 x 3-5, alternating heavy/light with squat."
        afternoon: "Climb 2 (default)."
        planned:
          a: # deadlift light opposite the heavy squat week
            - { exercise: "Barbell Deadlift", sets: 1, reps: 3 }
          b: # deadlift heavy: hard single + back-off triple
            - { exercise: "Barbell Deadlift", sets: 1, reps: 1 }
            - { exercise: "Barbell Deadlift", sets: 1, reps: 3 }
      sat:
        morning: "OHP if not Tuesday. Weekly row (inverted ring rows / seated cable row). EZ bar curls, lateral dumbbell raises."
        afternoon: null
      sun:
        morning: null
        afternoon: null

    # 5.2d Warm-up ramp — UNCHANGED.
    warmup_protocol:
      rounding_lb: 5
      default:
        - { weight_lb: 45, reps: 10 }   # empty bar
        - { pct_top: 0.40, reps: 5 }
        - { pct_top: 0.60, reps: 3 }
        - { pct_top: 0.80, reps: 1 }
      deadlift:                          # plates start at 135; no bar work
        - { weight_lb: 135, reps: 5 }
        - { pct_top: 0.60, reps: 3, min_above_lb: 135 }
        - { pct_top: 0.80, reps: 1, min_above_lb: 135 }

    # 5.2e Working-weight fill — UNCHANGED except pct_by_reps gains the
    # 5-rep entry for the post-cut hypertrophy sets (reference-e1rm
    # fallback path; the working-max path prices 5s off rpe_chart).
    weight_fill:
      method: reference_e1rm
      reference_days: 42
      pct_by_reps: { 1: 0.96, 3: 0.88, 5: 0.80 }
      rounding_lb: 5
      never_fill: [rpe, notes]

    # ------------------------------------------------------------------
    # Working-max controller. rpe_chart / variants UNCHANGED; POST-CUT
    # load policies (lifting_block / climbing_block) retarget heavy to
    # RPE 7-8 per the spec ("strength exposure: heavy 1-3 reps,
    # generally RPE 7-8"). Cut / reverse / light / test policies
    # UNCHANGED.
    # ------------------------------------------------------------------

    # §1.3 RPE chart — UNCHANGED.
    rpe_chart:
      fallback: "inverted Epley: pct = 1 / (1 + (reps + (10 - rpe)) / 30)"
      pct_by_rpe_reps:
        "10":  { "1": 100,  "2": 95.5, "3": 92.2, "4": 89.2, "5": 86.3, "6": 83.7, "8": 78.6 }
        "9.5": { "1": 97.8, "2": 93.9, "3": 90.7, "4": 87.8, "5": 85.0, "6": 82.4, "8": 77.4 }
        "9":   { "1": 95.5, "2": 92.2, "3": 89.2, "4": 86.3, "5": 83.7, "6": 81.1, "8": 76.2 }
        "8.5": { "1": 93.9, "2": 90.7, "3": 87.8, "4": 85.0, "5": 82.4, "6": 79.9, "8": 75.1 }
        "8":   { "1": 92.2, "2": 89.2, "3": 86.3, "4": 83.7, "5": 81.1, "6": 78.6, "8": 73.9 }
        "7.5": { "1": 90.7, "2": 87.8, "3": 85.0, "4": 82.4, "5": 79.9, "6": 77.4, "8": 72.3 }
        "7":   { "1": 89.2, "2": 86.3, "3": 83.7, "4": 81.1, "5": 78.6, "6": 76.2, "8": 70.7 }
        "6.5": { "1": 87.8, "2": 85.0, "3": 82.4, "4": 79.9, "5": 77.4, "6": 75.1, "8": 69.4 }
        "6":   { "1": 86.3, "2": 83.7, "3": 81.1, "4": 78.6, "5": 76.2, "6": 73.9, "8": 68.0 }

    # §1.4 Variants — UNCHANGED.
    variants:
      keywords: [paused, pins, touch and go, belted, unbelted, straps, double overhand]
      bench:
        default: paused
        parse: [paused, pins, touch_and_go]
        conversions:
          paused: 0
          pins: 0            # pins = paused
          touch_and_go: 3    # +3% -> divide by 1.03
      squat:
        default: belted
        parse: [paused, pins, belted, unbelted]
        conversions:
          belted: 0
          unbelted: -3
          paused: -3
          belted_paused: -3  # "belted, paused" = -3% once, never stacked
      deadlift:
        default: belted
        parse: [belted, unbelted, straps, double_overhand, paused, pins, touch_and_go]
        conversions:
          belted: 0
          unbelted: -4
          straps: 0          # straps / double-overhand: no change
          double_overhand: 0
      press:
        default: standard
        parse: []            # press is always standard; keywords = gear
        conversions:
          standard: 0

    # §1.5/§3 load policies. Post-cut heavy = RPE 7-8 (spec): the
    # lifting_block top-set target drops from 8.5-9 to 7.5-8 (raise
    # when a top set comes in at RPE <= 7); climbing_block UNFREEZES —
    # progressive overload is first-class year-round — but raises need
    # two consecutive easy readings and tops stay capped at 8. The
    # saturday_single reading kind is retired with the old Saturday
    # bench/squat singles (the new Saturday heavy slot is OHP's own
    # heavy_top; second bench exposure is hypertrophy work).
    load_policies:
      - name: cut_early
        applies: { block: 0, dates: ["2026-09-21", "2026-11-15"] }
        target_rpe: [7.5, 8]
        raise_if_rpe_lte: 7
        raise_requires_consecutive: 2
        hold_band: [7.5, 8.5]
        drop_if_rpe_gte: 9
        step_lb: { bench: 5, press: 5, squat: 5, deadlift: 5 }
        frozen: false
        cap_rpe: 8.5
        cap_after_drop_rpe: 8.5
        consecutive_drops_action: no_top_sets_next_week
        readings_that_raise: [heavy_top]
        readings_that_lower: [heavy_top, saturday_single, capped]
        reset_on: test
        saturday_single: true
      - name: cut_late
        applies: { block: 0, dates: ["2026-11-16", "2026-12-13"] }
        target_rpe: [7, 7]
        raise_if_rpe_lte: null            # no raises
        raise_requires_consecutive: 2
        hold_band: [6.5, 7.5]
        drop_if_rpe_gte: 8.5
        step_lb: { bench: 5, press: 5, squat: 5, deadlift: 5 }
        frozen: true
        cap_rpe: 7
        cap_after_drop_rpe: 7
        consecutive_drops_action: no_top_sets_next_week
        readings_that_raise: []
        readings_that_lower: [heavy_top, saturday_single, capped]
        reset_on: test
        saturday_single: false
      - name: reverse
        applies: { block: 1 }
        seed: "last cut_late RPE-7 single / 0.892"
        target_rpe: [7, 7]
        raise_if_rpe_lte: null            # no raises
        raise_requires_consecutive: 2
        hold_band: [6.5, 7.5]
        drop_if_rpe_gte: 8.5
        step_lb: { bench: 5, press: 5, squat: 5, deadlift: 5 }
        frozen: true
        cap_rpe: 7
        cap_after_drop_rpe: 7
        consecutive_drops_action: no_top_sets_next_week
        readings_that_raise: []
        readings_that_lower: [heavy_top, saturday_single, capped]
        reset_on: test
        saturday_single: false
      - name: lifting_block
        applies: { blocks: [3, 5, 7] }
        # Post-cut heavy: top sets live at RPE 7.5-8 (spec: "heavy 1-3
        # reps, generally RPE 7-8"); a top set at RPE <= 7 raises the
        # working max next session (single-session raise kept from v8).
        target_rpe: [7.5, 8]
        raise_if_rpe_lte: 7
        raise_requires_consecutive: 1
        hold_band: [7, 8.5]
        drop_if_rpe_gte: 9
        step_lb: { bench: 5, press: 5, squat: 5, deadlift: 5 }
        frozen: false
        cap_rpe: 8.5
        cap_after_drop_rpe: 8
        consecutive_drops_action: no_top_sets_next_week
        readings_that_raise: [heavy_top]
        readings_that_lower: [heavy_top, capped]
        reset_on: test
        saturday_single: false
      - name: climbing_block
        applies: { blocks: [2, 4, 6] }
        # Same RPE 7-8 heavy band, tops capped at 8; raises allowed but
        # need TWO consecutive RPE <= 7 readings (climbing keeps
        # priority; the bar number still creeps).
        target_rpe: [7.5, 8]
        raise_if_rpe_lte: 7
        raise_requires_consecutive: 2
        hold_band: [7, 8]
        drop_if_rpe_gte: 9
        step_lb: { bench: 5, press: 5, squat: 5, deadlift: 5 }
        frozen: false
        cap_rpe: 8
        cap_after_drop_rpe: 8
        consecutive_drops_action: no_top_sets_next_week
        readings_that_raise: [heavy_top]
        readings_that_lower: [heavy_top, capped]
        reset_on: test
        saturday_single: false
      - name: light_week
        applies: { week_type: light }
        target_rpe: [6, 6]
        raise_if_rpe_lte: null
        raise_requires_consecutive: 2
        hold_band: null
        drop_if_rpe_gte: null             # readings recorded + IGNORED
        step_lb: { bench: 5, press: 5, squat: 5, deadlift: 5 }
        frozen: true
        cap_rpe: 6
        cap_after_drop_rpe: 6
        consecutive_drops_action: no_top_sets_next_week
        readings_that_raise: []
        readings_that_lower: []
        readings_ignored: true
        reset_on: test
        saturday_single: false
        resume: "week 5 resumes at week 3's number (light-week holds never move wm)"
      - name: test_week
        applies: { week_type: test }
        target_rpe: [8, 8]
        raise_if_rpe_lte: null
        raise_requires_consecutive: 2
        hold_band: null
        drop_if_rpe_gte: null
        step_lb: { bench: 5, press: 5, squat: 5, deadlift: 5 }
        frozen: true
        cap_rpe: 8
        cap_after_drop_rpe: 8
        consecutive_drops_action: no_top_sets_next_week
        readings_that_raise: []
        readings_that_lower: []
        reset_on: test
        saturday_single: false
        note: "the RPE-8 single resets wm: weight / 0.922, round DOWN to 5"

    # 5.3 Loads — post-cut dual exposure (spec). The heavy top set and
    # the hypertrophy work are BOTH tracked for progressive overload.
    loads:
      top_set:
        reps: [1, 3]
        rpe: [7, 8]
        # % of working max at RPE 8 by reps (rpe_chart row).
        pct_max_by_reps: { 1: 0.92, 2: 0.89, 3: 0.86 }
        rotate_weekly: true
      hypertrophy:
        reps: [3, 8]
        rpe: [7, 9]
        rir: [1, 3]         # most hypertrophy sets ~1-3 RIR
        compounds_stop_rir: [2, 3]
        safe_isolations_occasional_rir: [0, 1]
        default_sets_reps: "3x5"
        progression: "add a rep per set weekly inside the 3-8 range, then +5 lb and back down"
      progression: "working max moves on the heavy-day top set only (load_policies); hypertrophy progresses by reps-then-weight"
      never: "no grinders"
      light_week:
        top_set_rpe: 6
        volume: "2x5"
        climbing: "one fewer"
        hangboard: "off"
      test_week: "one single at RPE 8 on squat, bench, deadlift, press; those four numbers are the block's result"
      climbing_block:
        top_set_rpe_cap: 8
        climbing: 3
        max_hangs: "5x7s on 20mm before the two hard sessions"
      lifting_block:
        climbing: 2
        climbing_intensity: "both below limit"
        hangboard: "once a week or off"

    # NEW (spec, first-class): weekly hypertrophy dose per major muscle
    # group, overlap-counted via exercise_muscle_map below. Increase
    # volume only when progress stalls and recovery is good; watch the
    # pulling total in particular (climbing + MU + pull-ups + rows +
    # curls all land on back/biceps).
    hypertrophy_targets:
      sets_per_muscle_wk: [8, 12]
      default_sets_per_muscle_wk: 10
      # The groups the 8-12 band is evaluated against (the map may
      # credit others — core/forearms — without a band).
      muscle_groups: [quads, hamstrings_glutes, chest, back, shoulders, biceps, triceps]
      counting: "one logged strength row = one set x its map credits; one climbing session = the climbing_session credits; calisthenics rows count via their map entries"
      caution: "avoid excessive pulling volume — climbing, muscle-ups, pull-ups, rows and curls overlap on back/biceps"

    # NEW (spec): declared overlap accounting — per-SET fractional
    # credits per muscle group, keyed by the EXACT logged exercise name
    # (prefix-matched, so 'Muscle Up Purple Band' counts under 'Muscle
    # Up'). Climbing credits are PER SESSION. ALL CREDITS ARE
    # EDITABLE — best-judgment defaults (2026-09-27); correct freely,
    # the counters re-read this map on the next sync.
    exercise_muscle_map:
      exercises:
        "Barbell Squat":                { quads: 1.0, hamstrings_glutes: 0.5, core: 0.25 }
        "Pistol Squat":                 { quads: 1.0, hamstrings_glutes: 0.25 }
        "Leg Press":                    { quads: 1.0, hamstrings_glutes: 0.25 }
        "Bulgarian Split Squat":        { quads: 1.0, hamstrings_glutes: 0.5 }
        "Barbell Deadlift":             { hamstrings_glutes: 1.0, back: 0.5, forearms: 0.25 }
        "Romanian Deadlift":            { hamstrings_glutes: 1.0, back: 0.25 }
        "Flat Barbell Bench Press":     { chest: 1.0, triceps: 0.5, shoulders: 0.25 }
        "Bench Press":                  { chest: 1.0, triceps: 0.5, shoulders: 0.25 }
        "Overhead Press":               { shoulders: 1.0, triceps: 0.5 }
        "Barbell Standing Military Press": { shoulders: 1.0, triceps: 0.5 }
        "Weighted Pull Up":             { back: 1.0, biceps: 0.5, forearms: 0.25 }
        "Pull Up":                      { back: 1.0, biceps: 0.5, forearms: 0.25 }
        "Chin Up":                      { back: 1.0, biceps: 0.75 }
        "Lat Pulldown":                 { back: 1.0, biceps: 0.5 }
        "Barbell Row":                  { back: 1.0, biceps: 0.5 }
        "Seated Cable Row":             { back: 1.0, biceps: 0.5 }
        "Inverted Row":                 { back: 1.0, biceps: 0.5 }
        "Cable Face Pull":              { shoulders: 0.5, back: 0.25 }
        "Lateral Dumbbell Raise":       { shoulders: 1.0 }
        "EZ Bar Curl":                  { biceps: 1.0 }
        "Parallel Bar Triceps Dip":     { triceps: 1.0, chest: 0.5 }
        "Muscle Up":                    { back: 0.75, biceps: 0.5, triceps: 0.5, chest: 0.25 }
        "Transition Negatives":         { back: 0.5, triceps: 0.5 }
        "Handstand Push Up":            { shoulders: 1.0, triceps: 0.5 }
        "Handstand Hold":               { shoulders: 0.25 }
        "Front Lever":                  { back: 0.75, core: 0.75 }
        "Hanging Leg Raise":            { core: 1.0, forearms: 0.25 }
        "Farmer Carry":                 { forearms: 0.5, core: 0.25 }
      # One climbing session's hypertrophy-equivalent pulling stimulus
      # (spec: count the overlap rather than blindly adding sets).
      # Deliberately generous on back/forearms so extra rowing doesn't
      # look needed on 2-climb weeks.
      climbing_session: { back: 3.0, forearms: 3.0, biceps: 1.5, core: 1.0 }

    # 5.4 Targets — post-cut per the spec. Structural/frequency targets
    # follow the NEW template (4 heavy exposures; 18 planned main-lift
    # working sets; squat/press once, bench twice, deadlift once);
    # nutrition targets go ABSOLUTE; the weight band goes SOFT.
    targets:
      # Soft weight-rate guidance for rated blocks (2-7): flat-to-
      # modest-rise. Flat is SUCCESS; the alarm is advisory (see
      # weight_rules) — 0.5 lb/wk sustained two weeks means re-check
      # intake vs maintenance, conditioned on waist/performance.
      gain_rate_lb_wk: { blocks_2_7: [-0.1, 0.25], alarm: 0.5, alarm_weeks: 2 }
      # SOFT ADVISORY band (spec: hard band de-emphasized; do NOT treat
      # 154 as the long-term target — glycogen-replete maintenance sits
      # several lb higher). The band brackets "maintenance + allowed
      # performance-driven drift"; crossing it prompts the conditioned
      # weight_rules review, nothing automatic.
      bodyweight_lb: { soft_band: [154, 165], advisory: true }
      near_max_sets_wk: 4        # one heavy top set (1-3 @ RPE 7-8) per lift
      working_sets_wk: 18        # planned main-lift working sets in the template
      working_sets_wk_min_normal: 14
      bench_days_wk: 2           # Tue heavy + Sat hypertrophy exposure
      press_days_wk: 1           # Sat (heavy + hypertrophy same day)
      squat_days_wk: 1           # Mon (heavy + hypertrophy same day)
      deadlift_days_wk: 1        # Fri
      climbing_wk: { lifting_block: 2, climbing_block: 3 }
      bike_4x4_wk: 1
      muscle_up_sessions_wk: 1
      block_length_wk: 8
      # Hypertrophy dose band (see hypertrophy_targets).
      hypertrophy_sets_per_muscle_wk: [8, 12]
      # ABSOLUTE nutrition targets (spec, ~155-160 lb starting targets).
      # protein_g_per_lb is explicitly retired post-cut (block 0 keeps
      # it via targets_block_0).
      protein_g_day: [160, 175]
      fat_g_day_min: [55, 65]
      carbs_g_day: [225, 300]
      protein_g_per_lb: null

    # 5.4b Block-0 (cut) target overrides — UNCHANGED semantics; the
    # whole cut stays on its v7/v8 numbers, and the NEW absolute/
    # hypertrophy keys are explicitly OFF for block 0 (nulls) so the
    # cut slice is provably identical to v8's.
    targets_block_0:
      near_max_sets_wk: 4
      working_sets_wk: null
      working_sets_wk_min_normal: null
      bench_days_wk: 2
      press_days_wk: [1, 2]
      squat_days_wk: [1, 2]
      deadlift_days_wk: 1
      climbing_wk: 2
      bike_4x4_wk: 1
      bodyweight_lb: { band: [154, 172] }
      hard_cap_lb: 172
      gain_rate_alarm_lb_wk: 0.6
      protein_g_per_lb: [0.8, 1.0]
      protein_g_day: null
      fat_g_day_min: null
      carbs_g_day: null
      hypertrophy_sets_per_muscle_wk: null

    # NEW (spec §Body-Fat / Calorie Control): the conditioned weight
    # rules — REVERSES v8's scale-driven +100 steps. Flag evaluators /
    # the coach read these as JUDGMENT rules, not thresholds.
    weight_rules:
      flat_scale: "SUCCESS when strength/lean mass are rising — a flat scale NEVER triggers +100 kcal (reverses the v8 down-0.5-adds-100 adjust step)"
      allow_rise: "let body weight increase when waist/BF are stable and performance/lean mass are improving"
      cut_trigger: "weight AND waist consistently rising WITHOUT performance/lean-mass improvement -> reduce calories modestly"
      stall_trigger: "lean mass and strength stall despite high adherence, recovery and appropriate volume -> consider ~+100 kcal/day; NOT a return to bulking"

    # 2.6 flag rule ids — UNCHANGED list from v8 (WEIGHT_FLAT stays
    # retired; WEIGHT_CAP/WEIGHT_FAST become ADVISORY under
    # weight_rules — they surface for review, the response is
    # conditioned on waist + performance, never automatic).
    rules:
      - WEIGHT_FAST
      - WEIGHT_CAP
      - WEIGHT_DRIFT
      - PHASE_MISMATCH
      - NEAR_MAX_LOW
      - WORKING_LOW
      - LONG_SETS
      - BENCH_ONCE
      - TUESDAY_LOWER
      - CLIMB_OVER
      - BIKE_DROP
      - TOP_SET_HEAVY
      - PAIN_NOTE
      - TWO_SIGNALS
      - BLOCK_END

    # 5.5 Nutrition — ABSOLUTE targets at maintenance (spec). Eat ~at
    # maintenance, not a bulk: enough protein + carbs + energy to
    # maximize training quality and muscle growth while stored fat
    # supplies part of the energetic cost of lean tissue.
    nutrition:
      intake: "~maintenance (spec: 'eat ~at maintenance, not a bulk')"
      protein: "160-175 g/day, every day"
      fat: "minimum ~55-65 g/day"
      carbs: "~225-300 g/day = remaining calories; bias toward lifting/climbing/VO2 days; ~50-75 g in the 1-3 h before demanding training is reasonable, no rigid timing"
      adjust: "conditioned, not scale-automatic — see weight_rules (flat scale + strength up = success; weight+waist up w/o performance = modest cut; true stall w/ adherence = +100)"
      maintenance_week: "week 4 of every block at maintenance (identical to the rest of the week under recomp)"

    # NEW (spec Phase 1): maintenance semantics — supersedes v8's
    # reverse-diet 150 kcal/step definition.
    maintenance:
      established: "the calorie level where the 7-day average is ~stable for 2-3 weeks (~3 weeks after the BF target)"
      note: "expect weight to RISE off the cut from glycogen/water/food mass — 154 is NOT the long-term weight target; glycogen-replete maintenance likely sits several lb above it"
      refind: "re-establish whenever the 7-day average trends steadily for 3+ weeks"

    # Gauges (spec): fat and muscle read directly, not off the scale.
    gauges:
      fat: "waist at the navel, weekly 7-day average; DEXA every 3-4 months"
      muscle: "DEXA lean mass every 3-4 months; strength progression; hypertrophy performance; test-week singles every 8 weeks"
      climbing: "new V5+ sends/onsights (technique/volume days) + limit-project progress (limit days)"
      # waist gauge: NOT TRACKED YET — no view/data source exists for a
      # waist measurement (open item; surfaced as a placeholder until a
      # source lands).
      waist_status: "not tracked yet"
    stall_rule: "lean mass + strength stalled across two DEXA scans with every input delivered -> +100 kcal/day for one block, then re-check; NOT a return to bulking"

    # NEW (spec): climbing differentiation + calisthenics skill list.
    climbing:
      sessions_per_wk: 2
      types:
        limit: "hard V5-V7+ projects, long rests, low junk volume (default Tue, partner day)"
        technique_volume: "easier/moderate, movement variety, onsights, deliberate technique (default Fri)"
      tracking: "new V5+ sends/onsights + limit-project progress"
      future: "blocks may temporarily run 3x/week with reduced lifting volume"
    calisthenics:
      mode: "skill training, not high-fatigue hypertrophy — low-fatigue high-quality practice, long rests, stop when quality deteriorates"
      skills: [muscle-up, handstand/HSPU, front lever, pistol squat, hanging leg raise/core]

    # The superseded bulk numbers, kept for reference (the simulator's
    # 'Bulk plan (inactive)' preset). NOT read by the resolvers.
    inactive_bulk_variant:
      hard_cap_lb: 172
      band_lb: [154, 172]
      hold_lb: [168, 170]
      targets:
        gain_rate_lb_wk: { blocks_2_5: [0.2, 0.5], blocks_6_7: [0.1, 0.3], alarm: 0.6 }
        bodyweight_lb: { band: [154, 172], hold: [168, 170] }
        protein_g_per_lb: [0.8, 1.0]
        near_max_sets_wk: 6
        working_sets_wk: 28
      rules_retired_or_changed:
        WEIGHT_FLAT: "add 100 kcal after 3 flat weeks — retired under recomp (flat is the plan; v9 makes flat an explicit SUCCESS state)"
        WEIGHT_FAST: "alarm was 0.6 lb/wk two weeks — v9 advisory alarm is 0.5"
        WEIGHT_CAP: "cap was 172 — v9 advisory tripwire is 165"
      nutrition:
        surplus_kcal: { rate_0_4: 200, rate_0_2: 100 }
        adjust: "every third Sunday, 7-day average vs block target line: >1 lb over -> -100; >1 lb under -> +100; never a bigger step"
        maintenance_week: "week 4 of every block at maintenance"
        carbs: "extra on the four lifting days and the limit-climbing day"
        maintenance_definition: "the intake at which the 7-day average holds for two weeks; recorded at end of block 1"

  - version: 10
    effective_from: "2026-09-27"
    reason: "Final post-cut specification integrated (coach/post-cut-final-spec.md, user-authored 2026-09-27; supersedes post-cut-recomp-spec.md where they differ) — 4-week strength wave, concrete accessory schedule, Tue=technique/Fri=limit climbing (v9 had them swapped), emphasis-block volume multiplier, post-cut volume ramp, one-year EXPECTATION ranges, plateau checklist"
    id: bulk-2026-27
    variant: recomposition

    # Accounting-week start (amendment 2026-09-22) — unchanged.
    week_start: saturday

    block_0_loads: "Maintenance: one top single at RPE 8 + one back-off at RPE 7 x 3-5 per lift; top singles at RPE 7 from Nov 16."

    # 5.1 Blocks — UNCHANGED (calendar/emphasis structure kept; the
    # per-block weight/rate values remain the superseded BULK trajectory,
    # for structure/history only — resolvers replace them under the
    # variant exactly as in v8/v9).
    blocks:
      - { n: 0, dates: ["2026-09-21", "2026-12-13"], emphasis: cut,      weight: [163, 154], notes: "Maintenance week + DEXA Nov 2-8. Top singles at RPE 7 from Nov 16." }
      - { n: 1, dates: ["2026-12-14", "2027-01-03"], emphasis: reverse,  weight: [154, 155], notes: "Establish maintenance: expect weight to RISE from glycogen/water/food mass — do NOT treat 154 as the target. Find the intake where the 7-day avg is ~stable 2-3 weeks. New training week at RPE 7; volume_ramp applies (wk1 60-70%, wk2 80-90% of accessory volume)." }
      - { n: 2, dates: ["2027-01-04", "2027-02-28"], emphasis: climbing, weight: [154, 157], rate: 0.4 }
      - { n: 3, dates: ["2027-03-01", "2027-04-25"], emphasis: lifting,  weight: [157, 160], rate: 0.4 }
      - { n: 4, dates: ["2027-04-26", "2027-06-20"], emphasis: climbing, weight: [160, 163], rate: 0.4, notes: "End with an outdoor trip or a comp." }
      - { n: 5, dates: ["2027-06-21", "2027-08-15"], emphasis: lifting,  weight: [163, 166], rate: 0.4 }
      - { n: 6, dates: ["2027-08-16", "2027-10-10"], emphasis: climbing, weight: [166, 168], rate: 0.2 }
      - { n: 7, dates: ["2027-10-11", "2027-12-05"], emphasis: lifting,  weight: [168, 170], rate: 0.2, notes: "Then hold 168-170." }
    # ADVISORY tripwire only (unchanged from v9): the response is the
    # conditioned weight_rules review, never an automatic cut. Block 0
    # keeps 172 via targets_block_0.
    hard_cap_lb: 165

    # Blocks 2-7 are 8 weeks: weeks 1-3 normal, week 4 light, weeks 5-7
    # normal, week 8 test — UNCHANGED. NOTE the deliberate harmony with
    # strength_wave below: an 8-week block is exactly TWO 4-week waves,
    # so block weeks 4 and 8 both land on wave week 4 (deload) — the
    # block's light week IS the wave's deload, and the test week is the
    # second wave's deload carrying the block-result single.
    week_types:
      normal: {}
      light: { week_in_block: 4 }
      test: { week_in_block: 8 }
      applies_to_blocks: [2, 3, 4, 5, 6, 7]

    # NEW (final spec, Strength Periodization): repeating ~4-week wave
    # per lift (S/B/D/OHP). Week 1: top ~5 @ RPE 7-8; week 2: top ~3;
    # week 3: top ~1; week 4: deload/reduced volume. The wave sets the
    # PRESCRIBED TOP REPS each week — the week planner and the §4
    # prescription blocks follow it; READINGS still evaluate through the
    # working-max controller (load_policies) unchanged, and loading
    # still hangs off the working max via the rpe_chart. Avoid routine
    # AMRAP/grinders (policy `never` unchanged).
    #
    # ANCHOR (design decision, 2026-09-27): the wave is anchored to the
    # BLOCK START — wave_week = ((week_in_block - 1) mod 4) + 1 — for
    # every post-cut block (applies_to_blocks below; the cut is outside
    # it). Consequences, reconciled with the block cadence honestly:
    #   * blocks 2-7 (8 wk): weeks 1-3 and 5-7 run tops of 5/3/1; weeks
    #     4 and 8 are wave week 4 — week 4 IS the light week (top at the
    #     light policy's RPE-6 cap, planner uses the wave-restart 5 reps;
    #     reduced volume via deload_volume_multiplier) and week 8 IS the
    #     test week (the deload carries the block-result RPE-8 single:
    #     planner top reps = 1, same reduced volume).
    #   * block 1 (3 wk maintenance calibration): wave weeks 1-3 only
    #     (5/3/1); the deload never fires — block 2 restarts the wave.
    #     The volume_ramp (below) is doing the easing that block anyway.
    strength_wave:
      applies_to_blocks: [1, 2, 3, 4, 5, 6, 7]
      anchor: block_start
      top_reps_by_week: { "1": 5, "2": 3, "3": 1 }
      deload_week: 4
      # Wave week 4 (== light/test weeks in blocks 2-7): non-top planned
      # sets (back-offs + accessories) are scaled by this, min 1 set.
      deload_volume_multiplier: 0.5
      rpe: [7, 8]
      note: "top reps 5/3/1 then deload; readings evaluate via load_policies; light week = wave deload at the RPE-6 cap; test week = wave deload + the RPE-8 single"

    # NEW (final spec, Volume Ramp post-cut): maintenance week 1 runs
    # ~60-70% of planned ACCESSORY volume, week 2 ~80-90%, week 3+ full
    # (recovery adequate). Keyed to whole weeks since the maintenance /
    # block-1 start; the planner scales accessory (non-main-lift) planned
    # sets by the band midpoint, min 1 set. Main-lift tops + back-offs
    # are NOT ramped (the wave + RPE targets govern them).
    volume_ramp:
      anchor_monday: "2026-12-14"
      multipliers_by_week: { "1": [0.6, 0.7], "2": [0.8, 0.9] }
      applies_to: accessories

    # NEW (final spec, Longer Periodization quantified): climbing/
    # calisthenics-emphasis blocks reduce LIFTING volume ~30-40% —
    # heavy exposures PRESERVED, nothing fully off. The planner scales
    # non-top planned sets (back-offs + accessories) by the midpoint
    # (0.65) in climbing-emphasis blocks; top sets are never scaled.
    emphasis_volume:
      climbing_block_lifting_multiplier: [0.6, 0.7]
      preserve: top_sets
      note: "never completely turn off any major adaptation during an emphasis block"

    # 5.2 POST-CUT weekly template (blocks 1-7) — FINAL-SPEC schedule,
    # verbatim-faithful including accessories. NOTE vs v9: Tue climbing
    # is the TECHNIQUE/volume session (V3-V5, onsight + movement
    # quality) and Fri is the LIMIT session (V5-V7+ projects) — v9 had
    # them swapped. Separate Fri lifting and limit climbing by several
    # hours when practical. No heavy lower on Tuesday, ever.
    #
    # `planned` = structured rows the app auto-plans (one row per set).
    # NOW INCLUDES ACCESSORIES (final spec prescribes them concretely).
    # Exercise strings must match the logged names EXACTLY (the curated
    # strength options / exercise_muscle_map prefixes). Rep ranges
    # resolve to the LOW end. `reps: top` = the strength_wave's top reps
    # for that week (5/3/1; test week 1). NEVER carries rpe/notes/
    # weight — those are logged, not planned. HSPU + front-lever
    # progressions stay PROSE (the spec gives quality-set counts but no
    # rep range — the planner never fabricates one).
    weekly_template:
      mon:
        morning: "Squat + lower + muscle-up: MU skill 3-5x1-2 (quality); squat top work per the wave (wk1 ~5 / wk2 ~3 / wk3 ~1 @ RPE 7-8), then squat back-offs ~3x5-8 @ 1-3 RIR; Romanian deadlift 3x6-8; Bulgarian split squat 2x8-12/leg; hanging leg raise 3x8-15."
        afternoon: null
        planned:
          - { exercise: "Muscle Up", sets: 3, reps: 1 }
          - { exercise: "Barbell Squat", sets: 1, reps: top }
          - { exercise: "Barbell Squat", sets: 3, reps: 5 }
          - { exercise: "Romanian Deadlift", sets: 3, reps: 6 }
          - { exercise: "Bulgarian Split Squat", sets: 2, reps: 8 }
          - { exercise: "Hanging Leg Raise", sets: 3, reps: 8 }
      tue:
        morning: "Bench + upper: paused bench top work per the wave, then bench back-offs ~3x5-8; seated cable row 3x6-10; lateral raise 3x10-20; triceps extension 2x8-15; face pull 2x12-20; external rotation 2x12-20 easy. Avoid unnecessary extra pulling — climbing supplies substantial pulling/finger volume. No squat or deadlift today, ever."
        afternoon: "Climb 1 — TECHNIQUE/volume session (~V3-V5, onsight + movement-quality focus; partner day). Track new V5+ sends/onsights."
        planned:
          - { exercise: "Flat Barbell Bench Press", sets: 1, reps: top }
          - { exercise: "Flat Barbell Bench Press", sets: 3, reps: 5 }
          - { exercise: "Seated Cable Row", sets: 3, reps: 6 }
          - { exercise: "Lateral Dumbbell Raise", sets: 3, reps: 10 }
          - { exercise: "Triceps Extension", sets: 2, reps: 8 }
          - { exercise: "Cable Face Pull", sets: 2, reps: 12 }
          - { exercise: "Cable External Rotation", sets: 2, reps: 12 }
      wed:
        morning: "Calisthenics skill (~30-45 min): handstand practice; HSPU progression 3-4 quality sets; front-lever progression 3-4 quality sets; pistol squat 3x3-6/leg; optional core. Skill quality over fatigue; well short of failure. Recovery/easy day."
        afternoon: null
        planned:
          - { exercise: "Pistol Squat", sets: 3, reps: 3 }
      thu:
        morning: "Norwegian 4x4 VO2 (warmup, 4x4 min hard, ~3 min recovery, cooldown). Track workload, Z4/Z5 exposure, HR. Purpose is cardiovascular adaptation, not calories. No additional high-fatigue training today."
        afternoon: null
      fri:
        morning: "Deadlift + lower volume: deadlift top work per the wave, then deadlift back-offs ~2x4-6 (supplemental deadlift volume stays lower — fatigue cost); leg press or hack squat 3x8-12; leg curl 3x8-15; calf raise 3x8-15."
        afternoon: "Climb 2 — LIMIT session (hard V5-V7+ projects, long rests, low junk volume). Separate lifting and climbing by several hours when practical. Track limit-project progress."
        planned:
          - { exercise: "Barbell Deadlift", sets: 1, reps: top }
          - { exercise: "Barbell Deadlift", sets: 2, reps: 4 }
          - { exercise: "Leg Press", sets: 3, reps: 8 }
          - { exercise: "Leg Curl", sets: 3, reps: 8 }
          - { exercise: "Calf Raise", sets: 3, reps: 8 }
      sat:
        morning: "OHP + upper hypertrophy: OHP top work per the wave, then OHP back-offs ~3x5-8; bench 3x6-10 (second exposure); seated cable row 3x8-12; lateral raise 3x12-20; EZ-bar/preacher curl 2-3x8-15; triceps extension 2-3x8-15; face pull 2x12-20; external rotation 2x12-20 — mind total weekly pulling volume vs the 8-12 band."
        afternoon: null
        planned:
          - { exercise: "Overhead Press", sets: 1, reps: top }
          - { exercise: "Overhead Press", sets: 3, reps: 5 }
          - { exercise: "Flat Barbell Bench Press", sets: 3, reps: 6 }
          - { exercise: "Seated Cable Row", sets: 3, reps: 8 }
          - { exercise: "Lateral Dumbbell Raise", sets: 3, reps: 12 }
          - { exercise: "EZ-Bar Preacher Curl", sets: 2, reps: 8 }
          - { exercise: "Triceps Extension", sets: 2, reps: 8 }
          - { exercise: "Cable Face Pull", sets: 2, reps: 12 }
          - { exercise: "Cable External Rotation", sets: 2, reps: 12 }
      sun:
        morning: null
        afternoon: "Recovery: no hard training; walking/easy activity encouraged; optional easy Zone 2 if recovery is good."

    # 5.2c Planned-lift alternation — block-0 only, UNCHANGED.
    planned_alternation:
      anchor_monday: "2026-09-21"
      note: "A week = squat heavy + deadlift light; B week = deadlift heavy + squat light"

    # 5.2b Block-0 weekly template (cut phase) — UNCHANGED.
    weekly_template_block_0:
      mon:
        morning: "Squat: one hard single at RPE 8 + one back-off at RPE 7 x 3-5. Squat/deadlift alternate weekly: squat heavy + deadlift light, then swap. Face pulls + external rotations."
        afternoon: null
        planned:
          a: # squat heavy: hard single + back-off triple
