      wed:
        morning: "Bike 4x4; 10 min hip and thoracic mobility. Easy day."
        afternoon: null
      thu:
        morning: "Deadlift heavy: top set of 1-3, then 3x3 at 82%; press heavy: top set, then 4x3."
        afternoon: null
      fri:
        morning: null
        afternoon: "Climb 2, board/steep-wall power. Max hangs first in climbing blocks."
      sat:
        morning: "Bench: one single at RPE 8.5, then 3x8 at 70%; weighted pull-ups 5x3, rows, face pulls; squat: one single at RPE 8.5, then 3x8 at 70%; optional deadlift 3x5 at 65% only after four clean weeks. Longest session."
