        - { pct_top: 0.60, reps: 3, min_above_lb: 135 }
        - { pct_top: 0.80, reps: 1, min_above_lb: 135 }

    # 5.2e Working-weight fill (weekly auto-planning, user-approved
    # 2026-09-21). Planned working sets get
    #   weight = reference e1rm x pct_by_reps[planned reps], round 5
