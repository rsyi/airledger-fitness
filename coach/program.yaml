      squat_lb: [345, 375]
      deadlift_lb: [370, 405]
      ohp_lb: [150, 165]
      climbing: "V6-V7 increasingly consistent; V8 legitimate project territory"
      vo2: "~5-10% greater sustainable 4x4 workload at comparable effort"

    # Conditioned weight rules + plateau checklist — UNCHANGED.
    weight_rules:
      flat_scale: "SUCCESS when strength/lean mass are rising — a flat scale NEVER triggers +100 kcal"
      allow_rise: "let body weight increase when waist/BF are stable and performance/lean mass are improving"
      cut_trigger: "weight AND waist consistently rising WITHOUT performance/lean-mass improvement -> reduce calories modestly"
      stall_trigger: "lean mass and strength stall despite high adherence, recovery and appropriate volume -> run the plateau_checklist FIRST; only if every item is consistently adequate: ~+100 kcal/day for one block, reassess; NOT a return to bulking"
    plateau_checklist:
      before_adding_calories:
        - inadequate volume
        - inadequate proximity to failure
        - poor progressive overload
        - insufficient carbs
        - poor sleep/recovery
        - excessive climbing/calisthenics overlap
        - inconsistent adherence
      then: "if ALL inputs are consistently adequate and progress remains stalled: ~+100 kcal/day for one block, reassess; maintain ~13% BF throughout — no traditional bulk/cut cycle"

    # 2.6 flag rule ids — UNCHANGED.
    rules:
      - WEIGHT_FAST
      - WEIGHT_CAP
      - WEIGHT_DRIFT
      - PHASE_MISMATCH
      - NEAR_MAX_LOW
      - WORKING_LOW
      - LONG_SETS
      - BENCH_ONCE
      - TUESDAY_LOWER
      - CLIMB_OVER
      - BIKE_DROP
      - TOP_SET_HEAVY
      - PAIN_NOTE
      - TWO_SIGNALS
      - BLOCK_END

    # 5.5 Nutrition — UNCHANGED.
    nutrition:
      intake: "~maintenance (spec: 'calories ~maintenance, not deliberate surplus')"
      protein: "160-175 g/day, every day"
      fat: "minimum ~55-65 g/day"
      carbs: "~225-300 g/day = remaining calories; bias toward lifting/climbing/VO2 days; ~50-75 g in the 1-3 h before demanding training as a default"
      adjust: "conditioned, not scale-automatic — see weight_rules + plateau_checklist"
      maintenance_week: "week 4 of every block at maintenance (identical to the rest of the week under recomp)"

    # Maintenance semantics — UNCHANGED.
    maintenance:
      established: "the calorie level where the 7-day average is ~stable for 2-3 weeks (~3 weeks after the BF target); record the maintenance calorie estimate AND the glycogen-replete weight baseline"
      note: "expect weight to RISE off the cut from glycogen/water/food mass — 154 is NOT the long-term weight target"
      refind: "re-establish whenever the 7-day average trends steadily for 3+ weeks"

    # Gauges — UNCHANGED.
    gauges:
      fat: "waist at the navel, weekly 7-day average; DEXA every 3-4 months"
      muscle: "DEXA lean mass every 3-4 months; strength progression; hypertrophy performance; test-week singles every 8 weeks"
      climbing: "new V5+ sends/onsights (technique/volume days, Tue) + limit-project progress (limit days, Fri)"
      waist_status: "not tracked yet"
    stall_rule: "lean mass + strength stalled across two DEXA scans with every plateau_checklist input delivered -> +100 kcal/day for one block, then re-check; NOT a return to bulking"

    # Climbing differentiation — UNCHANGED (post-cut Tue = technique,
    # Fri = limit; the CUT base week is the opposite: Tue hard, Fri
    # light — declared in routine.week).
    climbing:
      sessions_per_wk: 2
      types:
        technique_volume: "~V3-V5, onsight + movement-quality focus (default Tue, partner day)"
        limit: "hard V5-V7+ projects, long rests, low junk volume (default Fri; separate from the deadlift session by several hours when practical)"
      tracking: "new V5+ sends/onsights + limit-project progress"
      future: "climbing-emphasis blocks may run 3x/week with lifting volume reduced 30-40% (emphasis_volume); heavies preserved"
    calisthenics:
      mode: "skill training, not high-fatigue hypertrophy — low-fatigue high-quality practice, long rests, stop when quality deteriorates"
      skills: [muscle-up, handstand/HSPU, front lever, pistol squat, hanging leg raise/core]

    # The superseded bulk numbers, kept for reference (the simulator's
    # 'Bulk plan (inactive)' preset). NOT read by the resolvers.
    inactive_bulk_variant:
      hard_cap_lb: 172
      band_lb: [154, 172]
      hold_lb: [168, 170]
      targets:
        gain_rate_lb_wk: { blocks_2_5: [0.2, 0.5], blocks_6_7: [0.1, 0.3], alarm: 0.6 }
        bodyweight_lb: { band: [154, 172], hold: [168, 170] }
        protein_g_per_lb: [0.8, 1.0]
        near_max_sets_wk: 6
        working_sets_wk: 28
      rules_retired_or_changed:
        WEIGHT_FLAT: "add 100 kcal after 3 flat weeks — retired under recomp (flat is an explicit SUCCESS state)"
        WEIGHT_FAST: "alarm was 0.6 lb/wk two weeks — advisory alarm is 0.5"
        WEIGHT_CAP: "cap was 172 — advisory tripwire is 165"
      nutrition:
        surplus_kcal: { rate_0_4: 200, rate_0_2: 100 }
        adjust: "every third Sunday, 7-day average vs block target line: >1 lb over -> -100; >1 lb under -> +100; never a bigger step"
        maintenance_week: "week 4 of every block at maintenance"
        carbs: "extra on the four lifting days and the limit-climbing day"
        maintenance_definition: "the intake at which the 7-day average holds for two weeks; recorded at end of block 1"
